[project]
name = "kalshi-research"
version = "0.1.0"
description = "Paper/replay Kalshi BTC research (Pulseforge packages/kalshi-research; not for live trading or deploy)"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
  "sqlalchemy>=2.0,<3",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.36,<2", "pandas>=2.2,<3"]
dev = ["pytest>=8,<9"]

[project.scripts]
kalshi-research = "kalshi_research.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kalshi_research*"]
