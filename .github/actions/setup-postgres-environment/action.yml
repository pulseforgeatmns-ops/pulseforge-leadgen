name: Setup PostgreSQL Environment
description: >-
  SPEC-120 — PostgreSQL binaries for disposable harness tests. Uses the runner
  image's PostgreSQL when pg_config, initdb, pg_ctl and psql validate; falls
  back to cached apt installation otherwise. Validates runner prerequisites
  and records environment observability.

inputs:
  stage-file:
    description: Path to append stage timing JSON lines
    required: false
    default: ci-stage-timings.jsonl

outputs:
  postgres-source:
    description: How PostgreSQL binaries were provisioned
    value: ${{ steps.provision.outputs.postgres-source }}
  cache-hit:
    description: Whether apt package cache restored successfully
    value: ${{ steps.apt-cache.outputs.cache-hit }}
  bindir:
    description: PostgreSQL binary directory
    value: ${{ steps.provision.outputs.bindir }}
  environment-healthy:
    description: Whether environment validation passed
    value: ${{ steps.validate.outputs.healthy }}

runs:
  using: composite
  steps:
    - name: Record environment stage start
      shell: bash
      run: echo "CI_STAGE_START_environment=$(date +%s)" >> "$GITHUB_ENV"

    - name: Validate runner prerequisites
      id: validate
      shell: bash
      run: |
        set -euo pipefail
        echo "Runner image: ${ImageOS:-unknown} / $(lsb_release -ds 2>/dev/null || uname -sr)"
        echo "Node (pre-setup): $(node --version 2>/dev/null || echo absent)"
        command -v sudo >/dev/null
        test -d /var/cache/apt || sudo mkdir -p /var/cache/apt
        echo "healthy=true" >> "$GITHUB_OUTPUT"

    - name: Restore apt package cache
      id: apt-cache
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/apt-cache
        key: ${{ runner.os }}-apt-postgresql-v1-${{ hashFiles('.github/actions/setup-postgres-environment/action.yml') }}
        restore-keys: |
          ${{ runner.os }}-apt-postgresql-v1-

    - name: Install PostgreSQL binaries
      id: provision
      shell: bash
      env:
        CACHE_DIR: ${{ runner.temp }}/apt-cache
      # Runner-image binaries first (validated pg_config, initdb, pg_ctl,
      # psql); the previous apt installation is the fallback. See provision.sh.
      run: bash "${{ github.action_path }}/provision.sh"

    - name: Record environment stage duration
      shell: bash
      run: |
        end=$(date +%s)
        start="${CI_STAGE_START_environment:-$end}"
        duration=$((end - start))
        cache_hit="${{ steps.apt-cache.outputs.cache-hit }}"
        postgres_source="${{ steps.provision.outputs.postgres-source }}"
        line=$(node -e "console.log(JSON.stringify({
          stage: 'environment',
          durationSeconds: Number(process.argv[1]),
          cacheHit: process.argv[2] === 'true',
          postgresSource: process.argv[3] || 'unknown',
          runnerImage: process.env.ImageOS || 'unknown',
          infrastructureHealth: 'ok'
        }))" "$duration" "$cache_hit" "$postgres_source")
        echo "$line" >> "${{ inputs.stage-file }}"
        echo "Environment stage: ${duration}s (source: ${postgres_source}; apt cache hit: ${cache_hit})"
