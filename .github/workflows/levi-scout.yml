name: Levi Scout (tenant 21) contract and audit
on:
  pull_request:
    paths:
      - 'services/leviScoutProductionContract.js'
      - 'services/leviScoutResearchOnlyExecution.js'
      - 'services/leviScoutBorrowerDiscovery.js'
      - 'services/leviScoutApprovedCriteria.js'
      - 'services/leviScoutProductionDeps.js'
      - 'services/leviScoutProductionRunner.js'
      - 'services/leviScoutSchedule.js'
      - 'services/leviScoutEnablement.js'
      - 'services/leviScoutMaxDelivery.js'
      - 'services/leviScoutBlueprintReadiness.js'
      - 'services/leviScoutContactResearch.js'
      - 'services/leviScoutEnrichment.js'
      - 'services/leviScoutMaxReview.js'
      - 'services/leviScoutSignalModel.js'
      - 'services/leviScoutProvenance.js'
      - 'services/leviScoutSodaClient.js'
      - 'services/leviScoutCityBackfill.js'
      - 'services/leviScoutCriteriaReconcile.js'
      - 'scripts/leviScoutProductionAudit.js'
      - 'scripts/leviScoutProductionSmoke.js'
      - 'scripts/leviScoutSignalValidation.js'
      - 'scripts/leviScoutCityBackfill.js'
      - 'scripts/leviScoutChicagoContactCoverage.js'
      - 'scripts/leviScoutCriteriaReconcile.js'
      - 'scripts/auditLeviTenant21PostPr1157.js'
      - 'test/auditLeviTenant21PostPr1157.test.js'
      - 'test/leviScoutP0Reliability.test.js'
      - 'migrations/2026-11-24-levi-scout-cycle-claim-unique*.sql'
      - 'utils/setterVisibility.js'
      - 'utils/anchorOutreachReview.js'
      - 'test/setterVisibilityReviewHoldPostgres.test.js'
      - 'test/leviTenant21ClientAccessPostgres.test.js'
      - 'test/tenantPilotPolicy*.test.js'
      - 'utils/tenantPilotPolicy.js'
      - 'utils/anchorResearchProviderPause.js'
      - 'utils/agentDispatchPolicy.js'
      - 'utils/callEligibility.js'
      - 'utils/placesApi.js'
      - 'lib/serpapi.js'
      - 'dbClient.js'
      - 'enrichProspects.js'
      - 'services/tenantOutreachScheduler.js'
      - 'routes/emmettOutbound.js'
      - 'routes/acquisitionMissions.js'
      - 'packages/acquisition-mission/ExecutionRouter.js'
      - 'packages/acquisition-mission/TransactionalExecution.js'
      - 'middleware/auth.js'
      - 'routes/tenantOutreach.js'
      - 'packages/max/workspace/LeviScoutReviewContext.js'
      - 'services/reviewOnlyProspectImportService.js'
      - 'routes/reviewOnlyProspectImport.js'
      - 'test/reviewOnlyProspectImportService.test.js'
      - 'packages/max/workspace/ProspectDealClaims.js'
      - 'packages/max/workspace/ScoutAcquisitionContext.js'
      - 'routes/cron.js'
      - 'test/leviScout*.test.js'
      - '.github/workflows/levi-scout.yml'
      - '.github/workflows/levi-scout-weekly.yml'
jobs:
  levi-scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: ./.github/actions/setup-postgres-environment
      - run: npm ci --ignore-scripts
      - name: Contract, research-only gates and read-only audit on disposable PostgreSQL (no skips)
        run: npm run test:scout:levi
