name: SPEC-253 Mailbox Poll Verify

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: SPEC-253 production tenant mailbox poll acceptance
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: https://pulseforge-leadgen-production.up.railway.app
        run: node scripts/verifySpec253MailboxPollProduction.js
