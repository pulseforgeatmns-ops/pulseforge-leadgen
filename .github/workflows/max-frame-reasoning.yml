name: Max frame-directed reasoning
on:
  pull_request:
    paths:
      - 'packages/max/frameReasoning/**'
      - 'packages/max/interpretation/TurnFrame.js'
      - 'packages/max/workspace/WorkspaceTypes.js'
      - '.github/workflows/max-frame-reasoning.yml'
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: node --require ./test/helpers/denyWebsiteEvidenceNetwork.cjs --test packages/max/frameReasoning/tests/*.test.js
