name: Execute Anchor One Outbound

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/executeAnchorOneOutbound.js
      - .github/workflows/execute-anchor-one-outbound.yml

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: One controlled Anchor outbound send
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: node scripts/executeAnchorOneOutbound.js --confirm-production
