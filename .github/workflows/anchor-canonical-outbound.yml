name: Anchor Canonical Outbound Recovery

on:
  workflow_dispatch:
    inputs:
      mode:
        description: inspect (read-only) or recover-to-ready (no send)
        required: true
        default: recover-to-ready
        type: choice
        options:
          - inspect
          - recover-to-ready
  pull_request:
    paths:
      - 'scripts/lib/anchorCanonicalOutbound.js'
      - 'scripts/inspectAnchorCanonicalOutbound.js'
      - 'scripts/recoverAnchorCanonicalOutbound.js'
      - 'test/anchorCanonicalOutboundRecovery.test.js'
      - 'routes/cron.js'
      - '.github/workflows/anchor-canonical-outbound.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/lib/anchorCanonicalOutbound.js'
      - 'scripts/inspectAnchorCanonicalOutbound.js'
      - 'scripts/recoverAnchorCanonicalOutbound.js'
      - 'test/anchorCanonicalOutboundRecovery.test.js'
      - 'routes/cron.js'
      - '.github/workflows/anchor-canonical-outbound.yml'

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Focused recovery tests
        run: node --test test/anchorCanonicalOutboundRecovery.test.js

  # Manual only. Never attach to GitHub environment "charming-trust / production"
  # (that name is Railway's deployment environment; a failed Actions job there
  # marks the Railway GitHub deployment failed). GitHub repo secrets have been
  # empty; live recovery runs on Railway with --confirm-production.
  production:
    if: github.event_name == 'workflow_dispatch'
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Recover only when production DATABASE_URL is present
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_PLACES_KEY: ${{ secrets.GOOGLE_PLACES_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::DATABASE_URL is not configured in GitHub Actions secrets. Run on Railway: node scripts/recoverAnchorCanonicalOutbound.js --confirm-production"
            exit 1
          fi
          if [ "${MODE}" = "inspect" ]; then
            node scripts/inspectAnchorCanonicalOutbound.js --confirm-production
          else
            node scripts/recoverAnchorCanonicalOutbound.js --confirm-production
          fi
