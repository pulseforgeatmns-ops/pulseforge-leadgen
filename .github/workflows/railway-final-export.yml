name: Railway final export (read-only, one-shot)

# Runs scripts/migration/exportFinalSnapshot.py from a GitHub-hosted runner
# against the pinned public TCP proxy of the Railway Postgres service. Used
# because Railway refuses new deployments (trial expired) and the agent
# sandbox cannot open raw TCP. Read-only: one REPEATABLE READ READ ONLY
# snapshot, pg_dump --snapshot, fingerprints in the same snapshot, upload to
# the MigrationBackup bucket (refuses overwrite), re-download checksum.
#
# Fires only when docs/migration/final-export-request.json changes on the
# cutover branch. Fails closed without the secrets below. Logs counts and
# checksums only.
#
# Required repository secrets (owner adds them; never commit values):
#   RAILWAY_PG_PASSWORD          Railway -> amused-harmony -> Postgres -> Variables -> PGPASSWORD
#   MIGRATION_S3_ACCESS_KEY_ID   Railway -> amused-harmony -> MigrationBackup -> Credentials
#   MIGRATION_S3_SECRET_ACCESS_KEY

on:
  push:
    branches: [claude/pulseforge-railway-render-cutover-m1r15e]
    paths: [docs/migration/final-export-request.json]

permissions:
  contents: read

concurrency:
  group: railway-final-export
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Read request
        id: req
        run: |
          set -euo pipefail
          f=docs/migration/final-export-request.json
          key=$(jq -er '.backupObjectKey' "$f")
          approval=$(jq -er '.approval' "$f")
          [ "$approval" = "YES_READ_ONLY_SNAPSHOT_TO_BUCKET" ] || { echo "::error::request not approved"; exit 1; }
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Check secrets present
        env:
          A: ${{ secrets.RAILWAY_PG_PASSWORD }}
          B: ${{ secrets.MIGRATION_S3_ACCESS_KEY_ID }}
          C: ${{ secrets.MIGRATION_S3_SECRET_ACCESS_KEY }}
        run: |
          [ -n "$A" ] && [ -n "$B" ] && [ -n "$C" ] || { echo "::error::missing RAILWAY_PG_PASSWORD / MIGRATION_S3_* secrets"; exit 1; }

      - name: Install PostgreSQL 18 client
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18 python3-boto3 python3-psycopg2
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - name: Export
        env:
          FINAL_EXPORT_APPROVED: YES_READ_ONLY_SNAPSHOT_TO_BUCKET
          FINAL_EXPORT_SOURCE: railway_public_proxy
          FINAL_EXPORT_EXTERNAL_APPROVED: YES_PINNED_RAILWAY_TCP_PROXY
          PGHOST: shinkansen.proxy.rlwy.net
          PGPORT: "43478"
          PGUSER: postgres
          PGDATABASE: railway
          PGSSLMODE: require
          PGPASSWORD: ${{ secrets.RAILWAY_PG_PASSWORD }}
          S3_ENDPOINT: https://t3.storageapi.dev
          S3_BUCKET: migrationbackup-njzkny-vy
          S3_REGION: auto
          S3_ACCESS_KEY_ID: ${{ secrets.MIGRATION_S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.MIGRATION_S3_SECRET_ACCESS_KEY }}
          BACKUP_OBJECT_KEY: ${{ steps.req.outputs.key }}
        run: python3 scripts/migration/exportFinalSnapshot.py
