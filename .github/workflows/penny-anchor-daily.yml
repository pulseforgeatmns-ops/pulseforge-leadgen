name: Penny Anchor daily review

# Manual dispatch only (owner directive, MAX-P0-003 final review, 2026-11-25):
# the daily schedule is paused without invoking the workflow. Restore
# `schedule: - cron: '0 12 * * *'` only under explicit Penny activation approval.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: penny-anchor-daily-production
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run Anchor paid-media review
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          # Repository variable PULSEFORGE_APP_URL moves this caller at cutover
          # without a code change; unset keeps the current production host.
          APP_URL: ${{ vars.PULSEFORGE_APP_URL || 'https://pulseforge-api-migration.onrender.com' }}
        run: |
          test -n "$CRON_SECRET"
          payload=$(jq -n --arg secret "$CRON_SECRET" '{secret: $secret, client_id: 10}')
          curl --fail-with-body --retry 2 --retry-all-errors \
            --request POST \
            --header 'Content-Type: application/json' \
            --data "$payload" \
            "${APP_URL%/}/cron/penny-daily"
