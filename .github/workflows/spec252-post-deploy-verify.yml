name: SPEC-252 Post-Deploy Verify

on:
  workflow_dispatch:
    inputs:
      schedule:
        description: 'Create new Babrun canary schedule after checks pass'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      expected_sha:
        description: 'Expected production SHA prefix (optional override)'
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/spec252-post-deploy-verify.yml'
      - 'scripts/verifySpec252PostDeployAndScheduleBabrunCanary.js'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Resolve deployed production SHA
        id: sha
        run: |
          SHA=$(gh api repos/${{ github.repository }}/deployments --jq '.[0].sha' 2>/dev/null || true)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: SPEC-252 verify and schedule Babrun canary
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: https://pulseforge-leadgen-production.up.railway.app
          EXPECTED_PRODUCTION_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_sha || steps.sha.outputs.sha }}
          SCHEDULE_ENABLED: ${{ github.event_name == 'workflow_dispatch' && inputs.schedule || 'true' }}
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "DATABASE_URL and CRON_SECRET must be configured to run post-deploy verification."
            exit 1
          fi
          ARGS=()
          if [ "${SCHEDULE_ENABLED}" = "true" ]; then ARGS+=(--schedule); fi
          if [ -n "${EXPECTED_PRODUCTION_SHA:-}" ]; then ARGS+=(--expected-sha="${EXPECTED_PRODUCTION_SHA}"); fi
          node scripts/verifySpec252PostDeployAndScheduleBabrunCanary.js "${ARGS[@]}"
