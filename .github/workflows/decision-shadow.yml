name: Decision shadow review
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  decision-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: ./.github/actions/setup-postgres-environment
      - run: npm ci --ignore-scripts
      - run: npm run test:decision
      - run: npm run test:decision:postgres
