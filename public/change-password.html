<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pulseforge — Choose a new password</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;500&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#040810; color:#e8f0fe; font-family:'DM Sans',sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; }
.box { width:400px; background:#070d1a; border:1px solid rgba(96,48,177,0.25); border-radius:16px; padding:2.5rem; }
.logo { font-family:'Bebas Neue',sans-serif; font-size:1.8rem; letter-spacing:4px; margin-bottom:1.25rem; display:flex; align-items:center; gap:10px; }
.logo-dot { width:10px; height:10px; background:#8b5cf6; border-radius:50%; box-shadow:0 0 12px #8b5cf6; }
h1 { font-size:1.35rem; font-weight:600; margin-bottom:0.5rem; }
.lead { color:#6b7fa0; line-height:1.5; margin-bottom:1.5rem; }
label { font-family:'JetBrains Mono',monospace; font-size:0.6rem; letter-spacing:2px; text-transform:uppercase; color:#6b7fa0; display:block; margin-bottom:0.4rem; }
input { width:100%; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08); border-radius:6px; padding:0.8rem 1rem; color:#e8f0fe; font-size:0.9rem; outline:none; margin-bottom:1.1rem; }
input:focus { border-color:#8b5cf6; }
button { width:100%; background:#8b5cf6; border:none; border-radius:6px; padding:0.85rem; color:#040810; font-family:'JetBrains Mono',monospace; font-size:0.75rem; font-weight:500; letter-spacing:2px; text-transform:uppercase; cursor:pointer; }
button:hover { background:#7c3aed; }
.err { color:#ff3b5c; font-size:0.8rem; margin-bottom:0.8rem; min-height:1.1rem; }
.success h1 { color:#00e676; }
.success .lead { white-space:pre-line; }
</style>
</head>
<body>
<div class="box" id="formBox">
  <div class="logo"><div class="logo-dot"></div>PULSEFORGE</div>
  <h1>Welcome to PulseForge.</h1>
  <p class="lead">Before we begin,<br>please choose a new password.</p>
  <div class="err" id="err"></div>
  <form id="form">
    <label for="password">New password</label>
    <input id="password" name="password" type="password" minlength="8" required autocomplete="new-password" autofocus>
    <button type="submit">Update password</button>
  </form>
</div>
<div class="box success" id="doneBox" hidden>
  <div class="logo"><div class="logo-dot"></div>PULSEFORGE</div>
  <h1>Password Updated</h1>
  <p class="lead">Your workspace is ready.</p>
  <a href="/dashboard"><button type="button">Continue →</button></a>
</div>
<script>
document.getElementById('form').addEventListener('submit', async function(e) {
  e.preventDefault();
  const err = document.getElementById('err');
  err.textContent = '';
  const password = document.getElementById('password').value;
  const res = await fetch('/api/me/password', {
    method: 'POST',
    credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
    body: JSON.stringify({ password: password }),
  });
  const data = await res.json().catch(function() { return {}; });
  if (!res.ok) {
    err.textContent = data.message || 'Could not update password.';
    return;
  }
  document.getElementById('formBox').hidden = true;
  document.getElementById('doneBox').hidden = false;
});
</script>
</body>
</html>
