<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paige social review</title>
<style>body{font:16px/1.5 system-ui;background:#f4f6f7;color:#172d36;margin:0}main{max-width:960px;margin:40px auto;padding:24px}h1{margin-bottom:4px}a{color:#17627b}article,form{background:white;border:1px solid #dbe3e6;border-radius:12px;padding:24px;margin:20px 0}label{display:block;margin:12px 0}input,select,textarea,button{font:inherit;padding:9px;border:1px solid #b5c6cd;border-radius:6px}textarea{display:block;width:95%;min-height:75px}button{background:#173a48;color:white;cursor:pointer;margin:5px}button:disabled{opacity:.5}pre{white-space:pre-wrap;word-break:break-word;font:inherit;border-left:3px solid #bccfd5;padding:14px}small{display:block;overflow-wrap:anywhere;color:#526670}.error{color:#9c2626}.status{font-weight:600}.review{background:#f1f7f8;padding:18px}header{display:flex;justify-content:space-between;align-items:center;gap:16px}</style></head>
<body><main><header><div><h1>Paige social review</h1><p>Max requests. Paige drafts. You approve the exact post and account.</p></div><a href="/dashboard">Dashboard</a></header>
<form id="request"><h2>Request a draft</h2><label>Client <input id="client" type="number" min="1" required></label><label>Channel <select id="channel"><option value="linkedin_page">LinkedIn Page</option><option value="linkedin_personal">LinkedIn Personal</option><option value="facebook_page">Facebook Page</option><option value="google_business">Google Business Profile</option></select></label><label>Objective <textarea id="objective" required></textarea></label><label>Campaign reference, optional <input id="campaign"></label><button>Ask Max to request content</button><button type="button" id="reload">Load client drafts</button></form>
<p id="message" role="status"></p><section id="drafts"></section></main>
<script>
const $ = id => document.getElementById(id);
let scope = new URLSearchParams(location.search).get('client_id');
$('client').value = scope || '';
const element = (tag, text, className) => { const e=document.createElement(tag); e.textContent=text; if(className)e.className=className; return e; };
function message(text, error=false){$('message').textContent=text;$('message').className=error?'error':'';}
async function api(path='', body){const cid=$('client').value||scope;const suffix=cid?`client_id=${encodeURIComponent(cid)}`:'';const r=await fetch(`/api/paige/social${path}${path.includes('?')?'&':'?'}${suffix}`,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{});const data=await r.json();if(!r.ok)throw new Error(data.error||'Request failed');return data;}
function button(parent,label,fn){const b=element('button',label);b.type='button';b.onclick=async()=>{b.disabled=true;try{await fn();}catch(e){message(e.message,true);}finally{b.disabled=false;}};parent.append(b);}
async function load(){try{const data=await api();scope=String(data.clientId);$('client').value=scope;$('drafts').replaceChildren();for(const a of data.artifacts){const card=element('article','');card.append(element('h2',a.label),element('p',`${a.approvalState} · ${a.publishState}`,'status'),element('pre',a.body),element('small',`Objective: ${a.contentObjective||'Unspecified'} · Mission: ${a.missionId||'None'} · Campaign: ${a.meta?.campaignId||'None'}`));if(a.publishError)card.append(element('p',a.publishError,'error'));if(a.publication?.outcomeError)card.append(element('p','Published; outcome log needs retry.','error'));
const destination=element('select','');for(const account of data.accounts.filter(x=>x.platform===a.platform)){const option=element('option',`${account.id} · ${account.externalAccountId}`);option.value=account.id;destination.append(option);}card.append(destination);
if(['PENDING_APPROVAL','APPROVED'].includes(a.approvalState)&&['NOT_PUBLISHED','FAILED'].includes(a.publishState)){button(card,'Review exact post and account',async()=>{const p=await api(`/${a.id}/preview?account_id=${encodeURIComponent(destination.value)}`);const review=element('div','','review');review.append(element('h3','Approve this version'),element('p',`${p.account.platform} · ${p.account.id} · ${p.account.externalAccountId}`),element('pre',p.artifact.body),element('small',`Approval fingerprint: ${p.approvalHash}`));button(review,'Approve this exact version',async()=>{await api(`/${a.id}/decision`,{decision:'approve',accountId:p.account.id,expectedApprovalHash:p.approvalHash});message('Approved. Use Publish approved post when ready.');await load();});card.append(review);});button(card,'Reject draft',async()=>{await api(`/${a.id}/decision`,{decision:'reject'});await load();});}
if(a.approvalState==='APPROVED'){button(card,a.publishState==='PUBLISHED'?'Retry outcome log':a.publishState==='VERIFYING'?'Verify provider result':'Publish approved post / retry',async()=>{try{const r=await api(`/${a.id}/publish`,{});message(r.published?'Publication verified.':'Publish checked.');}finally{await load();}});}
if(['UNKNOWN','PUBLISHING'].includes(a.publishState)){const post=element('input','');post.placeholder='Existing provider post ID';const reason=element('input','');reason.placeholder='Where you found this post';card.append(post,reason);button(card,'Reconcile existing provider post',async()=>{await api(`/${a.id}/reconcile`,{providerPostId:post.value,reason:reason.value});await load();});}
if(a.publishedUrl&&/^https:\/\//.test(a.publishedUrl)){const link=element('a','View published post');link.href=a.publishedUrl;link.target='_blank';link.rel='noopener noreferrer';card.append(link);}if(a.publication?.outcomeId){card.append(element('small',`Outcome publication: ${a.publication.outcomeId}`));const link=element('a','Capture engagement and outcomes');link.href=`/content-outcomes?client_id=${scope}`;card.append(link);}if(a.publication?.attempts?.length)card.append(element('small',`Attempts: ${a.publication.attempts.length} · Provider status: ${a.publication.providerStatus||'unknown'} · Post ID: ${a.publication.providerPostId||a.publication.receipt?.externalPostId||'not recorded'}`));$('drafts').append(card);}}catch(e){message(e.message,true);}}
$('reload').onclick=load;$('request').onsubmit=async e=>{e.preventDefault();message('Max is requesting a draft from Paige…');try{const r=await api('/request',{channel:$('channel').value,objective:$('objective').value,campaignId:$('campaign').value});message(r.result.summary);await load();}catch(e){message(e.message,true);}};load();
</script></body></html>
