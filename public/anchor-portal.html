<style>
:root{

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.5;min-height:100vh}
h1,h2,h3{font-family:'Fraunces',Georgia,serif;font-weight:500;line-height:1.15}
.shell{max-width:920px;margin:0 auto;padding:0 20px 48px}
.top{background:rgba(248,245,238,.94);border-bottom:1px solid rgba(17,31,43,.12);position:sticky;top:0;z-index:10;backdrop-filter:blur(12px)}
.top-inner{max-width:920px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}
.brand-mark{width:26px;height:26px;border-radius:50%;border:2px solid var(--brass);background:var(--navy)}
.brand-text{font-family:'Fraunces',serif;font-size:20px}
.brand-sub{display:block;font-family:'Inter',sans-serif;font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--brass-deep);margin-top:2px}
.top-actions{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-soft)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:10px 16px;border-radius:4px;border:1px solid var(--navy);background:var(--navy);color:var(--paper);font-size:13px;font-weight:600;cursor:pointer;text-decoration:none}

.btn.small{min-height:34px;padding:6px 12px;font-size:12px}
.hero{padding:28px 0 8px}
.hero h1{font-size:clamp(28px,5vw,40px);margin-bottom:6px}
.hero p{color:var(--ink-soft);max-width:52ch;font-size:15px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 16px}
.tab{padding:8px 14px;border:1px solid var(--line);background:var(--white);font-size:12px;font-weight:600;cursor:pointer;border-radius:999px;color:var(--ink-soft)}

.panel{background:var(--white);border:1px solid var(--line);border-radius:8px;padding:18px;margin-bottom:14px}
.panel h2{font-size:22px;margin-bottom:12px}
.grid{display:grid;gap:12px}
@media(min-width:720px){.grid.cols-2{grid-template-columns:1fr 1fr}}
.stat-label{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--brass-deep);margin-bottom:4px}
.stat-value{font-family:'Fraunces',serif;font-size:26px}

.status-ok{color:var(--ok)}.status-warn{color:var(--warn)}
.list{display:flex;flex-direction:column;gap:10px}

.row:last-child{border-bottom:none;padding-bottom:0}

.badge.resolved{color:var(--ok);border-color:rgba(30,107,69,.35);background:rgba(30,107,69,.08)}
.section-title{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--brass-deep);margin:16px 0 8px}
.check-item{border:1px solid var(--line);border-radius:6px;padding:12px;margin-bottom:8px;background:var(--paper)}
.check-item h4{font-size:15px;margin-bottom:8px}
.outcome-row{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:11px;font-weight:600;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:var(--white);cursor:pointer;color:var(--ink-soft)}
.chip.on{background:var(--navy-2);color:var(--paper);border-color:var(--navy-2)}
.chip.warn.on{background:var(--warn);border-color:var(--warn);color:var(--white)}
textarea,input,select{width:100%;border:1px solid var(--line);border-radius:6px;padding:10px 12px;font:inherit;background:var(--white);margin-top:6px}
textarea{min-height:80px;resize:vertical}
label{font-size:12px;font-weight:600;color:var(--ink-soft)}
.hidden{display:none!important}
.msg{padding:10px 12px;border-radius:6px;font-size:13px;margin-bottom:12px}
.msg.err{background:rgba(155,44,58,.08);border:1px solid rgba(155,44,58,.25);color:var(--bad)}
.msg.ok{background:rgba(30,107,69,.08);border:1px solid rgba(30,107,69,.25);color:var(--ok)}
.demo-banner{background:linear-gradient(90deg,var(--navy),var(--navy-2));color:var(--paper);padding:10px 14px;border-radius:6px;font-size:13px;margin-bottom:14px}
.demo-banner b{color:var(--brass)}
.scope-editor .sec{border:1px dashed var(--line);padding:12px;margin-bottom:10px;border-radius:6px}
.muted{color:var(--ink-soft);font-size:13px}
.footer-note{margin-top:24px;font-size:12px;color:var(--ink-soft);text-align:center}

.field{display:block;margin:14px 0}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:14px 0}.gallery figure{margin:0}.gallery img,.preview img{width:100%;height:170px;object-fit:cover;border-radius:6px}.gallery button{display:block;width:100%;padding:0;border:0;background:transparent;cursor:zoom-in}.gallery figcaption{font-size:12px;color:var(--ink-soft)}.preview{max-width:260px;margin-top:10px}.photo-status{font-size:13px;margin:8px 0}.preserve{white-space:pre-wrap;overflow-wrap:anywhere}.row>div{min-width:0}.row .actions{margin:0}.building-picker{max-width:600px;margin:18px 0}.empty{padding:28px;text-align:center}.lightbox{border:1px solid var(--line);border-radius:10px;max-width:min(96vw,1000px);max-height:94vh;padding:18px;background:var(--paper)}.lightbox::backdrop{background:#0f1b27b3}.lightbox img{display:block;max-width:100%;max-height:75vh;margin:12px auto}.notice{padding:12px;background:var(--paper);border-radius:6px;margin:12px 0}fieldset{border:0;min-width:0}progress{width:100%;height:10px}.sr-only{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0)}
