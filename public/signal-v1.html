<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Signal V1 — Paper Research</title>
  <style>
    :root { color-scheme: dark; --bg:#0f1115; --panel:#171a21; --text:#e8eaed; --muted:#9aa0a6; --accent:#7cb9ff; --risk:#ff8a80; --pass:#81c995; --fail:#ff8a80; }
    body { margin:0; font:14px/1.45 system-ui, sans-serif; background:var(--bg); color:var(--text); }
    header { padding:16px 20px; border-bottom:1px solid #2a2f3a; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
    main { display:grid; grid-template-columns: 320px 1fr; gap:16px; padding:16px; }
    .panel { background:var(--panel); border:1px solid #2a2f3a; border-radius:10px; padding:12px; margin-bottom:12px; }
    h1,h2,h3 { margin:0 0 8px; font-size:16px; }
    select, button { width:100%; padding:8px; border-radius:8px; border:1px solid #3a4254; background:#10131a; color:var(--text); }
    button { cursor:pointer; margin-top:8px; }
    button.secondary { opacity: 0.85; }
    .muted { color:var(--muted); }
    ul { margin:8px 0; padding-left:18px; }
    .risk { color:var(--risk); }
    .timeline-item { border-top:1px solid #2a2f3a; padding:8px 0; font-size:13px; }
    .badge { display:inline-block; padding:2px 8px; border-radius:999px; background:#243047; color:var(--accent); font-size:12px; }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    th, td { border-bottom:1px solid #2a2f3a; padding:6px 4px; text-align:left; }
    td.num { text-align:right; font-variant-numeric: tabular-nums; }
    .outcome-PASS { color: var(--pass); }
    .outcome-FAIL { color: var(--fail); }
    @media (max-width: 960px) { main { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <h1>Signal V1</h1>
    <span class="muted">Paper-only · ground-truth replay</span>
  </header>
  <main>
    <section>
      <div class="panel">
        <h2>Token</h2>
        <select id="tokenSelect"></select>
        <button id="ingestBtn" class="secondary">Ingest market history</button>
        <button id="replayBtn">Run replay</button>
        <button id="evaluateBtn" class="secondary">Evaluate now</button>
        <div id="tokenMeta" class="muted" style="margin-top:12px"></div>
      </div>
      <div class="panel">
        <h2>Historical data</h2>
        <div id="marketMeta" class="muted">No ingestion yet</div>
      </div>
    </section>
    <section>
      <div class="panel">
        <h2>Why <span id="stateBadge" class="badge">—</span></h2>
        <div>Score: <strong id="score">—</strong></div>
        <h3>Positive evidence</h3>
        <ul id="reasons"></ul>
        <h3 class="risk">Risks</h3>
        <ul id="risks" class="risk"></ul>
      </div>
      <div class="panel">
        <h2>Execution-delay outcomes</h2>
        <table>
          <thead>
            <tr>
              <th>Delay</th>
              <th class="num">Entry</th>
              <th>Outcome</th>
              <th class="num">MFE</th>
              <th class="num">MAE</th>
              <th class="num">Time to outcome</th>
            </tr>
          </thead>
          <tbody id="outcomeTable"></tbody>
        </table>
      </div>
      <div class="panel">
        <h2>Replay timeline</h2>
        <div id="replayTimeline"></div>
      </div>
      <div class="panel">
        <h2>Social / on-chain events</h2>
        <div id="timeline"></div>
      </div>
    </section>
  </main>
  <script>
    const tokenSelect = document.getElementById('tokenSelect');
    const casesWithAddress = [];

    function fmtDelay(sec) {
      if (sec < 60) return `${sec} sec`;
      return `${sec / 60} min`;
    }

    function fmtPct(x) {
      if (x == null || Number.isNaN(x)) return '—';
      return `${(x * 100).toFixed(1)}%`;
    }

    function fmtPrice(x) {
      if (x == null) return '—';
      return Number(x).toPrecision(4);
    }

    async function loadCases() {
      const res = await fetch('/api/v1/signal/research-cases');
      const data = await res.json();
      casesWithAddress.push(...data.cases.filter(c => c.tokenAddress));
      tokenSelect.innerHTML = casesWithAddress
        .map(c => `<option value="${c.tokenAddress}">${c.ticker} (${c.addressProvenance})</option>`)
        .join('');
      if (casesWithAddress[0]) await refresh(casesWithAddress[0].tokenAddress);
    }

    function renderList(el, items) {
      el.innerHTML = (items && items.length)
        ? items.map(i => `<li>${i}</li>`).join('')
        : '<li class="muted">None</li>';
    }

    function renderOutcomes(rows) {
      const tbody = document.getElementById('outcomeTable');
      if (!rows || !rows.length) {
        tbody.innerHTML = '<tr><td colspan="6" class="muted">Run replay after ingesting market history</td></tr>';
        return;
      }
      tbody.innerHTML = rows.map(r => {
        const o = r.outcome;
        const entry = r.entry;
        if (!entry || !o) {
          return `<tr><td>${fmtDelay(r.executionDelaySeconds)}</td><td colspan="5" class="muted">No achievable entry</td></tr>`;
        }
        const tOutcome = o.outcomeTimestamp
          ? new Date(o.outcomeTimestamp).toISOString().slice(11, 19)
          : '—';
        return `<tr>
          <td>${fmtDelay(r.executionDelaySeconds)}</td>
          <td class="num">${fmtPrice(entry.effectivePrice)}</td>
          <td class="outcome-${o.label}">${o.label}</td>
          <td class="num">${fmtPct(o.mfe)}</td>
          <td class="num">${fmtPct(o.mae)}</td>
          <td class="num">${tOutcome}</td>
        </tr>`;
      }).join('');
    }

    async function refresh(tokenAddress) {
      const [detail, timeline, market, outcomes] = await Promise.all([
        fetch(`/api/v1/signal/tokens/${tokenAddress}`).then(r => r.json()),
        fetch(`/api/v1/signal/tokens/${tokenAddress}/timeline`).then(r => r.json()),
        fetch(`/api/v1/signal/tokens/${tokenAddress}/market-history`).then(r => r.json()),
        fetch(`/api/v1/signal/tokens/${tokenAddress}/outcomes`).then(r => r.json()),
      ]);
      const c = casesWithAddress.find(x => x.tokenAddress === tokenAddress);
      document.getElementById('tokenMeta').textContent =
        `${c?.ticker || ''} · ${tokenAddress} · ${c?.slug || ''} · claim: ${c?.telegramClaim?.provenance || 'n/a'}`;

      const ing = market.ingestion;
      const obs = market.observations || [];
      document.getElementById('marketMeta').innerHTML = ing
        ? `<div>Provider: <strong>${ing.provider}</strong></div>
           <div>Resolution: ${ing.effectiveResolutionSeconds || ing.metadata?.effectiveResolutionSeconds || '—'}s</div>
           <div>Observations: ${obs.length}</div>
           <div>Range: ${obs[0] ? new Date(obs[0].occurredAt).toISOString() : '—'} → ${obs[obs.length-1] ? new Date(obs[obs.length-1].occurredAt).toISOString() : '—'}</div>
           <div>Missing intervals: ${ing.missingIntervals ?? ing.metadata?.missingIntervals ?? '—'}</div>`
        : `<div>Observations loaded: ${obs.length}</div>`;

      const decision = detail.decision;
      document.getElementById('stateBadge').textContent = decision?.state || '—';
      document.getElementById('score').textContent = decision?.score ?? '—';
      renderList(document.getElementById('reasons'), decision?.explanation?.reasons);
      renderList(document.getElementById('risks'), decision?.explanation?.risks);

      document.getElementById('timeline').innerHTML = (timeline.events || []).map(e => `
        <div class="timeline-item">
          <div><strong>${e.eventType}</strong> <span class="muted">${new Date(e.occurredAt).toISOString()}</span></div>
          <div class="muted">${e.sourceId || e.sourceType}${e.walletAddress ? ' · ' + e.walletAddress.slice(0,8) : ''}</div>
        </div>`).join('') || '<div class="muted">No events</div>';

      const delayRows = (outcomes.outcomes || [])
        .filter(o => o.executionDelaySeconds != null)
        .sort((a, b) => a.executionDelaySeconds - b.executionDelaySeconds)
        .map(o => ({
          executionDelaySeconds: o.executionDelaySeconds,
          entry: {
            effectivePrice: o.effectivePrice,
            effectiveExecutionAt: o.effectiveExecutionAt,
          },
          outcome: {
            label: o.label,
            mfe: o.mfe,
            mae: o.mae,
            outcomeTimestamp: o.outcomeTimestamp,
          },
        }));
      renderOutcomes(delayRows);
      document.getElementById('replayTimeline').innerHTML = '<div class="muted">Run replay to populate chronological decisions</div>';
    }

    document.getElementById('ingestBtn').onclick = async () => {
      const tokenAddress = tokenSelect.value;
      const btn = document.getElementById('ingestBtn');
      btn.disabled = true;
      btn.textContent = 'Ingesting…';
      try {
        await fetch(`/api/v1/signal/tokens/${tokenAddress}/ingest-history`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({}),
        });
        await refresh(tokenAddress);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Ingest market history';
      }
    };

    document.getElementById('replayBtn').onclick = async () => {
      const tokenAddress = tokenSelect.value;
      const btn = document.getElementById('replayBtn');
      btn.disabled = true;
      btn.textContent = 'Replaying…';
      try {
        const res = await fetch(`/api/v1/signal/tokens/${tokenAddress}/replay`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({}),
        });
        const data = await res.json();
        document.getElementById('replayTimeline').innerHTML = (data.timeline || []).map(step => `
          <div class="timeline-item">
            <div><strong>${step.state}</strong> · score ${step.score?.toFixed?.(1) ?? step.score}
              <span class="muted">${new Date(step.decidedAt).toISOString()}</span></div>
            <div class="muted">price ${fmtPrice(step.priceUsd)} · mc ${step.marketCapUsd ?? '—'} · liq ${step.liquidityUsd ?? '—'}</div>
            <div>${(step.reasons || []).slice(0,2).join(' · ') || ''}</div>
          </div>`).join('') || '<div class="muted">Empty replay</div>';
        renderOutcomes(data.executionDelayOutcomes || []);
        await refresh(tokenAddress);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Run replay';
      }
    };

    document.getElementById('evaluateBtn').onclick = async () => {
      const tokenAddress = tokenSelect.value;
      await fetch(`/api/v1/signal/tokens/${tokenAddress}/evaluate`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ evaluatedAt: new Date().toISOString() }),
      });
      await refresh(tokenAddress);
    };

    tokenSelect.onchange = () => refresh(tokenSelect.value);
    loadCases().catch(err => {
      document.body.insertAdjacentHTML('beforeend', `<pre class="risk">${err}</pre>`);
    });
  </script>
</body>
</html>
