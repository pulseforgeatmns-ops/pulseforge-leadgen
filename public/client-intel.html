<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pulseforge — Client Intelligence</title>
  <link rel="icon" href="/favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/shared/tokens.css">
  <style>
    :root {
      --cie-bg: #0c1016;
      --cie-panel: #141b24;
      --cie-panel-elevated: #1a2330;
      --cie-border: #2a3544;
      --cie-border-soft: rgba(42, 53, 68, 0.65);
      --cie-text: #e8eef5;
      --cie-muted: #8b9bb0;
      --cie-accent: #3d9cfd;
      --cie-accent-soft: rgba(61, 156, 253, 0.14);
      --cie-ok: #3ecf8e;
      --cie-warn: #e6b84d;
      --cie-bad: #e57373;
      --cie-assistant: #1e2836;
      --cie-client: #1a3348;
      --cie-header-h: 3.5rem;
    }
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
    }
    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background:
        radial-gradient(900px 480px at 8% -8%, rgba(42, 72, 110, 0.35), transparent 60%),
        radial-gradient(700px 400px at 92% 0%, rgba(30, 58, 90, 0.22), transparent 55%),
        var(--cie-bg);
      color: var(--cie-text);
      display: flex;
      flex-direction: column;
    }
    header {
      flex: 0 0 auto;
      height: var(--cie-header-h);
      padding: 0 1.5rem;
      border-bottom: 1px solid var(--cie-border);
      display: flex;
      gap: 1rem;
      align-items: center;
    }
    header h1 {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    header p {
      margin: 0;
      color: var(--cie-muted);
      font-size: 0.85rem;
    }
    .workspace {
      flex: 1 1 auto;
      min-height: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.25rem;
      padding: 1.15rem 1.5rem 1.25rem;
      max-width: 1280px;
      width: 100%;
      margin: 0 auto;
      height: calc(100vh - var(--cie-header-h));
      max-height: calc(100vh - var(--cie-header-h));
    }
    @media (max-width: 900px) {
      html, body { overflow: auto; height: auto; }
      body { display: block; }
      .workspace {
        grid-template-columns: 1fr;
        height: auto;
        max-height: none;
        min-height: calc(100vh - var(--cie-header-h));
      }
      .panel { min-height: 70vh; max-height: 80vh; }
    }
    .panel {
      background: var(--cie-panel);
      border: 1px solid var(--cie-border);
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      min-height: 0;
      height: 100%;
      overflow: hidden;
    }
    .panel-head {
      flex: 0 0 auto;
      padding: 1rem 1.25rem 0.9rem;
      border-bottom: 1px solid var(--cie-border);
    }
    .panel-head h2 {
      margin: 0;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.01em;
    }
    .panel-head .sub {
      margin: 0.35rem 0 0;
      color: var(--cie-muted);
      font-size: 0.8rem;
      line-height: 1.4;
    }
    .progress-block { margin-top: 0.85rem; }
    .progress-label {
      display: flex;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 0.4rem;
      font-size: 0.78rem;
      color: var(--cie-muted);
    }
    .progress-label strong { color: var(--cie-text); font-weight: 500; }
    .progress-pct {
      font-family: 'JetBrains Mono', monospace;
      color: var(--cie-accent);
    }
    .progress-track {
      height: 0.4rem;
      border-radius: 999px;
      background: #0f1419;
      border: 1px solid var(--cie-border-soft);
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      border-radius: inherit;
      background: linear-gradient(90deg, #2f7fd6, var(--cie-accent));
      transition: width 280ms ease;
    }
    .controls {
      flex: 0 0 auto;
      display: flex;
      gap: 0.5rem;
      padding: 0.65rem 1.15rem;
      border-bottom: 1px solid var(--cie-border);
      flex-wrap: wrap;
      align-items: center;
    }
    .controls.soft {
      opacity: 0.72;
      font-size: 0.82rem;
    }
    input, textarea, button { font: inherit; }
    input, textarea {
      background: #0f1419;
      border: 1px solid var(--cie-border);
      color: var(--cie-text);
      border-radius: 10px;
      padding: 0.55rem 0.7rem;
    }
    input { width: 5.5rem; }
    button {
      background: var(--cie-accent);
      color: #041018;
      border: none;
      border-radius: 10px;
      padding: 0.55rem 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }
    button.secondary {
      background: transparent;
      color: var(--cie-text);
      border: 1px solid var(--cie-border);
    }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    #chatLog {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 1.25rem 1.3rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.05rem;
      scroll-behavior: smooth;
    }
    .bubble {
      max-width: 88%;
      padding: 0.95rem 1.05rem;
      border-radius: 16px;
      font-size: 0.96rem;
      line-height: 1.6;
      letter-spacing: 0.005em;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .bubble.assistant {
      align-self: flex-start;
      background: var(--cie-assistant);
      border: 1px solid var(--cie-border-soft);
      border-bottom-left-radius: 6px;
    }
    .bubble.client {
      align-self: flex-end;
      background: var(--cie-client);
      border: 1px solid rgba(61, 156, 253, 0.22);
      border-bottom-right-radius: 6px;
    }
    .bubble.reflection {
      align-self: flex-start;
      background: var(--cie-accent-soft);
      border: 1px solid rgba(61, 156, 253, 0.28);
      color: #d7e8fb;
      font-style: italic;
      border-bottom-left-radius: 6px;
    }
    .bubble.meta {
      align-self: center;
      color: var(--cie-muted);
      font-size: 0.8rem;
      background: transparent;
      border: none;
      padding: 0.35rem 0.5rem;
      max-width: 100%;
    }
    .bubble.trust {
      align-self: flex-start;
      max-width: 94%;
      background: linear-gradient(160deg, rgba(61, 156, 253, 0.16), rgba(30, 40, 54, 0.9));
      border: 1px solid rgba(61, 156, 253, 0.35);
      font-size: 1.02rem;
      line-height: 1.65;
    }
    .composer {
      flex: 0 0 auto;
      display: flex;
      gap: 0.6rem;
      padding: 0.9rem 1.15rem;
      border-top: 1px solid var(--cie-border);
      background: var(--cie-panel-elevated);
    }
    .composer[hidden], .controls[hidden], .actions[hidden] { display: none !important; }
    .composer textarea {
      flex: 1;
      min-height: 3.4rem;
      max-height: 7rem;
      resize: none;
      line-height: 1.45;
    }
    #sidePanel {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 1.15rem 1.2rem 1.4rem;
    }
    .blueprint-empty {
      color: var(--cie-muted);
      font-size: 0.92rem;
      line-height: 1.55;
      margin: 0.35rem 0;
    }
    .understanding-list {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }
    .understanding-row {
      position: relative;
      padding: 0.85rem 0.95rem;
      border-radius: 12px;
      border: 1px solid var(--cie-border-soft);
      background: rgba(15, 20, 25, 0.55);
    }
    .understanding-row-top {
      display: flex;
      justify-content: space-between;
      gap: 0.75rem;
      align-items: baseline;
    }
    .understanding-title {
      font-size: 0.9rem;
      font-weight: 600;
    }
    .understanding-title.ready::before {
      content: '✓ ';
      color: var(--cie-ok);
    }
    .conf-pct {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.82rem;
    }
    .conf-pct.bad { color: var(--cie-bad); }
    .conf-pct.warn { color: var(--cie-warn); }
    .conf-pct.ok { color: var(--cie-ok); }
    .conf-bar {
      margin-top: 0.55rem;
      height: 0.28rem;
      border-radius: 999px;
      background: #0f1419;
      overflow: hidden;
    }
    .conf-bar > span {
      display: block;
      height: 100%;
      border-radius: inherit;
      transition: width 280ms ease;
    }
    .conf-bar > span.bad { background: var(--cie-bad); }
    .conf-bar > span.warn { background: var(--cie-warn); }
    .conf-bar > span.ok { background: var(--cie-ok); }
    .understanding-status {
      margin-top: 0.45rem;
      font-size: 0.78rem;
      color: var(--cie-muted);
    }
    .conf-tip {
      display: none;
      position: absolute;
      left: 0.75rem;
      right: 0.75rem;
      top: calc(100% - 0.35rem);
      z-index: 5;
      padding: 0.7rem 0.8rem;
      border-radius: 10px;
      background: #0f1620;
      border: 1px solid var(--cie-border);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
      font-size: 0.78rem;
      line-height: 1.45;
      color: var(--cie-text);
    }
    .understanding-row:hover .conf-tip,
    .understanding-row:focus-within .conf-tip {
      display: block;
    }
    .section {
      padding: 1.1rem 0 1.2rem;
      border-bottom: 1px solid var(--cie-border-soft);
    }
    .section:last-child { border-bottom: none; }
    .section-title {
      margin: 0 0 0.55rem;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--cie-muted);
    }
    .section-summary {
      margin: 0 0 0.8rem;
      font-size: 0.94rem;
      line-height: 1.6;
      color: var(--cie-text);
    }
    .section-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.65rem 1rem;
      align-items: center;
      margin-bottom: 0.55rem;
    }
    .evidence-count {
      color: var(--cie-muted);
      font-size: 0.78rem;
    }
    .unknowns {
      color: var(--cie-warn);
      font-size: 0.8rem;
      line-height: 1.45;
      margin: 0 0 0.55rem;
      padding: 0.55rem 0.7rem;
      border-radius: 8px;
      background: rgba(230, 184, 77, 0.08);
      border: 1px solid rgba(230, 184, 77, 0.22);
    }
    .section textarea {
      width: 100%;
      min-height: 4.2rem;
      margin-top: 0.15rem;
      line-height: 1.5;
      resize: vertical;
    }
    .exec-card {
      padding: 0.55rem 0.15rem 1rem;
      animation: briefReveal 640ms ease both;
    }
    @keyframes briefReveal {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .exec-card h3 {
      margin: 0 0 0.4rem;
      font-size: 1.35rem;
      font-weight: 600;
      letter-spacing: 0.015em;
      line-height: 1.25;
    }
    .exec-card .exec-sub {
      margin: 0;
      color: var(--cie-muted);
      font-size: 0.88rem;
      line-height: 1.45;
    }
    .exec-card .exec-tagline {
      margin: 0.2rem 0 1.55rem;
      color: var(--cie-muted);
      font-size: 0.8rem;
      opacity: 0.9;
    }
    .exec-section {
      margin: 0 0 1.55rem;
      padding-bottom: 0.15rem;
    }
    .exec-section h4 {
      margin: 0 0 0.55rem;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--cie-muted);
    }
    .exec-section p {
      margin: 0;
      font-size: 0.98rem;
      line-height: 1.68;
      white-space: pre-wrap;
    }
    .exec-section p + p { margin-top: 0.65rem; }
    .exec-list {
      margin: 0.55rem 0 0;
      padding: 0 0 0 1.1rem;
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
    }
    .exec-list li {
      font-size: 0.95rem;
      line-height: 1.55;
      color: var(--cie-text);
    }
    .assessment-grid {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      margin: 0.35rem 0 0.85rem;
    }
    .assessment-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.35rem 1rem;
      align-items: baseline;
    }
    .assessment-label {
      font-size: 0.95rem;
      font-weight: 500;
    }
    .assessment-stars {
      font-size: 0.95rem;
      letter-spacing: 0.08em;
      color: var(--cie-warn);
      font-variant-emoji: text;
    }
    .assessment-explain {
      grid-column: 1 / -1;
      margin: 0;
      font-size: 0.82rem;
      line-height: 1.45;
      color: var(--cie-muted);
    }
    .assessment-confidence {
      margin-top: 0.35rem;
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .assessment-confidence span {
      color: var(--cie-accent);
      font-family: 'JetBrains Mono', monospace;
    }
    .checklist {
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
      padding: 0.35rem 0;
    }
    .checklist-item {
      display: flex;
      gap: 0.65rem;
      align-items: flex-start;
      color: var(--cie-muted);
      font-size: 0.92rem;
      line-height: 1.45;
      transition: color 220ms ease;
    }
    .checklist-item.done { color: var(--cie-text); }
    .checklist-mark {
      font-family: 'JetBrains Mono', monospace;
      width: 1.1rem;
      color: var(--cie-border);
    }
    .checklist-item.done .checklist-mark { color: var(--cie-ok); }
    .checklist-item.active .checklist-mark { color: var(--cie-accent); }
    .status-bar {
      flex: 0 0 auto;
      padding: 0.55rem 1.15rem;
      font-size: 0.78rem;
      color: var(--cie-muted);
      border-top: 1px solid var(--cie-border);
    }
    .actions {
      flex: 0 0 auto;
      display: flex;
      gap: 0.5rem;
      padding: 0.85rem 1.15rem;
      border-top: 1px solid var(--cie-border);
      background: var(--cie-panel-elevated);
      flex-wrap: wrap;
    }
    .completion-card h3 {
      margin: 0 0 0.75rem;
      font-size: 1.2rem;
    }
    .completion-card p {
      margin: 0 0 0.85rem;
      line-height: 1.6;
      font-size: 0.95rem;
    }
    .completion-checks {
      list-style: none;
      padding: 0;
      margin: 0 0 1.15rem;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }
    .completion-checks li {
      font-size: 0.92rem;
      color: var(--cie-text);
    }
    .completion-checks li::before {
      content: '✓ ';
      color: var(--cie-ok);
    }
    .error {
      position: fixed;
      left: 1.5rem;
      right: 1.5rem;
      bottom: 1rem;
      z-index: 20;
      color: #ffb4b4;
      background: rgba(40, 16, 16, 0.92);
      border: 1px solid rgba(255, 123, 123, 0.35);
      border-radius: 10px;
      padding: 0.65rem 0.9rem;
      font-size: 0.85rem;
      max-width: 1280px;
      margin: 0 auto;
    }
    .fade-out {
      opacity: 0;
      transition: opacity 480ms ease;
    }
  </style>
</head>
<body>
  <header>
    <h1>Client Intelligence</h1>
    <p>A conversation with Max about how your business works</p>
  </header>

  <div class="workspace">
    <section class="panel" aria-label="Interview chat">
      <div class="panel-head">
        <h2 id="chatPanelTitle">Conversation</h2>
        <div class="progress-block" id="progressBlock" hidden>
          <div class="progress-label">
            <strong id="progressLabel">Business Understanding</strong>
            <span class="progress-pct" id="progressPct">0%</span>
          </div>
          <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progressTrack">
            <div class="progress-fill" id="progressFill"></div>
          </div>
        </div>
      </div>
      <div class="controls soft" id="operatorControls">
        <label>Client ID <input id="clientId" value="1" inputmode="numeric"></label>
        <button type="button" id="startBtn">Begin</button>
        <button type="button" id="notesBtn" class="secondary">Start from notes</button>
      </div>
      <div id="chatLog" aria-live="polite"></div>
      <div class="composer" id="composer" hidden>
        <textarea id="messageInput" placeholder="Share your thoughts…" rows="2"></textarea>
        <button type="button" id="sendBtn" disabled>Send</button>
      </div>
      <div class="actions" id="execActions" hidden>
        <button type="button" id="accurateBtn">✓ Yes, this reflects my business.</button>
        <button type="button" id="refineBtn" class="secondary">✏️ I'd like to refine this.</button>
        <button type="button" id="keepTalkingBtn" class="secondary">💬 Let's keep talking.</button>
      </div>
      <div class="actions" id="completeActions" hidden>
        <button type="button" id="dashboardBtn">Return to Dashboard</button>
        <button type="button" id="finishBtn" class="secondary">Finish</button>
      </div>
      <div class="status-bar" id="sessionStatus">Welcome</div>
    </section>

    <section class="panel" aria-label="Business understanding">
      <div class="panel-head">
        <h2 id="sidePanelTitle">Business Understanding</h2>
        <p class="sub" id="sidePanelSub">Progress builds as we talk. Narratives appear after Max shares his understanding.</p>
      </div>
      <div id="sidePanel"><p class="blueprint-empty">When you're ready, begin the conversation.</p></div>
      <div class="actions" id="blueprintActions" hidden>
        <button type="button" id="reviseBtn" class="secondary" disabled>Save edits</button>
        <button type="button" id="approveBtn" disabled>Approve Blueprint</button>
      </div>
      <div class="status-bar" id="blueprintStatus"></div>
    </section>
  </div>
  <div class="error" id="errorBox" hidden></div>

  <script>
    const SECTION_TITLES = {
      identity: 'Identity',
      services: 'Services',
      idealCustomers: 'Ideal Customers',
      avoidCustomers: 'Customers to Avoid',
      targetMarkets: 'Target Markets',
      competitiveAdvantages: 'Competitive Advantages',
      brandVoice: 'Brand Voice',
      campaignGoals: 'Campaign Goals',
      successMetrics: 'Success Metrics',
    };

    const LOAD_STEPS = [
      'Reviewing interview',
      'Organizing evidence',
      'Connecting themes',
      'Measuring confidence',
      'Identifying opportunities',
      'Preparing Executive Business Brief',
    ];

    const PLAYBOOK_STEPS = [
      'Translating business understanding',
      'Building operational strategy',
      'Ready',
    ];

    const TRUST_BRIDGE =
      "One last thing.\n\nBefore I ask you to trust my recommendations, I want to make sure I've earned your trust by showing you that I understood your business.";

    const PREMIUM_LOAD_MS = 3000;

    const state = {
      phase: 'welcome',
      interviewId: null,
      blueprint: null,
      executiveSummary: null,
      understanding: null,
      stickToBottom: true,
      pendingCompletion: null,
    };

    const els = {
      clientId: document.getElementById('clientId'),
      chatLog: document.getElementById('chatLog'),
      messageInput: document.getElementById('messageInput'),
      sendBtn: document.getElementById('sendBtn'),
      startBtn: document.getElementById('startBtn'),
      notesBtn: document.getElementById('notesBtn'),
      sessionStatus: document.getElementById('sessionStatus'),
      sidePanel: document.getElementById('sidePanel'),
      sidePanelTitle: document.getElementById('sidePanelTitle'),
      sidePanelSub: document.getElementById('sidePanelSub'),
      reviseBtn: document.getElementById('reviseBtn'),
      approveBtn: document.getElementById('approveBtn'),
      blueprintStatus: document.getElementById('blueprintStatus'),
      blueprintActions: document.getElementById('blueprintActions'),
      errorBox: document.getElementById('errorBox'),
      progressBlock: document.getElementById('progressBlock'),
      progressLabel: document.getElementById('progressLabel'),
      progressPct: document.getElementById('progressPct'),
      progressFill: document.getElementById('progressFill'),
      progressTrack: document.getElementById('progressTrack'),
      composer: document.getElementById('composer'),
      operatorControls: document.getElementById('operatorControls'),
      execActions: document.getElementById('execActions'),
      completeActions: document.getElementById('completeActions'),
      accurateBtn: document.getElementById('accurateBtn'),
      refineBtn: document.getElementById('refineBtn'),
      keepTalkingBtn: document.getElementById('keepTalkingBtn'),
      dashboardBtn: document.getElementById('dashboardBtn'),
      finishBtn: document.getElementById('finishBtn'),
      chatPanelTitle: document.getElementById('chatPanelTitle'),
    };

    function showError(err) {
      els.errorBox.hidden = !err;
      els.errorBox.textContent = err || '';
    }

    function isNearBottom(el, threshold) {
      return el.scrollHeight - el.scrollTop - el.clientHeight <= (threshold || 80);
    }

    function maybeScrollChat() {
      if (state.stickToBottom) {
        els.chatLog.scrollTop = els.chatLog.scrollHeight;
      }
    }

    els.chatLog.addEventListener('scroll', () => {
      state.stickToBottom = isNearBottom(els.chatLog);
    });

    function addBubble(role, text) {
      const div = document.createElement('div');
      div.className = 'bubble ' + role;
      div.textContent = text;
      els.chatLog.appendChild(div);
      maybeScrollChat();
      return div;
    }

    function escapeHtml(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function confBand(pct) {
      if (pct <= 50) return 'bad';
      if (pct <= 80) return 'warn';
      return 'ok';
    }

    function renderProgress(progress) {
      if (!progress) {
        els.progressBlock.hidden = true;
        return;
      }
      const pct = Math.max(0, Math.min(100, Number(progress.percent) || 0));
      els.progressBlock.hidden = false;
      els.progressLabel.textContent = progress.label || 'Business Understanding';
      els.progressPct.textContent = pct + '%';
      els.progressFill.style.width = pct + '%';
      els.progressTrack.setAttribute('aria-valuenow', String(pct));
    }

    function renderUnderstanding(understanding) {
      state.understanding = understanding;
      if (!understanding || !understanding.sections || !understanding.sections.length) {
        els.sidePanel.innerHTML = '<p class="blueprint-empty">Understanding will grow as you answer.</p>';
        return;
      }
      const html = '<div class="understanding-list">' + understanding.sections.map((row) => {
        const pct = Math.max(0, Math.min(100, Number(row.confidencePercent != null
          ? row.confidencePercent
          : Math.round((Number(row.confidence) || 0) * 100))));
        const band = confBand(pct);
        const unknowns = (row.unknowns || []).filter(Boolean);
        const tipSupported = [
          'Interview responses',
          row.evidenceCount > 1 ? 'Consistency across answers' : null,
        ].filter(Boolean);
        const tipMissing = unknowns.length ? unknowns : ['Nothing flagged yet'];
        return (
          '<article class="understanding-row" tabindex="0">' +
            '<div class="understanding-row-top">' +
              '<div class="understanding-title ' + escapeHtml(row.status || '') + '">' +
                escapeHtml(row.title) +
              '</div>' +
              '<div class="conf-pct ' + band + '">' + pct + '%</div>' +
            '</div>' +
            '<div class="conf-bar" aria-hidden="true"><span class="' + band + '" style="width:' + pct + '%"></span></div>' +
            '<div class="understanding-status">' + escapeHtml(row.statusLabel || '') + '</div>' +
            '<div class="conf-tip" role="tooltip">' +
              '<strong>Confidence ' + pct + '%</strong><br>' +
              'Supported by:<br>' + tipSupported.map((t) => '✓ ' + escapeHtml(t)).join('<br>') +
              (unknowns.length
                ? '<br><br>Missing:<br>' + tipMissing.map((t) => '• ' + escapeHtml(t)).join('<br>')
                : '') +
            '</div>' +
          '</article>'
        );
      }).join('') + '</div>';
      els.sidePanel.innerHTML = html;
      els.sidePanelTitle.textContent = 'Business Understanding';
      els.sidePanelSub.textContent = 'Titles, confidence, and gaps — narratives come after Max shares his understanding.';
      els.blueprintActions.hidden = true;
      els.blueprintStatus.textContent = '';
    }

    function renderStars(count) {
      const n = Math.max(1, Math.min(5, Number(count) || 1));
      return '★'.repeat(n) + '☆'.repeat(5 - n);
    }

    function renderBriefSection(section) {
      const kind = section.kind || (section.items ? 'list' : section.ratings ? 'assessment' : 'prose');
      let inner = '';
      if (kind === 'assessment') {
        const rows = (section.ratings || []).map((row) =>
          '<div class="assessment-row">' +
            '<div class="assessment-label">' + escapeHtml(row.label || '') + '</div>' +
            '<div class="assessment-stars" aria-label="' + escapeHtml(String(row.stars || 0)) + ' of 5">' +
              escapeHtml(renderStars(row.stars)) +
            '</div>' +
            (row.explanation
              ? '<p class="assessment-explain">' + escapeHtml(row.explanation) + '</p>'
              : '') +
          '</div>'
        ).join('');
        inner =
          '<div class="assessment-grid">' + rows + '</div>' +
          (section.confidencePercent != null
            ? '<div class="assessment-confidence">Confidence <span>' +
                escapeHtml(String(section.confidencePercent)) + '%</span></div>'
            : '') +
          (section.body ? '<p style="margin-top:0.65rem">' + escapeHtml(section.body) + '</p>' : '');
      } else if (kind === 'list') {
        inner =
          (section.body ? '<p>' + escapeHtml(section.body) + '</p>' : '') +
          '<ul class="exec-list">' +
            (section.items || []).map((item) => '<li>' + escapeHtml(item) + '</li>').join('') +
          '</ul>';
      } else {
        inner = '<p>' + escapeHtml(section.body || '') + '</p>';
      }
      return (
        '<section class="exec-section">' +
          '<h4>' + escapeHtml(section.title || '') + '</h4>' +
          inner +
        '</section>'
      );
    }

    function renderExecutiveSummary(summary) {
      if (!summary) return;
      state.executiveSummary = summary;
      const sections = summary.sections || [];
      els.sidePanel.innerHTML =
        '<div class="exec-card">' +
          '<h3>' + escapeHtml(summary.title || 'Executive Business Brief') + '</h3>' +
          '<p class="exec-sub">' + escapeHtml(summary.subtitle || 'Prepared by Max') + '</p>' +
          '<p class="exec-tagline">' +
            escapeHtml(summary.tagline || 'Generated from our conversation') +
          '</p>' +
          sections.map(renderBriefSection).join('') +
        '</div>';
      els.sidePanelTitle.textContent = 'Executive Business Brief';
      els.sidePanelSub.textContent = 'A consultant-quality synthesis from Max — confirm before reviewing the Business Blueprint.';
      els.blueprintActions.hidden = true;
      els.blueprintStatus.textContent = 'Executive Business Brief · read only';
    }

    function renderBlueprint(bp, { editable } = { editable: true }) {
      state.blueprint = bp;
      if (!bp) {
        els.sidePanel.innerHTML = '<p class="blueprint-empty">No blueprint yet.</p>';
        els.reviseBtn.disabled = true;
        els.approveBtn.disabled = true;
        return;
      }
      const sections = bp.sections || {};
      const order = Object.keys(SECTION_TITLES);
      const keys = order.filter((k) => sections[k]).concat(
        Object.keys(sections).filter((k) => !SECTION_TITLES[k])
      );
      const created = bp.createdAt || bp.updatedAt || '';
      const metaLine = 'Version ' + escapeHtml(String(bp.version || '1')) +
        (created ? ' · ' + escapeHtml(new Date(created).toLocaleString()) : '');
      const html = '<p class="blueprint-empty">' + metaLine + '</p>' + keys.map((key) => {
        const s = sections[key] || {};
        const conf = Number(s.confidence || 0);
        const pct = Math.round(conf * 100);
        const band = confBand(pct);
        const unknowns = (s.unknowns || []).filter(Boolean);
        const count = (s.evidenceIds || []).length;
        const title = SECTION_TITLES[key] || key;
        const summary = s.summary || '';
        return (
          '<article class="section" data-section="' + escapeHtml(key) + '">' +
            '<h3 class="section-title">' + escapeHtml(title) + '</h3>' +
            (summary
              ? '<p class="section-summary">' + escapeHtml(summary) + '</p>'
              : '<p class="section-summary blueprint-empty">No summary yet.</p>') +
            '<div class="section-meta">' +
              '<span class="conf-pct ' + band + '">Confidence ' + pct + '%</span>' +
              '<span class="evidence-count">Evidence ' + count + '</span>' +
            '</div>' +
            '<div class="conf-bar" aria-hidden="true"><span class="' + band + '" style="width:' + pct + '%"></span></div>' +
            (unknowns.length
              ? '<div class="unknowns">Unknowns: ' + escapeHtml(unknowns.join('; ')) + '</div>'
              : '') +
            (editable
              ? '<textarea data-key="' + escapeHtml(key) + '">' + escapeHtml(summary) + '</textarea>'
              : '') +
          '</article>'
        );
      }).join('');
      els.sidePanel.innerHTML = html;
      els.sidePanelTitle.textContent = 'Business Blueprint';
      els.sidePanelSub.textContent = editable
        ? 'Editable artifact of Max\'s understanding. Adjust anything that needs sharpening.'
        : 'Approved foundation for future recommendations.';
      els.blueprintActions.hidden = !editable;
      const canEdit = editable && (bp.status === 'draft' || bp.status === 'in_review');
      els.reviseBtn.disabled = !canEdit;
      els.approveBtn.disabled = !canEdit || bp.status === 'approved';
      els.blueprintStatus.textContent =
        bp.status + ' · v' + bp.version +
        (bp.playbookId ? ' · playbook ' + bp.playbookId + '@' + bp.playbookVersion : '');
    }

    function renderCompletion(result) {
      const version = (result.blueprint && result.blueprint.version) || '1';
      els.sidePanel.innerHTML =
        '<div class="completion-card">' +
          '<h3>Business Blueprint Approved</h3>' +
          '<p>Thank you.</p>' +
          '<p>This Business Blueprint is now the foundation Pulseforge will use to understand your business.</p>' +
          '<ul class="completion-checks">' +
            '<li>Version ' + escapeHtml(String(version)) + ' created</li>' +
            '<li>Draft Client Playbook created</li>' +
            '<li>Awaiting operator review</li>' +
          '</ul>' +
          '<p><strong>Max</strong></p>' +
          '<p>Every future recommendation will build on this understanding.</p>' +
          '<p>As your business evolves, we\'ll continue refining this blueprint together.</p>' +
        '</div>';
      els.sidePanelTitle.textContent = 'Complete';
      els.sidePanelSub.textContent = 'Our next conversation will focus on growing your business.';
      els.blueprintActions.hidden = true;
      els.blueprintStatus.textContent = 'Awaiting operator review';
    }

    function setComposerEnabled(on) {
      els.composer.hidden = !on;
      els.sendBtn.disabled = !on || !state.interviewId;
      if (!on) els.messageInput.blur();
    }

    function setPhase(phase) {
      state.phase = phase;
      els.execActions.hidden = phase !== 'executive_summary';
      els.completeActions.hidden = phase !== 'complete';
      els.operatorControls.hidden = phase !== 'welcome';
      if (phase === 'welcome') {
        setComposerEnabled(false);
        els.chatPanelTitle.textContent = 'Conversation';
      } else if (phase === 'discovery') {
        setComposerEnabled(true);
        els.chatPanelTitle.textContent = 'Discovery';
      } else if (phase === 'understanding_load' || phase === 'trust_bridge') {
        setComposerEnabled(false);
        els.chatPanelTitle.textContent = 'Understanding';
      } else if (phase === 'executive_summary') {
        setComposerEnabled(false);
        els.chatPanelTitle.textContent = 'Understanding';
      } else if (phase === 'blueprint') {
        setComposerEnabled(false);
        els.chatPanelTitle.textContent = 'Business Blueprint';
      } else if (phase === 'playbook_prep' || phase === 'complete') {
        setComposerEnabled(false);
        els.chatPanelTitle.textContent = phase === 'complete' ? 'Complete' : 'Preparing Playbook';
      }
    }

    async function api(method, url, body) {
      showError('');
      const res = await fetch(url, {
        method,
        headers: {
          Accept: 'application/json',
          ...(body == null ? {} : { 'Content-Type': 'application/json' }),
        },
        body: body == null ? undefined : JSON.stringify(body),
        credentials: 'same-origin',
      });
      const text = await res.text();
      let json = null;
      try { json = text ? JSON.parse(text) : null; } catch (_) {}
      if (!res.ok) {
        const msg = (json && (json.message || json.error)) || text || res.statusText;
        throw new Error(msg);
      }
      return json;
    }

    function sleep(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }

    async function runChecklist(steps, minMs, backendPromise) {
      const wrap = document.createElement('div');
      wrap.className = 'checklist';
      wrap.setAttribute('aria-live', 'polite');
      const items = steps.map((label) => {
        const row = document.createElement('div');
        row.className = 'checklist-item';
        row.innerHTML = '<span class="checklist-mark">○</span><span>' + escapeHtml(label) + '</span>';
        wrap.appendChild(row);
        return row;
      });
      els.chatLog.appendChild(wrap);
      maybeScrollChat();

      const started = Date.now();
      let backendResult = null;
      let backendDone = false;
      const backendWait = Promise.resolve(backendPromise).then((r) => {
        backendDone = true;
        backendResult = r;
        return r;
      });

      const stepDelay = Math.max(320, Math.floor(minMs / Math.max(steps.length, 1)));
      for (let i = 0; i < items.length; i += 1) {
        items[i].classList.add('active');
        items[i].querySelector('.checklist-mark').textContent = '…';
        await sleep(stepDelay);
        items[i].classList.remove('active');
        items[i].classList.add('done');
        items[i].querySelector('.checklist-mark').textContent = '✓';
        maybeScrollChat();
        if (backendDone && Date.now() - started >= minMs && i >= items.length - 2) {
          for (let j = i + 1; j < items.length; j += 1) {
            items[j].classList.add('done');
            items[j].querySelector('.checklist-mark').textContent = '✓';
          }
          break;
        }
      }

      const elapsed = Date.now() - started;
      if (elapsed < minMs) await sleep(minMs - elapsed);
      await backendWait;
      return backendResult;
    }

    async function playTrustBridge() {
      setPhase('trust_bridge');
      const bubble = addBubble('trust', TRUST_BRIDGE);
      await sleep(2200);
      bubble.classList.add('fade-out');
      await sleep(500);
    }

    async function enterUnderstandingFlow(data) {
      state.interviewId = data.interviewId || data.id || state.interviewId;
      state.blueprint = data.blueprint || null;
      state.executiveSummary = data.executiveSummary || null;
      renderProgress(data.progress);
      if (data.understanding) renderUnderstanding(data.understanding);

      setPhase('understanding_load');
      addBubble('meta', 'Understanding your business…');
      await runChecklist(LOAD_STEPS, PREMIUM_LOAD_MS, Promise.resolve(data));
      await playTrustBridge();

      setPhase('executive_summary');
      addBubble(
        'assistant',
        "Thank you.\n\nI believe I understand your business well enough to begin helping you grow it.\n\nBefore we move forward, I'd like to share your Executive Business Brief."
      );
      if (state.executiveSummary) {
        renderExecutiveSummary(state.executiveSummary);
      } else if (state.blueprint && state.blueprint.sections) {
        renderExecutiveSummary({
          title: 'Executive Business Brief',
          subtitle: 'Prepared by Max',
          tagline: 'Generated from our conversation',
          sections: [],
        });
      }
      els.sessionStatus.textContent =
        'Session ' + state.interviewId + ' · Executive Business Brief';
    }

    function applyDiscoveryPayload(data, { skipMessage } = {}) {
      state.interviewId = data.interviewId || data.id;
      els.sessionStatus.textContent =
        'Session ' + state.interviewId + ' · ' + data.status +
        (data.currentStage ? ' · ' + data.currentStage : '');
      renderProgress(data.progress);
      if (data.understanding) renderUnderstanding(data.understanding);
      if (data.reflection) addBubble('reflection', data.reflection);
      if (
        !skipMessage &&
        data.message &&
        data.nextAction !== 'COMPLETE' &&
        data.nextAction !== 'GENERATE_BLUEPRINT'
      ) {
        addBubble('assistant', data.message);
      }
    }

    function showWelcome() {
      setPhase('welcome');
      els.chatLog.innerHTML = '';
      state.stickToBottom = true;
      addBubble(
        'assistant',
        "Welcome.\n\nBefore Pulseforge recommends anything, I'd like to understand how your business works.\n\nThe better I understand your business, the better every future recommendation will become."
      );
      els.sidePanel.innerHTML = '<p class="blueprint-empty">When you\'re ready, begin the conversation.</p>';
      els.sessionStatus.textContent = 'Welcome';
      renderProgress(null);
    }

    els.startBtn.addEventListener('click', async () => {
      try {
        const clientId = els.clientId.value.trim() || '1';
        els.chatLog.innerHTML = '';
        state.stickToBottom = true;
        setPhase('discovery');
        const data = await api('POST', '/api/v1/clients/' + encodeURIComponent(clientId) + '/interview/start', {});
        applyDiscoveryPayload(data);
        setComposerEnabled(true);
      } catch (err) {
        showError(err.message);
        showWelcome();
      }
    });

    els.notesBtn.addEventListener('click', async () => {
      try {
        const notes = prompt('Paste business notes:');
        if (!notes) return;
        const clientId = els.clientId.value.trim() || '1';
        els.chatLog.innerHTML = '';
        state.stickToBottom = true;
        addBubble('client', notes);
        const data = await api('POST', '/api/v1/clients/' + encodeURIComponent(clientId) + '/interview/start', { notes });
        await enterUnderstandingFlow(data);
      } catch (err) {
        showError(err.message);
      }
    });

    async function sendMessage() {
      try {
        const text = els.messageInput.value.trim();
        if (!text || !state.interviewId) return;
        addBubble('client', text);
        els.messageInput.value = '';
        els.sendBtn.disabled = true;
        const pending = api('POST', '/api/v1/interview/' + encodeURIComponent(state.interviewId) + '/message', {
          message: text,
        });
        const data = await pending;
        if (data.blueprint || data.nextAction === 'GENERATE_BLUEPRINT' || data.nextAction === 'COMPLETE') {
          if (data.reflection) addBubble('reflection', data.reflection);
          await enterUnderstandingFlow(data);
          return;
        }
        applyDiscoveryPayload(data);
        setComposerEnabled(true);
      } catch (err) {
        showError(err.message);
        setComposerEnabled(state.phase === 'discovery');
      }
    }

    els.sendBtn.addEventListener('click', sendMessage);
    els.messageInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    els.accurateBtn.addEventListener('click', () => {
      setPhase('blueprint');
      addBubble(
        'assistant',
        "Here's your Business Blueprint — the living record of what I understand about your business. Edit anything that needs sharpening, then approve when it feels right."
      );
      renderBlueprint(state.blueprint, { editable: true });
      els.sessionStatus.textContent =
        'Session ' + state.interviewId + ' · Business Blueprint';
    });

    async function resumeConversation() {
      try {
        const data = await api('POST', '/api/v1/interview/' + encodeURIComponent(state.interviewId) + '/resume', {});
        setPhase('discovery');
        applyDiscoveryPayload(data);
        setComposerEnabled(true);
      } catch (err) {
        showError(err.message);
      }
    }

    els.refineBtn.addEventListener('click', resumeConversation);
    els.keepTalkingBtn.addEventListener('click', resumeConversation);

    els.reviseBtn.addEventListener('click', async () => {
      try {
        if (!state.blueprint) return;
        const sections = {};
        els.sidePanel.querySelectorAll('textarea[data-key]').forEach((ta) => {
          sections[ta.getAttribute('data-key')] = { summary: ta.value };
        });
        const bp = await api('POST', '/api/v1/blueprint/' + encodeURIComponent(state.blueprint.id) + '/revise', {
          sections,
        });
        renderBlueprint(bp, { editable: true });
      } catch (err) {
        showError(err.message);
      }
    });

    els.approveBtn.addEventListener('click', async () => {
      try {
        if (!state.blueprint) return;
        setPhase('playbook_prep');
        addBubble('meta', 'Preparing your Client Playbook…');
        const pending = api('POST', '/api/v1/blueprint/' + encodeURIComponent(state.blueprint.id) + '/approve', {});
        const result = await runChecklist(PLAYBOOK_STEPS, 2500, pending);
        state.pendingCompletion = result;
        setPhase('complete');
        addBubble(
          'assistant',
          'Excellent.\n\nI now understand your business well enough to begin helping it grow.\n\nEvery recommendation Pulseforge makes will build on this understanding.\n\nOur next conversation will focus on growing your business.'
        );
        renderCompletion(result);
        els.sessionStatus.textContent = 'Complete · Awaiting operator review';
      } catch (err) {
        showError(err.message);
        setPhase('blueprint');
      }
    });

    els.dashboardBtn.addEventListener('click', () => {
      window.location.href = '/dashboard';
    });
    els.finishBtn.addEventListener('click', () => {
      addBubble('meta', 'You can return whenever you are ready for the next conversation.');
      els.completeActions.hidden = true;
    });

    showWelcome();
  </script>
</body>
</html>
