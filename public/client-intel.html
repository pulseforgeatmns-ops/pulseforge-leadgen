        btn.classList.toggle('active', btn.getAttribute('data-tab') === state.workspaceTab);
      });
      renderWorkspaceSidePanel();
    }

    function renderPlanProgress(plan) {
      if (!plan) return '';
      const pct = typeof plan.percentComplete === 'number' ? plan.percentComplete : 0;
      return (
        '<div class="progress-block" style="margin:0 0 0.9rem">' +
          '<div class="plan-progress-label">' +
            '<strong>' + escapeHtml(plan.title || 'Growth Plan') + '</strong>' +
            '<span class="progress-pct">' + pct + '%</span>' +
          '</div>' +
          '<div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' +
            pct +
          '"><div class="progress-fill" style="width:' +
            pct +
          '%"></div></div>' +
        '</div>'
      );
    }

    function shortClientName(name) {
      const s = String(name || '').trim();
      if (!s) return 'the business';
      if (/\banchor\s+cleaning\b/i.test(s) || /^anchor\b/i.test(s)) return 'Anchor';
      return s;
    }

    function nextObjectiveCopy(plan) {
      const name = shortClientName(
        (plan && plan.businessName) ||
          (state.growthPlan && state.growthPlan.businessName) ||
          ''
      );
      return (
        name +
        ' has completed the current growth setup checklist. The next step is to choose what Max should help with next.'
      );
    }

    function completionStatusMeta(plan) {
      if (plan && plan.completionStatusLine) return plan.completionStatusLine;
      return 'Growth infrastructure checklist complete';
    }

    function renderCurrentTaskCard(plan, { guidanceOpen } = {}) {
      if (!plan) return '';
      if (plan.status === 'complete' || !plan.currentTask) {
        const options = (plan.completionOptions || [])
          .map(
            (opt) =>
              '<button type="button" class="secondary" data-completion="' +
              escapeHtml(opt.id) +
              '">' +
              escapeHtml(opt.label) +
              '</button>'
          )
          .join('');
        return (
          '<div class="current-task-card" id="growthCompleteCard">' +
            '<p class="kicker">Growth Complete</p>' +
            '<h3>' +
            escapeHtml(nextObjectiveCopy(plan)) +
            '</h3>' +
            '<p class="task-meta">' +
            escapeHtml(completionStatusMeta(plan)) +
            '<br>Next objectives stay review-first — no campaign, prospect list, or account changes begin without operator approval.</p>' +
            '<div class="completion-options">' +
              options +
            '</div>' +
          '</div>'
        );
      }
      // Next-objective milestone: show the same client-facing framing before Finish Review.
      if (plan.currentTask && plan.currentTask.resumeAction === 'growth_complete') {
        const task = plan.currentTask;
        return (
          '<div class="current-task-card" id="currentTaskCard" data-role="simple-task">' +
            '<p class="kicker">Next Objective</p>' +
            '<h3>' +
            escapeHtml(task.title || 'Choose next growth objective') +
            '</h3>' +
            '<p class="task-meta">' +
            escapeHtml(task.description || nextObjectiveCopy(plan)) +
            '<br>' +
            escapeHtml(completionStatusMeta(plan)) +
            '<br>Next objectives stay review-first — no campaign, prospect list, or account changes begin without operator approval.' +
            (task.estimatedMinutes
              ? '<br>Estimated time · ' + task.estimatedMinutes + ' minutes'
              : '') +
            '</p>' +
          '</div>'
        );
      }
      // When left-panel guidance is open, do not render a second simple task card.
      if (guidanceOpen) {
        return (
          '<p class="blueprint-empty" data-role="guidance-open-note">' +
          'Task guidance is open in the left panel.' +
          '</p>'
        );
      }
      const task = plan.currentTask;
      const next = plan.nextTask;
      const after = plan.afterTask;
      return (
        '<div class="current-task-card" id="currentTaskCard" data-role="simple-task">' +
          '<p class="kicker">Current Task</p>' +
          '<h3>' + escapeHtml(task.title || 'Next step') + '</h3>' +
          '<p class="task-meta">' +
            escapeHtml(task.description || '') +
            (task.estimatedMinutes
              ? '<br>Estimated time · ' + task.estimatedMinutes + ' minutes'
              : '') +
            (next ? '<br>Next · ' + escapeHtml(next.title) : '') +
            (after ? '<br>After · ' + escapeHtml(after.title) : '') +
          '</p>' +
        '</div>'
      );
    }

    function renderTaskList(plan) {
      const tasks = (plan && plan.tasks) || [];
      if (!tasks.length) {
        return '<p class="blueprint-empty">Nothing left to complete.</p>';
      }
      const currentId = plan.currentTask && plan.currentTask.id;
      return (
        '<ul class="task-queue">' +
        tasks
          .map((t) => {
            const cls =
              t.status === 'complete'
                ? 'complete'
                : t.id === currentId
                  ? 'current'
                  : '';
            return (
              '<li class="' +
              cls +
              '"><span>' +
              escapeHtml(t.title) +
              '</span><span class="task-status">' +
              escapeHtml(t.status) +
              '</span></li>'
            );
          })
          .join('') +
        '</ul>'
      );
    }

    function renderHistory(plan) {
      const history = (plan && plan.history) || [];
      if (!history.length) {
        return '<p class="blueprint-empty">No completed Growth Plan tasks yet.</p>';
      }
      return (
        '<ul class="completion-checks">' +
        history
          .slice()
          .reverse()
          .map((h) => {
            const when = h.completedAt
              ? new Date(h.completedAt).toLocaleString()
              : '';
            return (
              '<li>' +
              escapeHtml(h.title || h.taskId || 'Task') +
              (when ? ' <span class="conf-pct">· ' + escapeHtml(when) + '</span>' : '') +
              '</li>'
            );
          })
          .join('') +
        '</ul>'
      );
    }

    function renderWorkspaceOverview(plan) {
      return (
        '<div class="completion-card">' +
          renderPlanProgress(plan) +
          renderCurrentTaskCard(plan, {
            guidanceOpen: Boolean(state.taskGuidanceOpen),
          }) +
          (plan && plan.artifacts && plan.artifacts.hasInitialGrowthDirection
            ? renderGrowthDirection(state.initialGrowthDirection)
            : '') +
          '<p class="growth-disclaimer">' +
            'Readiness Report is available as a tab. Resume always opens the first incomplete task.' +
          '</p>' +
        '</div>'
      );
    }

    function renderWorkspaceSidePanel() {
      const plan = state.growthPlan;
      const tab = state.workspaceTab || 'overview';
      if (tab === 'tasks') {
        els.sidePanel.innerHTML =
          '<div class="completion-card">' +
          renderPlanProgress(plan) +
          '<p class="growth-kicker">Tasks</p>' +
          renderTaskList(plan) +
          '</div>';
        els.sidePanelTitle.textContent = 'Tasks';
        els.sidePanelSub.textContent = 'Guided Growth Plan sequence';
        return;
      }
      if (tab === 'readiness') {
        if (state.growthInfrastructureReadinessReport) {
          els.sidePanel.innerHTML = renderReadinessReport(
            state.growthInfrastructureReadinessReport
          );
        } else {
          els.sidePanel.innerHTML =
            '<p class="blueprint-empty">No Readiness Report yet. Continue the Growth Plan to assess infrastructure when that task is current.</p>';
        }
        els.sidePanelTitle.textContent = 'Readiness Report';
        els.sidePanelSub.textContent = 'Informational — does not block progress';
        return;
      }
      if (tab === 'blueprint') {
        if (state.blueprint) {
          renderBlueprint(state.blueprint, { editable: false });
        } else {
          els.sidePanel.innerHTML =
            '<p class="blueprint-empty">Approved Blueprint unavailable.</p>';
        }
        els.sidePanelTitle.textContent = 'Business Blueprint';
        els.sidePanelSub.textContent = 'Approved foundation for this Growth Plan';
        return;
      }
      if (tab === 'history') {
        els.sidePanel.innerHTML =
          '<div class="completion-card">' +
          '<p class="growth-kicker">History</p>' +
          renderHistory(plan) +
          '</div>';
        els.sidePanelTitle.textContent = 'History';
        els.sidePanelSub.textContent = 'Completed Growth Plan tasks';
        return;
      }
      els.sidePanel.innerHTML = renderWorkspaceOverview(plan);
      els.sidePanelTitle.textContent = 'Growth Workspace';
      els.sidePanelSub.textContent = 'Overview · first incomplete task is active';
    }

    function syncWorkspaceActions(plan) {
      if (!els.growthWorkspaceActions) return;
      const task = plan && plan.currentTask;
      const complete = !task || (plan && plan.status === 'complete');
      if (els.continueTaskBtn) {
        els.continueTaskBtn.hidden = complete;
        if (task) {
          if (task.resumeAction === 'growth_conversation') {
            els.continueTaskBtn.textContent = 'Continue Growth Conversation';
          } else if (task.resumeAction === 'infrastructure_readiness') {
            els.continueTaskBtn.textContent = 'Continue Readiness Check';
          } else if (task.resumeAction === 'growth_complete') {
            els.continueTaskBtn.textContent = 'Choose Next Objective';
          } else {
            els.continueTaskBtn.textContent = 'Open Task Guidance';
          }
        }
      }
      if (els.completeTaskBtn) {
        els.completeTaskBtn.hidden = complete || (task && task.type === 'milestone' && task.resumeAction !== 'growth_complete');
        els.completeTaskBtn.textContent =
          task && task.resumeAction === 'growth_complete'
            ? 'Finish Review'
            : 'Mark Complete';
      }
    }

    function openGrowthWorkspace(data, { autoOpenTask } = {}) {
      state.growthPlan = data.growthPlan || state.growthPlan;
      state.growthConversationActive = false;
      state.readinessConversationActive = false;
      state.campaignPlanningConversationActive = false;
      state.taskGuidanceOpen = false;
      setPhase('growth_workspace');
      state.workspaceTab = 'overview';
      if (els.workspaceTabs) els.workspaceTabs.hidden = false;
      setWorkspaceTab('overview');
      syncWorkspaceActions(state.growthPlan);
      renderWorkspaceLeftNav();
      // Refresh session list so Previous Plans stays accurate while in workspace.
      loadSavedSessions().catch(() => {});

      els.chatLog.innerHTML = '';
      state.stickToBottom = true;
      if (state.isSample) {
        addBubble(
          'meta',
          'SAMPLE / DEV DATA — resuming Anchor sample Growth Plan. This is not a real client interview.'
        );
      }

      const plan = state.growthPlan;
      if (!plan || plan.status === 'complete' || !plan.currentTask) {
        addBubble(
          'assistant',
          'Growth Complete.\n\n' +
            nextObjectiveCopy(plan) +
            '\n\n' +
            completionStatusMeta(plan) +
            '\n\nNext objectives stay review-first — no campaign, prospect list, or account changes begin without operator approval.'
        );
        els.sessionStatus.textContent =
          'GROWTH PLAN · ' + completionStatusMeta(plan);
        setComposerEnabled(false);
        return;
      }

      const task = plan.currentTask;
      if (task.resumeAction === 'growth_complete') {
        addBubble(
          'assistant',
          (task.description || nextObjectiveCopy(plan)) +
            '\n\n' +
            completionStatusMeta(plan) +
            '\n\nUse Choose Next Objective to review options, or Finish Review when you are done. Nothing launches without operator approval.'
        );
        els.sessionStatus.textContent =
          'GROWTH PLAN · ' + completionStatusMeta(plan);
      } else {
        addBubble(
          'assistant',
          'Resuming your Growth Plan.\n\nCurrent task: ' +
            (task.title || 'Next step') +
            (task.description ? '\n\n' + task.description : '')
        );
        els.sessionStatus.textContent =
          'GROWTH PLAN · ' +
          (typeof plan.percentComplete === 'number' ? plan.percentComplete + '% · ' : '') +
          (task.title || 'in progress');
      }

      // Auto-continue only conversation milestones — setup task guidance opens
      // explicitly via "Open Task Guidance" so the left panel never duplicates cards.
      if (autoOpenTask !== false) {
        const action = task.resumeAction;
        if (
          action === 'growth_conversation' ||
          action === 'infrastructure_readiness'
        ) {
          setTimeout(() => {
            continueCurrentTask({ silent: true }).catch(() => {});
          }, 0);
        }
      }
    }

    async function continueCurrentTask({ silent } = {}) {
      const plan = state.growthPlan;
      const task = plan && plan.currentTask;
      if (!task) return;
      if (task.resumeAction === 'growth_conversation') {
        state.taskGuidanceOpen = false;
        renderWorkspaceLeftNav();
        await startGrowthConversation();
        return;
      }
      if (task.resumeAction === 'infrastructure_readiness') {
        state.taskGuidanceOpen = false;
        renderWorkspaceLeftNav();
        await startInfrastructureReadiness();
        return;
      }
      if (task.resumeAction === 'growth_complete') {
        state.taskGuidanceOpen = false;
        setWorkspaceTab('overview');
        renderWorkspaceLeftNav();
        if (!silent) {
          addBubble(
            'meta',
            'Review next-objective options when ready. Finish Review saves this checkpoint — no campaign or account changes start without approval.'
          );
        }
        return;
      }
      // Setup task — show exactly one expanded guidance card in the left panel.
      // Clear chat so a resume/simple task summary cannot sit under the card.
      setPhase('growth_workspace');
      setComposerEnabled(false);
      setWorkspaceTab('overview');
      state.taskGuidanceOpen = true;
      if (els.chatLog) {
        els.chatLog.innerHTML = '';
        state.stickToBottom = true;
      }
      renderWorkspaceLeftNav();
      renderWorkspaceSidePanel();
      syncGrowthWorkspaceChrome();
      // Defense in depth: strip any accidental simple-task nodes from left nav.
      if (els.savedSessions) {
        els.savedSessions
          .querySelectorAll('[data-role="simple-task"]')
          .forEach((node) => node.remove());
        const activeCards = els.savedSessions.querySelectorAll(
          '[data-active-task-card="1"]'
        );
        if (activeCards.length > 1) {
          Array.from(activeCards)
            .slice(1)
            .forEach((node) => node.remove());
        }
      }
      els.sessionStatus.textContent = 'GROWTH PLAN · ' + (task.title || 'setup task');
      applyGuidanceFooterClearance();
    }

    async function completeCurrentTask() {
      const plan = state.growthPlan;
      const task = plan && plan.currentTask;
      if (!task || !state.interviewId) return;
      const data = await api(
        'POST',
        '/api/v1/interview/' +
          encodeURIComponent(state.interviewId) +
          '/growth-plan/tasks/' +
          encodeURIComponent(task.id) +
          '/complete',
        {}
      );
      state.growthPlan = data.growthPlan || state.growthPlan;
      if (data.growthInfrastructureReadinessReport) {
        state.growthInfrastructureReadinessReport =
          data.growthInfrastructureReadinessReport;
      }
      openGrowthWorkspace(
        {
          growthPlan: state.growthPlan,
        },
        { autoOpenTask: Boolean(state.growthPlan && state.growthPlan.currentTask) }
      );
      if (data.completedTask) {
        addBubble('meta', 'Completed · ' + (data.completedTask.title || task.id));
      }
    }

    function applyResumeState(data, action) {
      state.interviewId = data.interviewId || data.id || state.interviewId;
      state.sessionStatus = data.status || state.sessionStatus;
      state.blueprint = data.blueprint || state.blueprint;
      state.initialGrowthDirection = data.initialGrowthDirection || null;
      state.growthInfrastructureReadinessReport =
        data.growthInfrastructureReadinessReport || null;
      state.firstGrowthPlanPreview = data.firstGrowthPlanPreview ||
        (data.latestGrowthState && data.latestGrowthState.firstGrowthPlanPreview) ||
        null;
      state.growthPlan = data.growthPlan || null;
      state.isSample = Boolean(data.isSample);
      state.growthConversationActive = false;
      state.readinessConversationActive = false;
      state.campaignPlanningConversationActive = false;

      const mode = action || data.action || 'continue';
      const target = data.resumeTarget || 'growth_workspace';

      els.chatLog.innerHTML = '';
      state.stickToBottom = true;

      if (state.isSample) {
        addBubble(
          'meta',
          'SAMPLE / DEV DATA — resuming Anchor sample Blueprint. This is not a real client interview.'
        );
      }

      if (mode === 'view') {
        setPhase('complete');
        applyApprovedState(
          {
            blueprint: state.blueprint,
            initialGrowthDirection: state.initialGrowthDirection,
            playbook: data.playbook || null,
          },
          { alreadyApproved: true }
        );
        if (state.blueprint) {
          renderBlueprint(state.blueprint, { editable: false });
        }
        els.sessionStatus.textContent =
          'Session ' + state.interviewId + ' · Viewing approved Blueprint';
        addBubble(
          'assistant',
          'Here is the approved Business Blueprint. Resume Growth Plan whenever you are ready — you will not need to re-answer the interview.'
        );
        if (els.growthBtn) els.growthBtn.textContent = 'Resume Growth Plan';
        return;
      }

      // SPEC-088: Continue/Resume always enters Growth Workspace (or completion).
      // Readiness Report is a tab — never the intermediate destination.
      if (
        target === 'growth_workspace' ||
        target === 'growth_complete' ||
        target === 'infrastructure_readiness' ||
        target === 'first_growth_plan_preview' ||
        target === 'growth_conversation' ||
        target === 'initial_growth_direction'
      ) {
        openGrowthWorkspace(data, { autoOpenTask: mode === 'continue' });
        return;
      }

      openGrowthWorkspace(data, { autoOpenTask: mode === 'continue' });
    }

    async function resumeSession(sessionId, action) {
      const data = await api(
        'GET',
        '/api/v1/client-intel/sessions/' +
          encodeURIComponent(sessionId) +
          '/resume?action=' +
          encodeURIComponent(action || 'continue')
      );
      applyResumeState(data, action || 'continue');
    }

    function showWelcome() {
      setPhase('welcome');
      els.chatLog.innerHTML = '';
      state.stickToBottom = true;
      state.interviewId = null;
      state.sessionStatus = null;
      state.blueprint = null;
      state.growthConversationActive = false;
      state.readinessConversationActive = false;
      state.campaignPlanningConversationActive = false;
      state.firstGrowthPlanPreview = null;
      state.firstCampaignPlanPreview = null;
      state.prospectListCriteriaPreview = null;
      state.prospectListBuildProposal = null;
      state.scoutHandoffBrief = null;
      state.scoutHandoff = null;
      state.scoutWorkRequest = null;
      state.scoutCandidateBatch = null;
      state.growthInfrastructureReadinessReport = null;
      state.isSample = false;
      state.taskGuidanceOpen = false;
      if (els.growthBtn) els.growthBtn.textContent = 'Resume Growth Plan';
      state.growthPlan = null;
      if (els.workspaceTabs) els.workspaceTabs.hidden = true;
      if (els.savedSessions) els.savedSessions.classList.remove('workspace-left-nav');
      addBubble(
        'assistant',
        "Welcome.\n\nBefore Pulseforge recommends anything, I'd like to understand how your business works.\n\nThe better I understand your business, the better every future recommendation will become.\n\nIf you already have a Growth Plan, resume from the current plan below — you will not re-answer the interview."
      );
      els.sidePanel.innerHTML = '<p class="blueprint-empty">When you\'re ready, begin the conversation or resume an approved Blueprint.</p>';
      els.sessionStatus.textContent = 'Welcome';
      renderProgress(null);
      loadSavedSessions();
    }

    function startNewInterviewFlow() {
      showWelcome();
      els.clientId.focus();
      addBubble('meta', 'Start a new interview when ready — existing approved Blueprints stay saved.');
    }

    els.startBtn.addEventListener('click', async () => {
      try {
        const clientId = els.clientId.value.trim() || '1';
        els.chatLog.innerHTML = '';
        state.stickToBottom = true;
        if (els.savedSessions) els.savedSessions.hidden = true;
        setPhase('discovery');
        const data = await api('POST', '/api/v1/clients/' + encodeURIComponent(clientId) + '/interview/start', {});
        applyDiscoveryPayload(data);
        setComposerEnabled(true);
      } catch (err) {
        showError(err.message);
        showWelcome();
      }
    });

    els.notesBtn.addEventListener('click', async () => {
      try {
        const notes = prompt('Paste business notes:');
        if (!notes) return;
        const clientId = els.clientId.value.trim() || '1';
        els.chatLog.innerHTML = '';
        state.stickToBottom = true;
        addBubble('client', notes);
        const data = await api('POST', '/api/v1/clients/' + encodeURIComponent(clientId) + '/interview/start', { notes });
        await enterUnderstandingFlow(data);
      } catch (err) {
        showError(err.message);
      }
    });

    async function sendMessage() {
      try {
        const text = els.messageInput.value.trim();
        if (!text || !state.interviewId) return;
        addBubble('client', text);
        els.messageInput.value = '';
        els.sendBtn.disabled = true;

        if (state.phase === 'readiness' || state.readinessConversationActive) {
          const data = await api(
            'POST',
            '/api/v1/interview/' + encodeURIComponent(state.interviewId) + '/readiness/message',
            { message: text }
          );
          if (data && data.growthInfrastructureReadinessReport) {
            state.growthInfrastructureReadinessReport = data.growthInfrastructureReadinessReport;
            els.sidePanel.innerHTML = renderReadinessReport(data.growthInfrastructureReadinessReport);
            els.sidePanelTitle.textContent = 'Growth Infrastructure Readiness Report';
            els.sidePanelSub.textContent = 'Assessment only — setup sequence before campaigns';
          }
          if (data && data.message) addBubble('assistant', data.message);
          setComposerEnabled(true);
          return;
        }

        if (
          state.phase === 'campaign_planning' ||
          state.campaignPlanningConversationActive
        ) {
          const data = await api(
            'POST',
            '/api/v1/interview/' +
              encodeURIComponent(state.interviewId) +
              '/campaign/message',
            { message: text }
          );
          if (data && data.firstCampaignPlanPreview) {
            state.firstCampaignPlanPreview = data.firstCampaignPlanPreview;
          }
          if (data && data.prospectListCriteriaPreview) {
            state.prospectListCriteriaPreview = data.prospectListCriteriaPreview;
          }
          if (data && data.prospectListBuildProposal) {
            state.prospectListBuildProposal = data.prospectListBuildProposal;
          }
          if (data && data.scoutHandoffBrief) {
            state.scoutHandoffBrief = data.scoutHandoffBrief;
          }
          if (data && data.scoutHandoff) {
            state.scoutHandoff = data.scoutHandoff;
          }
          if (data && data.scoutWorkRequest) {
            state.scoutWorkRequest = data.scoutWorkRequest;
          }
          if (data && data.scoutCandidateBatch) {
            state.scoutCandidateBatch = data.scoutCandidateBatch;
          }
          if (data && data.scoutHandoffBrief) {
            els.sidePanel.innerHTML = renderScoutHandoffBrief(
              data.scoutHandoffBrief
            );
            els.sidePanelTitle.textContent = 'Scout Handoff';
            els.sidePanelSub.textContent =
              data.scoutHandoffBrief.uiStatus ||
              (data.scoutHandoff && data.scoutHandoff.uiStatus) ||
              'Brief created';
          } else if (data && data.prospectListBuildProposal) {
            els.sidePanel.innerHTML = renderProspectListBuildProposal(
              data.prospectListBuildProposal
            );
            els.sidePanelTitle.textContent = 'Prospect List Build Proposal';
            els.sidePanelSub.textContent =
              'Approach only — no prospect list built yet';
          } else if (data && data.prospectListCriteriaPreview) {
            els.sidePanel.innerHTML = renderProspectListCriteriaPreview(
              data.prospectListCriteriaPreview
            );
            els.sidePanelTitle.textContent = 'Prospect List Criteria Preview';
            els.sidePanelSub.textContent =
              'Criteria only — no prospect list built yet';
          } else if (data && data.firstCampaignPlanPreview) {
            els.sidePanel.innerHTML = renderFirstCampaignPlanPreview(
              data.firstCampaignPlanPreview
            );
            els.sidePanelTitle.textContent = 'First Campaign Plan Preview';
            els.sidePanelSub.textContent = 'Review before any list, copy, or launch';
          }
          if (data && data.message) addBubble('assistant', data.message);
          setComposerEnabled(true);
          return;
        }

        if (state.phase === 'growth' || state.growthConversationActive) {
          const data = await api(
            'POST',
            '/api/v1/interview/' + encodeURIComponent(state.interviewId) + '/growth/message',
            { message: text }
          );
          if (data && data.initialGrowthDirection) {
            state.initialGrowthDirection = data.initialGrowthDirection;
          }
          if (data && data.firstGrowthPlanPreview) {
            state.firstGrowthPlanPreview = data.firstGrowthPlanPreview;
            setGrowthPreviewActionsVisible(true);
          } else if (data && data.suggestedActions && data.suggestedActions.length) {
            setGrowthPreviewActionsVisible(true);
          }
          if (data && data.message) addBubble('assistant', data.message);
          setComposerEnabled(true);
          return;
        }

        const pending = api('POST', '/api/v1/interview/' + encodeURIComponent(state.interviewId) + '/message', {
          message: text,
        });
        const data = await pending;
        if (data.blueprint || data.nextAction === 'GENERATE_BLUEPRINT' || data.nextAction === 'COMPLETE') {
          if (data.reflection) addBubble('reflection', data.reflection);
          await enterUnderstandingFlow(data);
          return;
        }
        applyDiscoveryPayload(data);
        setComposerEnabled(true);
      } catch (err) {
        showError(err.message);
        setComposerEnabled(
          state.phase === 'discovery' ||
            state.phase === 'growth' ||
            state.phase === 'readiness' ||
            state.phase === 'campaign_planning'
        );
      }
    }

    async function startCampaignPlanningConversation() {
      try {
        if (!state.interviewId) return;
        state.growthConversationActive = false;
        state.readinessConversationActive = false;
        setGrowthPreviewActionsVisible(false);
        const data = await api(
          'POST',
          '/api/v1/interview/' +
            encodeURIComponent(state.interviewId) +
            '/campaign/start',
          {}
        );
        if (data && data.blueprint) state.blueprint = data.blueprint;
        if (data && data.firstCampaignPlanPreview) {
          state.firstCampaignPlanPreview = data.firstCampaignPlanPreview;
        }
        if (data && data.prospectListCriteriaPreview) {
          state.prospectListCriteriaPreview = data.prospectListCriteriaPreview;
        }
        if (data && data.prospectListBuildProposal) {
          state.prospectListBuildProposal = data.prospectListBuildProposal;
        }
        if (state.prospectListBuildProposal) {
          els.sidePanel.innerHTML = renderProspectListBuildProposal(
            state.prospectListBuildProposal
          );
        } else if (state.prospectListCriteriaPreview) {
          els.sidePanel.innerHTML = renderProspectListCriteriaPreview(
            state.prospectListCriteriaPreview
          );
        } else if (state.firstCampaignPlanPreview) {
          els.sidePanel.innerHTML = renderFirstCampaignPlanPreview(
            state.firstCampaignPlanPreview
          );
        } else {
          els.sidePanel.innerHTML =
            '<div class="growth-direction" id="firstCampaignPlanPreview">' +
              '<p class="growth-kicker">First Campaign Plan Preview</p>' +
              '<p class="blueprint-empty">Answer a few planning questions and Max will draft the preview here.</p>' +
            '</div>';
        }
        state.campaignPlanningConversationActive = true;
        setPhase('campaign_planning');
        if (data && data.message) {
          if (!data.resumed) {
            addBubble('meta', 'First Campaign Planning started');
          }
          addBubble('assistant', data.message);
        }
        els.sessionStatus.textContent = 'CAMPAIGN PLANNING · review-first';
        els.messageInput.placeholder =
          'Confirm objective, segment, market, proof, hypothesis…';
        els.messageInput.focus();
      } catch (err) {
        showError(err.message);
      }
    }

    async function startGrowthConversation() {
      try {
        if (!state.interviewId) return;
        els.growthBtn.disabled = true;
        if (els.readinessBtn) els.readinessBtn.disabled = true;
        state.readinessConversationActive = false;
        state.campaignPlanningConversationActive = false;
        const data = await api(
          'POST',
          '/api/v1/interview/' + encodeURIComponent(state.interviewId) + '/growth/start',
          {}
        );
        if (data && data.initialGrowthDirection) {
          state.initialGrowthDirection = data.initialGrowthDirection;
        }
        if (data && data.blueprint) state.blueprint = data.blueprint;
        state.growthConversationActive = true;
        setPhase('growth');
        if (data && data.message) {
          if (!data.resumed) addBubble('meta', 'Growth Conversation started');
          addBubble('assistant', data.message);
        }
        els.sessionStatus.textContent = 'GROWTH · using approved Blueprint';
        els.messageInput.placeholder = 'Talk with Max about the first growth focus…';
        els.messageInput.focus();
      } catch (err) {
        showError(err.message);
        els.growthBtn.disabled = false;
        if (els.readinessBtn) els.readinessBtn.disabled = false;
      }
    }

    async function startInfrastructureReadiness() {
      try {
        if (!state.interviewId) return;
        if (els.readinessBtn) els.readinessBtn.disabled = true;
        if (els.growthBtn) els.growthBtn.disabled = true;
        if (els.checkInfraFromGrowthBtn) els.checkInfraFromGrowthBtn.disabled = true;
        state.growthConversationActive = false;
        state.campaignPlanningConversationActive = false;
        setGrowthPreviewActionsVisible(false);
        const data = await api(
          'POST',
          '/api/v1/interview/' + encodeURIComponent(state.interviewId) + '/readiness/start',
          {}
        );
        if (data && data.blueprint) state.blueprint = data.blueprint;
        if (data && data.growthInfrastructureReadinessReport) {
          state.growthInfrastructureReadinessReport = data.growthInfrastructureReadinessReport;
          els.sidePanel.innerHTML = renderReadinessReport(data.growthInfrastructureReadinessReport);
        }
        state.readinessConversationActive = true;
        setPhase('readiness');
        if (data && data.message) {
          if (!data.resumed) {
            addBubble(
              'meta',
              data.growthHandoff && data.growthHandoff.primarySegment
                ? 'Growth Infrastructure Readiness · from First Growth Plan'
                : 'Growth Infrastructure Readiness started'
            );
          }
          addBubble('assistant', data.message);
        }
        els.sessionStatus.textContent = 'READINESS · capture & convert setup';
        els.messageInput.placeholder = 'Tell Max about website, GBP, leads, tracking, assets…';
        els.messageInput.focus();
      } catch (err) {
        showError(err.message);
        if (els.readinessBtn) els.readinessBtn.disabled = false;
        if (els.growthBtn) els.growthBtn.disabled = false;
        if (els.checkInfraFromGrowthBtn) els.checkInfraFromGrowthBtn.disabled = false;
        if (state.firstGrowthPlanPreview) setGrowthPreviewActionsVisible(true);
      }
    }

    async function sendGrowthCtaMessage(text) {
      if (!state.interviewId || !text) return;
      addBubble('client', text);
      setComposerEnabled(false);
      try {
        const data = await api(
          'POST',
          '/api/v1/interview/' + encodeURIComponent(state.interviewId) + '/growth/message',
          { message: text }
        );
        if (data && data.firstGrowthPlanPreview) {
          state.firstGrowthPlanPreview = data.firstGrowthPlanPreview;
        }
        if (data && data.message) addBubble('assistant', data.message);
        if (data && data.suggestedActions && data.suggestedActions.length) {
          setGrowthPreviewActionsVisible(true);
        }
        setComposerEnabled(true);
      } catch (err) {
        showError(err.message);
        setComposerEnabled(true);
      }
    }

    els.sendBtn.addEventListener('click', sendMessage);
    els.messageInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    els.accurateBtn.addEventListener('click', () => {
      setPhase('blueprint');
      addBubble(
        'assistant',
        "Here's your Business Blueprint — the living record of what I understand about your business. Edit anything that needs sharpening, then approve when it feels right."
      );
      renderBlueprint(state.blueprint, { editable: true });
      els.sessionStatus.textContent =
        'Session ' + state.interviewId + ' · Business Blueprint';
    });

    async function resumeConversation() {
      try {
        const data = await api('POST', '/api/v1/interview/' + encodeURIComponent(state.interviewId) + '/resume', {});
        setPhase('discovery');
        applyDiscoveryPayload(data);
        setComposerEnabled(true);
      } catch (err) {
        showError(err.message);
      }
    }

    els.refineBtn.addEventListener('click', resumeConversation);
    els.keepTalkingBtn.addEventListener('click', resumeConversation);

    els.reviseBtn.addEventListener('click', async () => {
      try {
        if (!state.blueprint) return;
        const sections = {};
        els.sidePanel.querySelectorAll('textarea[data-key]').forEach((ta) => {
          sections[ta.getAttribute('data-key')] = { summary: ta.value };
        });
        const bp = await api('POST', '/api/v1/blueprint/' + encodeURIComponent(state.blueprint.id) + '/revise', {
          sections,
        });
        renderBlueprint(bp, { editable: true });
      } catch (err) {
        showError(err.message);
      }
    });

    els.approveBtn.addEventListener('click', async () => {
      try {
        if (!state.blueprint) return;

        // Already approved — friendly idempotent UI, never call approve again.
        if (
          state.sessionStatus === 'APPROVED' ||
          state.blueprint.status === 'approved' ||
          state.phase === 'complete'
        ) {
          applyApprovedState(state.pendingCompletion || { blueprint: state.blueprint }, {
            alreadyApproved: true,
          });
          return;
        }

        if (state.approveInFlight || state.phase === 'playbook_prep') return;

        state.approveInFlight = true;
        els.approveBtn.disabled = true;
        els.reviseBtn.disabled = true;
        els.approveBtn.textContent = 'Approving…';
        els.blueprintActions.hidden = true;
        setPhase('playbook_prep');
        addBubble('meta', 'Preparing your Client Playbook…');

        const pending = api(
          'POST',
          '/api/v1/blueprint/' + encodeURIComponent(state.blueprint.id) + '/approve',
          {}
        );
        const result = await runChecklist(PLAYBOOK_STEPS, 2500, pending);

        // Refresh session/artifacts after approval so local status matches server.
        let fresh = null;
        if (state.interviewId) {
          try {
            fresh = await api('GET', '/api/v1/interview/' + encodeURIComponent(state.interviewId));
          } catch (_) {
            fresh = null;
          }
        }
        if (fresh && fresh.status) state.sessionStatus = fresh.status;
        if (fresh && fresh.blueprint) {
          state.blueprint = fresh.blueprint;
        } else if (result && result.blueprint) {
          state.blueprint = result.blueprint;
        }

        const already =
          !!(result && (result.alreadyApproved || result.message === 'already_approved'));
        if (result && result.initialGrowthDirection) {
          state.initialGrowthDirection = result.initialGrowthDirection;
        } else if (fresh && fresh.initialGrowthDirection) {
          state.initialGrowthDirection = fresh.initialGrowthDirection;
        }
        applyApprovedState(
          {
            ...(result || {}),
            blueprint: state.blueprint || (result && result.blueprint),
            playbook: (result && result.playbook) || null,
            initialGrowthDirection:
              state.initialGrowthDirection ||
              (result && result.initialGrowthDirection) ||
              null,
          },
          { alreadyApproved: already }
        );
        if (!already) {
          const focusLine =
            state.initialGrowthDirection && state.initialGrowthDirection.firstFocus
              ? '\n\nBased on this Blueprint, a sensible first growth focus is ' +
                state.initialGrowthDirection.firstFocus +
                '.'
              : '';
          addBubble(
            'assistant',
            'Excellent.\n\nI now understand your business well enough to begin helping it grow.\n\nEvery recommendation Pulseforge makes will build on this understanding.' +
              focusLine +
              '\n\nReview the Initial Growth Direction, then start the Growth Conversation when you are ready.'
          );
        }
      } catch (err) {
        const msg = String((err && err.message) || '');
        if (/already_approved|was APPROVED|already approved/i.test(msg)) {
          applyApprovedState(state.pendingCompletion || { blueprint: state.blueprint }, {
            alreadyApproved: true,
          });
          return;
        }
        state.approveInFlight = false;
        showError(msg);
        setPhase('blueprint');
        if (state.blueprint) {
          renderBlueprint(state.blueprint, { editable: true });
        }
      }
    });

    els.growthBtn.addEventListener('click', async () => {
      if (state.interviewId && state.sessionStatus === 'APPROVED') {
        try {
          await resumeSession(state.interviewId, 'continue');
          return;
        } catch (err) {
          showError(err.message);
        }
      }
      await startGrowthConversation();
    });
    els.readinessBtn.addEventListener('click', startInfrastructureReadiness);
    els.dashboardBtn.addEventListener('click', () => {
      window.location.href = '/dashboard';
    });
    if (els.continueTaskBtn) {
      els.continueTaskBtn.addEventListener('click', () => {
        continueCurrentTask({ silent: false }).catch((err) => showError(err.message));
      });
    }
    if (els.completeTaskBtn) {
      els.completeTaskBtn.addEventListener('click', () => {
        completeCurrentTask().catch((err) => showError(err.message));
      });
    }
    if (els.workspaceDashboardBtn) {
      els.workspaceDashboardBtn.addEventListener('click', () => {
        window.location.href = '/dashboard';
      });
    }
    if (els.workspaceTabs) {
      els.workspaceTabs.addEventListener('click', (event) => {
        const btn = event.target && event.target.closest('button[data-tab]');
        if (!btn) return;
        setWorkspaceTab(btn.getAttribute('data-tab'));
      });
    }
    if (els.sidePanel) {
      els.sidePanel.addEventListener('click', (event) => {
        const btn = event.target && event.target.closest('button[data-completion]');
        if (!btn) return;
        const id = btn.getAttribute('data-completion');
        if (id === 'new_growth_plan') {
          startNewInterviewFlow();
          return;
        }
        const label = String(btn.textContent || id).trim();
        let followUp =
          'This stays review-first. No campaign, prospect list, or account changes begin without operator approval — start a new Growth Conversation or return to the dashboard when you are ready.';
        if (id === 'launch_campaign' || label === 'Plan First Campaign') {
          startCampaignPlanningConversation().catch((err) =>
            showError(err.message)
          );
          return;
        }
        addBubble(
          'assistant',
          'Next objective noted: ' + label + '.\n\n' + followUp
        );
      });
    }
    if (els.useFocusBtn) {
      els.useFocusBtn.addEventListener('click', () =>
        sendGrowthCtaMessage('Use this focus')
      );
    }
    if (els.refineSegmentBtn) {
      els.refineSegmentBtn.addEventListener('click', () =>
        sendGrowthCtaMessage('Refine first segment')
      );
    }
    if (els.checkInfraFromGrowthBtn) {
      els.checkInfraFromGrowthBtn.addEventListener(
        'click',
        startInfrastructureReadiness
      );
    }
    if (els.growthDashboardBtn) {
      els.growthDashboardBtn.addEventListener('click', () => {
        window.location.href = '/dashboard';
      });
    }

    if (els.savedSessions) {
      els.savedSessions.addEventListener('click', async (event) => {
        const btn = event.target && event.target.closest('button[data-action]');
        if (!btn) return;
        const action = btn.getAttribute('data-action');
        if (action === 'new') {
          startNewInterviewFlow();
          return;
        }
        const sessionId = btn.getAttribute('data-session-id');
        if (!sessionId) return;
        try {
          btn.disabled = true;
          await resumeSession(sessionId, action);
        } catch (err) {
          showError(err.message);
          showWelcome();
        } finally {
          btn.disabled = false;
        }
      });
    }

    if (els.newInterviewBtn) {
      els.newInterviewBtn.addEventListener('click', startNewInterviewFlow);
    }

    if (els.loadAnchorFixtureBtn) {
      els.loadAnchorFixtureBtn.addEventListener('click', async () => {
        try {
          els.loadAnchorFixtureBtn.disabled = true;
          const data = await api(
            'POST',
            '/api/v1/client-intel/fixtures/anchor-blueprint',
            {}
          );
          applyResumeState(data, 'continue');
          await loadSavedSessions();
        } catch (err) {
          showError(err.message);
        } finally {
          els.loadAnchorFixtureBtn.disabled = false;
        }
      });
    }

    async function bootFromQuery() {
      const params = new URLSearchParams(window.location.search || '');
      const interviewId = params.get('interviewId') || params.get('sessionId');
      const action = params.get('action') || 'continue';
      const clientId = params.get('clientId');
      if (clientId && els.clientId) els.clientId.value = clientId;

      if (action === 'new' && !interviewId) {
        showWelcome();
        addBubble('meta', 'Start a new interview when ready — existing approved Blueprints stay saved.');
        return;
      }

      if (interviewId) {
        try {
          await resumeSession(interviewId, action);
          return;
        } catch (err) {
          showError(err.message);
        }
      }
      showWelcome();
    }

    window.addEventListener('resize', () => {
      if (state.phase === 'growth_workspace' && state.taskGuidanceOpen) {
        applyGuidanceFooterClearance();
      }
    });

    bootFromQuery();
  </script>
</body>
</html>
