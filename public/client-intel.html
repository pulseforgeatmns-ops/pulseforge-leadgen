<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pulseforge — Client Intelligence</title>
  <link rel="icon" href="/favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/shared/tokens.css">
  <style>
    :root {
      --cie-bg: #0c1016;
      --cie-panel: #141b24;
      --cie-panel-elevated: #1a2330;
      --cie-border: #2a3544;
      --cie-border-soft: rgba(42, 53, 68, 0.65);
      --cie-text: #e8eef5;
      --cie-muted: #8b9bb0;
      --cie-accent: #3d9cfd;
      --cie-accent-soft: rgba(61, 156, 253, 0.14);
      --cie-ok: #3ecf8e;
      --cie-warn: #e6b84d;
      --cie-bad: #e57373;
      --cie-assistant: #1e2836;
      --cie-client: #1a3348;
      --cie-header-h: 3.5rem;
    }
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
    }
    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background:
        radial-gradient(900px 480px at 8% -8%, rgba(42, 72, 110, 0.35), transparent 60%),
        radial-gradient(700px 400px at 92% 0%, rgba(30, 58, 90, 0.22), transparent 55%),
        var(--cie-bg);
      color: var(--cie-text);
      display: flex;
      flex-direction: column;
    }
    header {
      flex: 0 0 auto;
      height: var(--cie-header-h);
      padding: 0 1.5rem;
      border-bottom: 1px solid var(--cie-border);
      display: flex;
      gap: 1rem;
      align-items: center;
    }
    header h1 {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    header p {
      margin: 0;
      color: var(--cie-muted);
      font-size: 0.85rem;
    }
    .workspace {
      flex: 1 1 auto;
      min-height: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.25rem;
      padding: 1.15rem 1.5rem 1.25rem;
      max-width: 1280px;
      width: 100%;
      margin: 0 auto;
      height: calc(100vh - var(--cie-header-h));
      max-height: calc(100vh - var(--cie-header-h));
    }
    @media (max-width: 900px) {
      html, body { overflow: auto; height: auto; }
      body { display: block; }
      .workspace {
        grid-template-columns: 1fr;
        height: auto;
        max-height: none;
        min-height: calc(100vh - var(--cie-header-h));
      }
      .panel { min-height: 70vh; max-height: 80vh; }
    }
    .panel {
      background: var(--cie-panel);
      border: 1px solid var(--cie-border);
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      min-height: 0;
      height: 100%;
      overflow: hidden;
    }
    .panel-head {
      flex: 0 0 auto;
      padding: 1rem 1.25rem 0.9rem;
      border-bottom: 1px solid var(--cie-border);
    }
    .panel-head h2 {
      margin: 0;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.01em;
    }
    .panel-head .sub {
      margin: 0.35rem 0 0;
      color: var(--cie-muted);
      font-size: 0.8rem;
      line-height: 1.4;
    }
    .progress-block { margin-top: 0.85rem; }
    .progress-label {
      display: flex;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 0.4rem;
      font-size: 0.78rem;
      color: var(--cie-muted);
    }
    .progress-label strong { color: var(--cie-text); font-weight: 500; }
    .progress-pct {
      font-family: 'JetBrains Mono', monospace;
      color: var(--cie-accent);
    }
    .progress-track {
      height: 0.4rem;
      border-radius: 999px;
      background: #0f1419;
      border: 1px solid var(--cie-border-soft);
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      border-radius: inherit;
      background: linear-gradient(90deg, #2f7fd6, var(--cie-accent));
      transition: width 280ms ease;
    }
    .controls {
      flex: 0 0 auto;
      display: flex;
      gap: 0.5rem;
      padding: 0.65rem 1.15rem;
      border-bottom: 1px solid var(--cie-border);
      flex-wrap: wrap;
      align-items: center;
    }
    .controls.soft {
      opacity: 0.72;
      font-size: 0.82rem;
    }
    input, textarea, button { font: inherit; }
    input, textarea {
      background: #0f1419;
      border: 1px solid var(--cie-border);
      color: var(--cie-text);
      border-radius: 10px;
      padding: 0.55rem 0.7rem;
    }
    input { width: 5.5rem; }
    button {
      background: var(--cie-accent);
      color: #041018;
      border: none;
      border-radius: 10px;
      padding: 0.55rem 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }
    button.secondary {
      background: transparent;
      color: var(--cie-text);
      border: 1px solid var(--cie-border);
    }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    #chatLog {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 1.25rem 1.3rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.05rem;
      scroll-behavior: smooth;
    }
    .bubble {
      max-width: 88%;
      padding: 0.95rem 1.05rem;
      border-radius: 16px;
      font-size: 0.96rem;
      line-height: 1.6;
      letter-spacing: 0.005em;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .bubble.assistant {
      align-self: flex-start;
      background: var(--cie-assistant);
      border: 1px solid var(--cie-border-soft);
      border-bottom-left-radius: 6px;
    }
    .bubble.client {
      align-self: flex-end;
      background: var(--cie-client);
      border: 1px solid rgba(61, 156, 253, 0.22);
      border-bottom-right-radius: 6px;
    }
    .bubble.reflection {
      align-self: flex-start;
      background: var(--cie-accent-soft);
      border: 1px solid rgba(61, 156, 253, 0.28);
      color: #d7e8fb;
      font-style: italic;
      border-bottom-left-radius: 6px;
    }
    .bubble.meta {
      align-self: center;
      color: var(--cie-muted);
      font-size: 0.8rem;
      background: transparent;
      border: none;
      padding: 0.35rem 0.5rem;
      max-width: 100%;
    }
    .bubble.trust {
      align-self: flex-start;
      max-width: 94%;
      background: linear-gradient(160deg, rgba(61, 156, 253, 0.16), rgba(30, 40, 54, 0.9));
      border: 1px solid rgba(61, 156, 253, 0.35);
      font-size: 1.02rem;
      line-height: 1.65;
    }
    .composer {
      flex: 0 0 auto;
      display: flex;
      gap: 0.6rem;
      padding: 0.9rem 1.15rem;
      border-top: 1px solid var(--cie-border);
      background: var(--cie-panel-elevated);
    }
    .composer[hidden], .controls[hidden], .actions[hidden] { display: none !important; }
    .composer textarea {
      flex: 1;
      min-height: 3.4rem;
      max-height: 7rem;
      resize: none;
      line-height: 1.45;
    }
    #sidePanel {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 1.15rem 1.2rem 1.4rem;
    }
    .blueprint-empty {
      color: var(--cie-muted);
      font-size: 0.92rem;
      line-height: 1.55;
      margin: 0.35rem 0;
    }
    .understanding-list {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }
    .understanding-row {
      position: relative;
      padding: 0.85rem 0.95rem;
      border-radius: 12px;
      border: 1px solid var(--cie-border-soft);
      background: rgba(15, 20, 25, 0.55);
    }
    .understanding-row-top {
      display: flex;
      justify-content: space-between;
      gap: 0.75rem;
      align-items: baseline;
    }
    .understanding-title {
      font-size: 0.9rem;
      font-weight: 600;
    }
    .understanding-title.ready::before {
      content: '✓ ';
      color: var(--cie-ok);
    }
    .conf-pct {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.82rem;
    }
    .conf-pct.bad { color: var(--cie-bad); }
    .conf-pct.warn { color: var(--cie-warn); }
    .conf-pct.ok { color: var(--cie-ok); }
    .conf-bar {
      margin-top: 0.55rem;
      height: 0.28rem;
      border-radius: 999px;
      background: #0f1419;
      overflow: hidden;
    }
    .conf-bar > span {
      display: block;
      height: 100%;
      border-radius: inherit;
      transition: width 280ms ease;
    }
    .conf-bar > span.bad { background: var(--cie-bad); }
    .conf-bar > span.warn { background: var(--cie-warn); }
    .conf-bar > span.ok { background: var(--cie-ok); }
    .understanding-status {
      margin-top: 0.45rem;
      font-size: 0.78rem;
      color: var(--cie-muted);
    }
    .conf-tip {
      display: none;
      position: absolute;
      left: 0.75rem;
      right: 0.75rem;
      top: calc(100% - 0.35rem);
      z-index: 5;
      padding: 0.7rem 0.8rem;
      border-radius: 10px;
      background: #0f1620;
      border: 1px solid var(--cie-border);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
      font-size: 0.78rem;
      line-height: 1.45;
      color: var(--cie-text);
    }
    .understanding-row:hover .conf-tip,
    .understanding-row:focus-within .conf-tip {
      display: block;
    }
    .section {
      padding: 1.1rem 0 1.2rem;
      border-bottom: 1px solid var(--cie-border-soft);
    }
    .section:last-child { border-bottom: none; }
    .section-title {
      margin: 0 0 0.55rem;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--cie-muted);
    }
    .section-summary {
      margin: 0 0 0.8rem;
      font-size: 0.94rem;
      line-height: 1.6;
      color: var(--cie-text);
    }
    .section-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.65rem 1rem;
      align-items: center;
      margin-bottom: 0.55rem;
    }
    .evidence-count {
      color: var(--cie-muted);
      font-size: 0.78rem;
    }
    .unknowns {
      color: var(--cie-warn);
      font-size: 0.8rem;
      line-height: 1.45;
      margin: 0 0 0.55rem;
      padding: 0.55rem 0.7rem;
      border-radius: 8px;
      background: rgba(230, 184, 77, 0.08);
      border: 1px solid rgba(230, 184, 77, 0.22);
    }
    .section textarea {
      width: 100%;
      min-height: 4.2rem;
      margin-top: 0.15rem;
      line-height: 1.5;
      resize: vertical;
    }
    .exec-card {
      padding: 0.55rem 0.15rem 1rem;
      animation: briefReveal 640ms ease both;
    }
    @keyframes briefReveal {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .exec-card h3 {
      margin: 0 0 0.4rem;
      font-size: 1.35rem;
      font-weight: 600;
      letter-spacing: 0.015em;
      line-height: 1.25;
    }
    .exec-card .exec-sub {
      margin: 0;
      color: var(--cie-muted);
      font-size: 0.88rem;
      line-height: 1.45;
    }
    .exec-card .exec-tagline {
      margin: 0.2rem 0 1.55rem;
      color: var(--cie-muted);
      font-size: 0.8rem;
      opacity: 0.9;
    }
    .exec-section {
      margin: 0 0 1.55rem;
      padding-bottom: 0.15rem;
    }
    .exec-section h4 {
      margin: 0 0 0.55rem;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--cie-muted);
    }
    .exec-section p {
      margin: 0;
      font-size: 0.98rem;
      line-height: 1.68;
      white-space: pre-wrap;
    }
    .exec-section p + p { margin-top: 0.65rem; }
    .exec-list {
      margin: 0.55rem 0 0;
      padding: 0 0 0 1.1rem;
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
    }
    .exec-list li {
      font-size: 0.95rem;
      line-height: 1.55;
      color: var(--cie-text);
    }
    .assessment-grid {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      margin: 0.35rem 0 0.85rem;
    }
    .assessment-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.35rem 1rem;
      align-items: baseline;
    }
    .assessment-label {
      font-size: 0.95rem;
      font-weight: 500;
    }
    .assessment-stars {
      font-size: 0.95rem;
      letter-spacing: 0.08em;
      color: var(--cie-warn);
      font-variant-emoji: text;
    }
    .assessment-explain {
      grid-column: 1 / -1;
      margin: 0;
      font-size: 0.82rem;
      line-height: 1.45;
      color: var(--cie-muted);
    }
    .assessment-confidence {
      margin-top: 0.35rem;
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .assessment-confidence span {
      color: var(--cie-accent);
      font-family: 'JetBrains Mono', monospace;
    }
    .checklist {
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
      padding: 0.35rem 0;
    }
    .checklist-item {
      display: flex;
      gap: 0.65rem;
      align-items: flex-start;
      color: var(--cie-muted);
      font-size: 0.92rem;
      line-height: 1.45;
      transition: color 220ms ease;
    }
    .checklist-item.done { color: var(--cie-text); }
    .checklist-mark {
      font-family: 'JetBrains Mono', monospace;
      width: 1.1rem;
      color: var(--cie-border);
    }
    .checklist-item.done .checklist-mark { color: var(--cie-ok); }
    .checklist-item.active .checklist-mark { color: var(--cie-accent); }
    .status-bar {
      flex: 0 0 auto;
      padding: 0.55rem 1.15rem;
      font-size: 0.78rem;
      color: var(--cie-muted);
      border-top: 1px solid var(--cie-border);
    }
    .actions {
      flex: 0 0 auto;
      display: flex;
      gap: 0.5rem;
      padding: 0.85rem 1.15rem;
      border-top: 1px solid var(--cie-border);
      background: var(--cie-panel-elevated);
      flex-wrap: wrap;
    }
    .completion-card h3 {
      margin: 0 0 0.75rem;
      font-size: 1.2rem;
    }
    .completion-card p {
      margin: 0 0 0.85rem;
      line-height: 1.6;
      font-size: 0.95rem;
    }
    .completion-checks {
      list-style: none;
      padding: 0;
      margin: 0 0 1.15rem;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }
    .completion-checks li {
      font-size: 0.92rem;
      color: var(--cie-text);
    }
    .completion-checks li::before {
      content: '✓ ';
      color: var(--cie-ok);
    }
    .growth-direction {
      margin-top: 1.35rem;
      padding-top: 1.15rem;
      border-top: 1px solid var(--cie-border-soft);
      animation: briefReveal 640ms ease both;
    }
    .growth-direction .growth-kicker {
      margin: 0 0 0.45rem;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--cie-accent);
    }
    .growth-direction h4 {
      margin: 0 0 0.85rem;
      font-size: 1.08rem;
      font-weight: 600;
      line-height: 1.35;
    }
    .growth-direction p {
      margin: 0 0 0.75rem;
      line-height: 1.6;
      font-size: 0.94rem;
    }
    .growth-direction .growth-disclaimer {
      margin: 0.9rem 0 0;
      padding: 0.65rem 0.75rem;
      border-radius: 8px;
      background: rgba(230, 184, 77, 0.08);
      border: 1px solid rgba(230, 184, 77, 0.22);
      color: var(--cie-warn);
      font-size: 0.8rem;
      line-height: 1.45;
    }
    .error {
      position: fixed;
      left: 1.5rem;
      right: 1.5rem;
      bottom: 1rem;
      z-index: 20;
      color: #ffb4b4;
      background: rgba(40, 16, 16, 0.92);
      border: 1px solid rgba(255, 123, 123, 0.35);
      border-radius: 10px;
      padding: 0.65rem 0.9rem;
      font-size: 0.85rem;
      max-width: 1280px;
      margin: 0 auto;
    }
    .fade-out {
      opacity: 0;
      transition: opacity 480ms ease;
    }
    .session-list {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      margin-top: 0.85rem;
    }
    .session-card {
      border: 1px solid var(--cie-border);
      border-radius: 12px;
      background: var(--cie-panel-elevated);
      padding: 0.85rem 0.95rem;
      text-align: left;
    }
    .session-card.sample {
      border-color: rgba(230, 184, 77, 0.45);
      background: rgba(230, 184, 77, 0.08);
    }
    .session-card-title {
      margin: 0;
      font-size: 0.92rem;
      font-weight: 600;
    }
    .session-card-meta {
      margin: 0.3rem 0 0.7rem;
      color: var(--cie-muted);
      font-size: 0.78rem;
      line-height: 1.4;
    }
    .session-card-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }
    .session-card-actions button {
      font-size: 0.78rem;
      padding: 0.4rem 0.7rem;
    }
    .sample-badge {
      display: inline-block;
      margin-left: 0.4rem;
      padding: 0.1rem 0.4rem;
      border-radius: 4px;
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #1a1408;
      background: var(--cie-warn);
    }
    .fixture-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
      margin-top: 0.75rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Client Intelligence</h1>
    <p>A conversation with Max about how your business works</p>
  </header>

  <div class="workspace">
    <section class="panel" aria-label="Interview chat">
      <div class="panel-head">
        <h2 id="chatPanelTitle">Conversation</h2>
        <div class="progress-block" id="progressBlock" hidden>
          <div class="progress-label">
            <strong id="progressLabel">Business Understanding</strong>
            <span class="progress-pct" id="progressPct">0%</span>
          </div>
          <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progressTrack">
            <div class="progress-fill" id="progressFill"></div>
          </div>
        </div>
      </div>
      <div class="controls soft" id="operatorControls">
        <label>Client ID <input id="clientId" value="1" inputmode="numeric"></label>
        <button type="button" id="startBtn">Begin</button>
        <button type="button" id="notesBtn" class="secondary">Start from notes</button>
        <button type="button" id="newInterviewBtn" class="secondary" hidden>Start New Interview</button>
        <button type="button" id="loadAnchorFixtureBtn" class="secondary" hidden>Load Anchor sample Blueprint</button>
      </div>
      <div id="savedSessions" class="session-list" hidden></div>
      <div id="chatLog" aria-live="polite"></div>
      <div class="composer" id="composer" hidden>
        <textarea id="messageInput" placeholder="Share your thoughts…" rows="2"></textarea>
        <button type="button" id="sendBtn" disabled>Send</button>
      </div>
      <div class="actions" id="execActions" hidden>
        <button type="button" id="accurateBtn">✓ Yes, this reflects my business.</button>
        <button type="button" id="refineBtn" class="secondary">✏️ I'd like to refine this.</button>
        <button type="button" id="keepTalkingBtn" class="secondary">💬 Let's keep talking.</button>
      </div>
      <div class="actions" id="completeActions" hidden>
        <button type="button" id="growthBtn">Start Growth Conversation</button>
        <button type="button" id="readinessBtn" class="secondary">Check Growth Infrastructure</button>
        <button type="button" id="dashboardBtn" class="secondary">Return to Dashboard</button>
      </div>
      <div class="actions" id="growthPreviewActions" hidden>
        <button type="button" id="useFocusBtn">Use this focus</button>
        <button type="button" id="refineSegmentBtn" class="secondary">Refine first segment</button>
        <button type="button" id="checkInfraFromGrowthBtn" class="secondary">Check Growth Infrastructure</button>
        <button type="button" id="growthDashboardBtn" class="secondary">Return to Dashboard</button>
      </div>
      <div class="status-bar" id="sessionStatus">Welcome</div>
    </section>

    <section class="panel" aria-label="Business understanding">
      <div class="panel-head">
        <h2 id="sidePanelTitle">Business Understanding</h2>
        <p class="sub" id="sidePanelSub">Progress builds as we talk. Narratives appear after Max shares his understanding.</p>
      </div>
      <div id="sidePanel"><p class="blueprint-empty">When you're ready, begin the conversation.</p></div>
      <div class="actions" id="blueprintActions" hidden>
        <button type="button" id="reviseBtn" class="secondary" disabled>Save edits</button>
        <button type="button" id="approveBtn" disabled>Approve Blueprint</button>
      </div>
      <div class="status-bar" id="blueprintStatus"></div>
    </section>
  </div>
  <div class="error" id="errorBox" hidden></div>

  <script>
    const SECTION_TITLES = {
      identity: 'Identity',
      services: 'Services',
      idealCustomers: 'Ideal Customers',
      avoidCustomers: 'Customers to Avoid',
      targetMarkets: 'Target Markets',
      competitiveAdvantages: 'Competitive Advantages',
      brandVoice: 'Brand Voice',
      campaignGoals: 'Campaign Goals',
      successMetrics: 'Success Metrics',

    async function api(method, url, body) {
      showError('');
      const res = await fetch(url, {
        method,
        headers: {
          Accept: 'application/json',
          ...(body == null ? {} : { 'Content-Type': 'application/json' }),
        },
        body: body == null ? undefined : JSON.stringify(body),
        credentials: 'same-origin',
      });
      const text = await res.text();
      let json = null;
      try { json = text ? JSON.parse(text) : null; } catch (_) {}
      if (!res.ok) {
        const msg = (json && (json.message || json.error)) || text || res.statusText;
        throw new Error(msg);
      }
      return json;
    }

    function sleep(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));

    async function runChecklist(steps, minMs, backendPromise) {
      const wrap = document.createElement('div');
      wrap.className = 'checklist';
      wrap.setAttribute('aria-live', 'polite');
      const items = steps.map((label) => {
        const row = document.createElement('div');
        row.className = 'checklist-item';
        row.innerHTML = '<span class="checklist-mark">○</span><span>' + escapeHtml(label) + '</span>';
        wrap.appendChild(row);
        return row;
      });
      els.chatLog.appendChild(wrap);
      maybeScrollChat();

      const started = Date.now();
      let backendResult = null;
      let backendDone = false;
      const backendWait = Promise.resolve(backendPromise).then((r) => {
        backendDone = true;
        backendResult = r;
        return r;
      });

      const stepDelay = Math.max(320, Math.floor(minMs / Math.max(steps.length, 1)));
      for (let i = 0; i < items.length; i += 1) {
        items[i].classList.add('active');
        items[i].querySelector('.checklist-mark').textContent = '…';
        await sleep(stepDelay);
        items[i].classList.remove('active');
        items[i].classList.add('done');
        items[i].querySelector('.checklist-mark').textContent = '✓';
        maybeScrollChat();
        if (backendDone && Date.now() - started >= minMs && i >= items.length - 2) {
          for (let j = i + 1; j < items.length; j += 1) {
            items[j].classList.add('done');
            items[j].querySelector('.checklist-mark').textContent = '✓';
          }
          break;
        }
      }

      const elapsed = Date.now() - started;
      if (elapsed < minMs) await sleep(minMs - elapsed);
      await backendWait;
      return backendResult;
    }

    }

    async function enterUnderstandingFlow(data) {
      state.interviewId = data.interviewId || data.id || state.interviewId;
      if (data.status) state.sessionStatus = data.status;
      state.blueprint = data.blueprint || null;
      state.executiveSummary = data.executiveSummary || null;
      renderProgress(data.progress);
      if (data.understanding) renderUnderstanding(data.understanding);

      setPhase('understanding_load');
      addBubble('meta', 'Understanding your business…');
      await runChecklist(LOAD_STEPS, PREMIUM_LOAD_MS, Promise.resolve(data));
      await playTrustBridge();

      setPhase('executive_summary');
      addBubble(
        'assistant',
        "Thank you.\n\nI believe I understand your business well enough to begin helping you grow it.\n\nBefore we move forward, I'd like to share your Executive Business Brief."
      );
      if (state.executiveSummary) {
        renderExecutiveSummary(state.executiveSummary);
      } else if (state.blueprint && state.blueprint.sections) {
        renderExecutiveSummary({
          title: 'Executive Business Brief',
          subtitle: 'Prepared by Max',
          tagline: 'A working picture for leadership review',
          sections: [],
        });
      }
      els.sessionStatus.textContent =
        'Session ' + state.interviewId + ' · Executive Business Brief';
    }

    function applyDiscoveryPayload(data, { skipMessage } = {}) {
      state.interviewId = data.interviewId || data.id;
      if (data.status) state.sessionStatus = data.status;
      els.sessionStatus.textContent =
        'Session ' + state.interviewId + ' · ' + data.status +
        (data.currentStage ? ' · ' + data.currentStage : '');
      renderProgress(data.progress);
      if (data.understanding) renderUnderstanding(data.understanding);
      if (data.reflection) addBubble('reflection', data.reflection);
      if (
        !skipMessage &&
        data.message &&
        data.nextAction !== 'COMPLETE' &&
        data.nextAction !== 'GENERATE_BLUEPRINT'
      ) {
        addBubble('assistant', data.message);
      }
    }

    function resumeTargetLabel(target) {
      switch (target) {
        case 'infrastructure_readiness':
          return 'Infrastructure readiness report';
        case 'first_growth_plan_preview':
          return 'First Growth Plan Preview';
        case 'growth_conversation':
          return 'Growth Conversation in progress';
        case 'initial_growth_direction':
          return 'Initial Growth Direction';
        default:
          return 'Approved Blueprint';
      }
    }

    function renderSavedSessions(sessions) {
      if (!els.savedSessions) return;
      const list = Array.isArray(sessions) ? sessions : [];
      state.savedSessions = list;
      if (!list.length) {
        els.savedSessions.innerHTML = '';
        els.savedSessions.hidden = true;
        return;
      }
      els.savedSessions.hidden = state.phase !== 'welcome';
      els.savedSessions.innerHTML =
        '<p class="blueprint-empty" style="margin:0 0 0.25rem">Approved Blueprint sessions</p>' +
        list.map((s) => {
          const id = s.sessionId || s.interviewId;
          const sample = s.isSample
            ? '<span class="sample-badge">Sample / Dev</span>'
            : '';
          const meta = [
            resumeTargetLabel(s.resumeTarget),
            s.blueprintVersion ? 'v' + s.blueprintVersion : null,
            s.approvedAt ? 'approved ' + new Date(s.approvedAt).toLocaleDateString() : null,
          ].filter(Boolean).join(' · ');
          return (
            '<article class="session-card' + (s.isSample ? ' sample' : '') + '" data-session-id="' +
            escapeHtml(id) + '">' +
              '<p class="session-card-title">' + escapeHtml(s.label || (s.businessName + ' · Blueprint approved')) +
              sample + '</p>' +
              '<p class="session-card-meta">' + escapeHtml(meta) + '</p>' +
              '<div class="session-card-actions">' +
                '<button type="button" data-action="continue" data-session-id="' + escapeHtml(id) + '">Continue Growth Work</button>' +
                '<button type="button" class="secondary" data-action="view" data-session-id="' + escapeHtml(id) + '">View Blueprint</button>' +
                '<button type="button" class="secondary" data-action="new">Start New Interview</button>' +
              '</div>' +
            '</article>'
          );
        }).join('');
    }

    async function loadSavedSessions() {
      try {
        const clientId = (els.clientId && els.clientId.value.trim()) || '';
        const qs = new URLSearchParams({ includeSamples: '1', limit: '20' });
        if (clientId) qs.set('clientId', clientId);
        const data = await api('GET', '/api/v1/client-intel/sessions?' + qs.toString());
        state.fixturesAllowed = Boolean(data && data.fixturesAllowed);
        if (els.loadAnchorFixtureBtn) {
          els.loadAnchorFixtureBtn.hidden =
            state.phase !== 'welcome' || !state.fixturesAllowed;
        }
        renderSavedSessions((data && data.sessions) || []);
      } catch (_) {
        state.fixturesAllowed = true;
        if (els.loadAnchorFixtureBtn) {
          els.loadAnchorFixtureBtn.hidden = state.phase !== 'welcome';
        }
        renderSavedSessions([]);
      }
    }

    function hydrateTurns(turns) {
      const list = Array.isArray(turns) ? turns : [];
      for (const turn of list) {
        if (!turn || !turn.message) continue;
        if (turn.speaker === 'assistant') addBubble('assistant', turn.message);
        else if (turn.speaker === 'client') addBubble('client', turn.message);
        else addBubble('meta', turn.message);
      }
    }

    function applyResumeState(data, action) {
      state.interviewId = data.interviewId || data.id || state.interviewId;
      state.sessionStatus = data.status || state.sessionStatus;
      state.blueprint = data.blueprint || state.blueprint;
      state.initialGrowthDirection = data.initialGrowthDirection || null;
      state.growthInfrastructureReadinessReport =
        data.growthInfrastructureReadinessReport || null;
      state.firstGrowthPlanPreview = data.firstGrowthPlanPreview ||
        (data.latestGrowthState && data.latestGrowthState.firstGrowthPlanPreview) ||
        null;
      state.isSample = Boolean(data.isSample);
      state.growthConversationActive = false;
      state.readinessConversationActive = false;

      const mode = action || data.action || 'continue';
      const target = data.resumeTarget || 'initial_growth_direction';

      els.chatLog.innerHTML = '';
      state.stickToBottom = true;

      if (state.isSample) {
        addBubble(
          'meta',
          'SAMPLE / DEV DATA — resuming Anchor sample Blueprint. This is not a real client interview.'
        );
      }

      if (mode === 'view') {
        setPhase('complete');
        applyApprovedState(
          {
            blueprint: state.blueprint,
            initialGrowthDirection: state.initialGrowthDirection,
            playbook: data.playbook || null,
          },
          { alreadyApproved: true }
        );
        if (state.blueprint) {
          renderBlueprint(state.blueprint, { editable: false });
        }
        els.sessionStatus.textContent =
          'Session ' + state.interviewId + ' · Viewing approved Blueprint';
        addBubble(
          'assistant',
          'Here is the approved Business Blueprint. Continue Growth Work whenever you are ready — you will not need to re-answer the interview.'
        );
        return;
      }

      // Continue Growth Work — never restart Business Understanding.
      if (target === 'infrastructure_readiness') {
        state.readinessConversationActive = true;
        setPhase('readiness');
        const readinessTurns =
          (data.infrastructureReadiness && data.infrastructureReadiness.turns) || [];
        hydrateTurns(readinessTurns);
        if (state.growthInfrastructureReadinessReport) {
          els.sidePanel.innerHTML = renderReadinessReport(
            state.growthInfrastructureReadinessReport
          );
          els.sidePanelTitle.textContent = 'Growth Infrastructure Readiness Report';
          els.sidePanelSub.textContent = 'Latest saved readiness assessment';
        }
        els.sessionStatus.textContent = 'READINESS · resumed from approved Blueprint';
        els.messageInput.placeholder = 'Continue the readiness conversation…';
        return;
      }

      if (target === 'first_growth_plan_preview' || target === 'growth_conversation') {
        state.growthConversationActive = true;
        setPhase('growth');
        const growthTurns =
          (data.growthConversation && data.growthConversation.turns) || [];
        hydrateTurns(growthTurns);
        if (state.initialGrowthDirection) {
          els.sidePanel.innerHTML =
            '<div class="completion-card">' +
            renderGrowthDirection(state.initialGrowthDirection) +
            '</div>';
          els.sidePanelTitle.textContent = 'Initial Growth Direction';
          els.sidePanelSub.textContent = 'Resumed from approved Blueprint';
        }
        if (state.firstGrowthPlanPreview) {
          setGrowthPreviewActionsVisible(true);
          addBubble('meta', 'First Growth Plan Preview is ready — use the actions below.');
        } else if (!growthTurns.length) {
          addBubble(
            'assistant',
            'Continuing from your approved Blueprint. Start or resume the Growth Conversation whenever you are ready.'
          );
        }
        els.sessionStatus.textContent = 'GROWTH · resumed from approved Blueprint';
        els.messageInput.placeholder = 'Talk with Max about the first growth focus…';
        return;
      }

      // Default: Initial Growth Direction after approval.
      applyApprovedState(
        {
          blueprint: state.blueprint,
          initialGrowthDirection: state.initialGrowthDirection,
          playbook: data.playbook || null,
        },
        { alreadyApproved: true }
      );
      addBubble(
        'assistant',
        'Welcome back.\n\nYour Business Blueprint is still approved. Review the Initial Growth Direction, then continue into the Growth Conversation — no need to re-answer the interview.'
      );
      if (els.growthBtn) els.growthBtn.textContent = 'Continue Growth Work';
      els.sessionStatus.textContent =
        'APPROVED · ' + (data.businessName || 'Blueprint') + ' ready for growth work';
    }

    async function resumeSession(sessionId, action) {
      const data = await api(
        'GET',
        '/api/v1/client-intel/sessions/' +
          encodeURIComponent(sessionId) +
          '/resume?action=' +
          encodeURIComponent(action || 'continue')
      );
      applyResumeState(data, action || 'continue');

      // If continuing with no growth conversation yet, open Initial Growth Direction
      // and leave Start/Continue Growth Work CTA available (complete phase).
      if (
        (action || 'continue') === 'continue' &&
        data.resumeTarget === 'initial_growth_direction'
      ) {
        // Already on complete via applyResumeState.
      } else if (
        (action || 'continue') === 'continue' &&
        data.resumeTarget === 'growth_conversation' &&
        !(data.growthConversation && data.growthConversation.turns && data.growthConversation.turns.length)
      ) {
        await startGrowthConversation();
      }
    }

    function showWelcome() {
      setPhase('welcome');
      els.chatLog.innerHTML = '';
      state.stickToBottom = true;
      state.interviewId = null;
      state.sessionStatus = null;
      state.blueprint = null;
      state.growthConversationActive = false;
      state.readinessConversationActive = false;
      state.firstGrowthPlanPreview = null;
      state.growthInfrastructureReadinessReport = null;
      state.isSample = false;
      if (els.growthBtn) els.growthBtn.textContent = 'Start Growth Conversation';
      addBubble(
        'assistant',
        "Welcome.\n\nBefore Pulseforge recommends anything, I'd like to understand how your business works.\n\nThe better I understand your business, the better every future recommendation will become.\n\nIf you already approved a Blueprint, continue from a saved session below — you will not re-answer the interview."
      );
      els.sidePanel.innerHTML = '<p class="blueprint-empty">When you\'re ready, begin the conversation or resume an approved Blueprint.</p>';
      els.sessionStatus.textContent = 'Welcome';
      renderProgress(null);
      loadSavedSessions();
    }

    function startNewInterviewFlow() {
      showWelcome();
      els.clientId.focus();
      addBubble('meta', 'Start a new interview when ready — existing approved Blueprints stay saved.');
    }

    els.startBtn.addEventListener('click', async () => {
      try {
        const clientId = els.clientId.value.trim() || '1';
        els.chatLog.innerHTML = '';
        state.stickToBottom = true;
        if (els.savedSessions) els.savedSessions.hidden = true;
        setPhase('discovery');
        const data = await api('POST', '/api/v1/clients/' + encodeURIComponent(clientId) + '/interview/start', {});
        applyDiscoveryPayload(data);
        setComposerEnabled(true);
      } catch (err) {
        showError(err.message);
        showWelcome();
      }
    });

    els.notesBtn.addEventListener('click', async () => {
      try {
        const notes = prompt('Paste business notes:');
        if (!notes) return;
        const clientId = els.clientId.value.trim() || '1';
        els.chatLog.innerHTML = '';
        state.stickToBottom = true;
        addBubble('client', notes);
        const data = await api('POST', '/api/v1/clients/' + encodeURIComponent(clientId) + '/interview/start', { notes });
        await enterUnderstandingFlow(data);
      } catch (err) {
        showError(err.message);
      }
    });

    async function sendMessage() {
      try {
        const text = els.messageInput.value.trim();
        if (!text || !state.interviewId) return;
        addBubble('client', text);
        els.messageInput.value = '';
        els.sendBtn.disabled = true;

        if (state.phase === 'readiness' || state.readinessConversationActive) {
          const data = await api(
            'POST',
            '/api/v1/interview/' + encodeURIComponent(state.interviewId) + '/readiness/message',
            { message: text }
          );
          if (data && data.growthInfrastructureReadinessReport) {
            state.growthInfrastructureReadinessReport = data.growthInfrastructureReadinessReport;
            els.sidePanel.innerHTML = renderReadinessReport(data.growthInfrastructureReadinessReport);
            els.sidePanelTitle.textContent = 'Growth Infrastructure Readiness Report';
            els.sidePanelSub.textContent = 'Assessment only — setup sequence before campaigns';
          }
          if (data && data.message) addBubble('assistant', data.message);
          setComposerEnabled(true);
          return;
        }

        if (state.phase === 'growth' || state.growthConversationActive) {
          const data = await api(
            'POST',
            '/api/v1/interview/' + encodeURIComponent(state.interviewId) + '/growth/message',
            { message: text }
          );
          if (data && data.initialGrowthDirection) {
            state.initialGrowthDirection = data.initialGrowthDirection;
          }
          if (data && data.firstGrowthPlanPreview) {
            state.firstGrowthPlanPreview = data.firstGrowthPlanPreview;
            setGrowthPreviewActionsVisible(true);
          } else if (data && data.suggestedActions && data.suggestedActions.length) {
            setGrowthPreviewActionsVisible(true);
          }
          if (data && data.message) addBubble('assistant', data.message);
          setComposerEnabled(true);
          return;
        }

        const pending = api('POST', '/api/v1/interview/' + encodeURIComponent(state.interviewId) + '/message', {
          message: text,
        });
        const data = await pending;
        if (data.blueprint || data.nextAction === 'GENERATE_BLUEPRINT' || data.nextAction === 'COMPLETE') {
          if (data.reflection) addBubble('reflection', data.reflection);
          await enterUnderstandingFlow(data);
          return;
        }
        applyDiscoveryPayload(data);
        setComposerEnabled(true);
      } catch (err) {
        showError(err.message);
        setComposerEnabled(
          state.phase === 'discovery' ||
            state.phase === 'growth' ||
            state.phase === 'readiness'
        );
      }
    }

    async function startGrowthConversation() {
      try {
        if (!state.interviewId) return;
        els.growthBtn.disabled = true;
        if (els.readinessBtn) els.readinessBtn.disabled = true;
        state.readinessConversationActive = false;
        const data = await api(
          'POST',
          '/api/v1/interview/' + encodeURIComponent(state.interviewId) + '/growth/start',
          {}
        );
        if (data && data.initialGrowthDirection) {
          state.initialGrowthDirection = data.initialGrowthDirection;
        }
        if (data && data.blueprint) state.blueprint = data.blueprint;
        state.growthConversationActive = true;
        setPhase('growth');
        if (data && data.message) {
          if (!data.resumed) addBubble('meta', 'Growth Conversation started');
          addBubble('assistant', data.message);
        }
        els.sessionStatus.textContent = 'GROWTH · using approved Blueprint';
        els.messageInput.placeholder = 'Talk with Max about the first growth focus…';
        els.messageInput.focus();
      } catch (err) {
        showError(err.message);
        els.growthBtn.disabled = false;
        if (els.readinessBtn) els.readinessBtn.disabled = false;
      }
    }

    async function startInfrastructureReadiness() {
      try {
        if (!state.interviewId) return;
        if (els.readinessBtn) els.readinessBtn.disabled = true;
        if (els.growthBtn) els.growthBtn.disabled = true;
        if (els.checkInfraFromGrowthBtn) els.checkInfraFromGrowthBtn.disabled = true;
        state.growthConversationActive = false;
        setGrowthPreviewActionsVisible(false);
        const data = await api(
          'POST',
          '/api/v1/interview/' + encodeURIComponent(state.interviewId) + '/readiness/start',
          {}
        );
        if (data && data.blueprint) state.blueprint = data.blueprint;
        if (data && data.growthInfrastructureReadinessReport) {
          state.growthInfrastructureReadinessReport = data.growthInfrastructureReadinessReport;
          els.sidePanel.innerHTML = renderReadinessReport(data.growthInfrastructureReadinessReport);
        }
        state.readinessConversationActive = true;
        setPhase('readiness');
        if (data && data.message) {
          if (!data.resumed) {
            addBubble(
              'meta',
              data.growthHandoff && data.growthHandoff.primarySegment
                ? 'Growth Infrastructure Readiness · from First Growth Plan'
                : 'Growth Infrastructure Readiness started'
            );
          }
          addBubble('assistant', data.message);
        }
        els.sessionStatus.textContent = 'READINESS · capture & convert setup';
        els.messageInput.placeholder = 'Tell Max about website, GBP, leads, tracking, assets…';
        els.messageInput.focus();
      } catch (err) {
        showError(err.message);
        if (els.readinessBtn) els.readinessBtn.disabled = false;
        if (els.growthBtn) els.growthBtn.disabled = false;
        if (els.checkInfraFromGrowthBtn) els.checkInfraFromGrowthBtn.disabled = false;
        if (state.firstGrowthPlanPreview) setGrowthPreviewActionsVisible(true);
      }
    }

    async function sendGrowthCtaMessage(text) {
      if (!state.interviewId || !text) return;
      addBubble('client', text);
      setComposerEnabled(false);
      try {
        const data = await api(
          'POST',
          '/api/v1/interview/' + encodeURIComponent(state.interviewId) + '/growth/message',
          { message: text }
        );
        if (data && data.firstGrowthPlanPreview) {
          state.firstGrowthPlanPreview = data.firstGrowthPlanPreview;
        }
        if (data && data.message) addBubble('assistant', data.message);
        if (data && data.suggestedActions && data.suggestedActions.length) {
          setGrowthPreviewActionsVisible(true);
        }
        setComposerEnabled(true);
      } catch (err) {
        showError(err.message);
        setComposerEnabled(true);
      }
    }

    els.sendBtn.addEventListener('click', sendMessage);
    els.messageInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    els.accurateBtn.addEventListener('click', () => {
      setPhase('blueprint');
      addBubble(
        'assistant',
        "Here's your Business Blueprint — the living record of what I understand about your business. Edit anything that needs sharpening, then approve when it feels right."
      );
      renderBlueprint(state.blueprint, { editable: true });
      els.sessionStatus.textContent =
        'Session ' + state.interviewId + ' · Business Blueprint';
    });

    async function resumeConversation() {
      try {
        const data = await api('POST', '/api/v1/interview/' + encodeURIComponent(state.interviewId) + '/resume', {});
        setPhase('discovery');
        applyDiscoveryPayload(data);
        setComposerEnabled(true);
      } catch (err) {
        showError(err.message);
      }
    }

    els.refineBtn.addEventListener('click', resumeConversation);
    els.keepTalkingBtn.addEventListener('click', resumeConversation);

    els.reviseBtn.addEventListener('click', async () => {
      try {
        if (!state.blueprint) return;
        const sections = {};
        els.sidePanel.querySelectorAll('textarea[data-key]').forEach((ta) => {
          sections[ta.getAttribute('data-key')] = { summary: ta.value };
        });
        const bp = await api('POST', '/api/v1/blueprint/' + encodeURIComponent(state.blueprint.id) + '/revise', {
          sections,
        });
        renderBlueprint(bp, { editable: true });
      } catch (err) {
        showError(err.message);
      }
    });

    els.approveBtn.addEventListener('click', async () => {
      try {
        if (!state.blueprint) return;

        // Already approved — friendly idempotent UI, never call approve again.
        if (
          state.sessionStatus === 'APPROVED' ||
          state.blueprint.status === 'approved' ||
          state.phase === 'complete'
        ) {
          applyApprovedState(state.pendingCompletion || { blueprint: state.blueprint }, {
            alreadyApproved: true,
          });
          return;
        }

        if (state.approveInFlight || state.phase === 'playbook_prep') return;

        state.approveInFlight = true;
        els.approveBtn.disabled = true;
        els.reviseBtn.disabled = true;
        els.approveBtn.textContent = 'Approving…';
        els.blueprintActions.hidden = true;
        setPhase('playbook_prep');
        addBubble('meta', 'Preparing your Client Playbook…');

        const pending = api(
          'POST',
          '/api/v1/blueprint/' + encodeURIComponent(state.blueprint.id) + '/approve',
          {}
        );
        const result = await runChecklist(PLAYBOOK_STEPS, 2500, pending);

        // Refresh session/artifacts after approval so local status matches server.
        let fresh = null;
        if (state.interviewId) {
          try {
            fresh = await api('GET', '/api/v1/interview/' + encodeURIComponent(state.interviewId));
          } catch (_) {
            fresh = null;
          }
        }
        if (fresh && fresh.status) state.sessionStatus = fresh.status;
        if (fresh && fresh.blueprint) {
          state.blueprint = fresh.blueprint;
        } else if (result && result.blueprint) {
          state.blueprint = result.blueprint;
        }

        const already =
          !!(result && (result.alreadyApproved || result.message === 'already_approved'));
        if (result && result.initialGrowthDirection) {
          state.initialGrowthDirection = result.initialGrowthDirection;
        } else if (fresh && fresh.initialGrowthDirection) {
          state.initialGrowthDirection = fresh.initialGrowthDirection;
        }
        applyApprovedState(
          {
            ...(result || {}),
            blueprint: state.blueprint || (result && result.blueprint),
            playbook: (result && result.playbook) || null,
            initialGrowthDirection:
              state.initialGrowthDirection ||
              (result && result.initialGrowthDirection) ||
              null,
          },
          { alreadyApproved: already }
        );
        if (!already) {
          const focusLine =
            state.initialGrowthDirection && state.initialGrowthDirection.firstFocus
              ? '\n\nBased on this Blueprint, a sensible first growth focus is ' +
                state.initialGrowthDirection.firstFocus +
                '.'
              : '';
          addBubble(
            'assistant',
            'Excellent.\n\nI now understand your business well enough to begin helping it grow.\n\nEvery recommendation Pulseforge makes will build on this understanding.' +
              focusLine +
              '\n\nReview the Initial Growth Direction, then start the Growth Conversation when you are ready.'
          );
        }
      } catch (err) {
        const msg = String((err && err.message) || '');
        if (/already_approved|was APPROVED|already approved/i.test(msg)) {
          applyApprovedState(state.pendingCompletion || { blueprint: state.blueprint }, {
            alreadyApproved: true,
          });
          return;
        }
        state.approveInFlight = false;
        showError(msg);
        setPhase('blueprint');
        if (state.blueprint) {
          renderBlueprint(state.blueprint, { editable: true });
        }
      }
    });

    els.growthBtn.addEventListener('click', startGrowthConversation);
    els.readinessBtn.addEventListener('click', startInfrastructureReadiness);
    els.dashboardBtn.addEventListener('click', () => {
      window.location.href = '/dashboard';
    });
    if (els.useFocusBtn) {
      els.useFocusBtn.addEventListener('click', () =>
        sendGrowthCtaMessage('Use this focus')
      );
    }
    if (els.refineSegmentBtn) {
      els.refineSegmentBtn.addEventListener('click', () =>
        sendGrowthCtaMessage('Refine first segment')
      );
    }
    if (els.checkInfraFromGrowthBtn) {
      els.checkInfraFromGrowthBtn.addEventListener(
        'click',
        startInfrastructureReadiness
      );
    }
    if (els.growthDashboardBtn) {
      els.growthDashboardBtn.addEventListener('click', () => {
        window.location.href = '/dashboard';
      });
    }

    if (els.savedSessions) {
      els.savedSessions.addEventListener('click', async (event) => {
        const btn = event.target && event.target.closest('button[data-action]');
        if (!btn) return;
        const action = btn.getAttribute('data-action');
        if (action === 'new') {
          startNewInterviewFlow();
          return;
        }
        const sessionId = btn.getAttribute('data-session-id');
        if (!sessionId) return;
        try {
          btn.disabled = true;
          await resumeSession(sessionId, action);
        } catch (err) {
          showError(err.message);
          showWelcome();
        } finally {
          btn.disabled = false;
        }
      });
    }

    if (els.newInterviewBtn) {
      els.newInterviewBtn.addEventListener('click', startNewInterviewFlow);
    }

    if (els.loadAnchorFixtureBtn) {
      els.loadAnchorFixtureBtn.addEventListener('click', async () => {
        try {
          els.loadAnchorFixtureBtn.disabled = true;
          const data = await api(
            'POST',
            '/api/v1/client-intel/fixtures/anchor-blueprint',
            {}
          );
          applyResumeState(data, 'continue');
          await loadSavedSessions();
        } catch (err) {
          showError(err.message);
        } finally {
          els.loadAnchorFixtureBtn.disabled = false;
        }
      });
    }

    async function bootFromQuery() {
      const params = new URLSearchParams(window.location.search || '');
      const interviewId = params.get('interviewId') || params.get('sessionId');
      const action = params.get('action') || 'continue';
      const clientId = params.get('clientId');
      if (clientId && els.clientId) els.clientId.value = clientId;

      if (action === 'new' && !interviewId) {
        showWelcome();
        addBubble('meta', 'Start a new interview when ready — existing approved Blueprints stay saved.');
        return;
      }

      if (interviewId) {
        try {
          await resumeSession(interviewId, action);
          return;
        } catch (err) {
          showError(err.message);
        }
      }
      showWelcome();
    }

    bootFromQuery();
  </script>
</body>
</html>
