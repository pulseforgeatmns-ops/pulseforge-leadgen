<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pulseforge — Client Intelligence</title>
  <link rel="icon" href="/favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/shared/tokens.css">
  <style>
    :root {
      --cie-bg: #0c1016;
      --cie-panel: #141b24;
      --cie-panel-elevated: #1a2330;
      --cie-border: #2a3544;
      --cie-border-soft: rgba(42, 53, 68, 0.65);
      --cie-text: #e8eef5;
      --cie-muted: #8b9bb0;
      --cie-accent: #3d9cfd;
      --cie-accent-soft: rgba(61, 156, 253, 0.14);
      --cie-ok: #3ecf8e;
      --cie-warn: #e6b84d;
      --cie-assistant: #1e2836;
      --cie-client: #1a3348;
      --cie-header-h: 3.5rem;
    }
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
    }
    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background:
        radial-gradient(900px 480px at 8% -8%, rgba(42, 72, 110, 0.35), transparent 60%),
        radial-gradient(700px 400px at 92% 0%, rgba(30, 58, 90, 0.22), transparent 55%),
        var(--cie-bg);
      color: var(--cie-text);
      display: flex;
      flex-direction: column;
    }
    header {
      flex: 0 0 auto;
      height: var(--cie-header-h);
      padding: 0 1.5rem;
      border-bottom: 1px solid var(--cie-border);
      display: flex;
      gap: 1rem;
      align-items: center;
      flex-wrap: nowrap;
    }
    header h1 {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }
    header p {
      margin: 0;
      color: var(--cie-muted);
      font-size: 0.85rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .workspace {
      flex: 1 1 auto;
      min-height: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      padding: 1rem 1.5rem 1.25rem;
      max-width: 1280px;
      width: 100%;
      margin: 0 auto;
      height: calc(100vh - var(--cie-header-h));
      max-height: calc(100vh - var(--cie-header-h));
    }
    @media (max-width: 900px) {
      html, body { overflow: auto; height: auto; }
      body { display: block; }
      .workspace {
        grid-template-columns: 1fr;
        height: auto;
        max-height: none;
        min-height: calc(100vh - var(--cie-header-h));
      }
      .panel { min-height: 70vh; max-height: 80vh; }
    }
    .panel {
      background: var(--cie-panel);
      border: 1px solid var(--cie-border);
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      min-height: 0;
      height: 100%;
      overflow: hidden;
    }
    .panel-head {
      flex: 0 0 auto;
      padding: 0.85rem 1.1rem 0.75rem;
      border-bottom: 1px solid var(--cie-border);
    }
    .panel-head h2 {
      margin: 0;
      font-size: 0.92rem;
      font-weight: 600;
      letter-spacing: 0.01em;
    }
    .progress-block {
      margin-top: 0.7rem;
    }
    .progress-label {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 0.75rem;
      margin-bottom: 0.35rem;
      font-size: 0.78rem;
      color: var(--cie-muted);
    }
    .progress-label strong {
      color: var(--cie-text);
      font-weight: 500;
    }
    .progress-pct {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      color: var(--cie-accent);
    }
    .progress-track {
      height: 0.4rem;
      border-radius: 999px;
      background: #0f1419;
      border: 1px solid var(--cie-border-soft);
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      border-radius: inherit;
      background: linear-gradient(90deg, #2f7fd6, var(--cie-accent));
      transition: width 280ms ease;
    }
    .controls {
      flex: 0 0 auto;
      display: flex;
      gap: 0.5rem;
      padding: 0.7rem 1.1rem;
      border-bottom: 1px solid var(--cie-border);
      flex-wrap: wrap;
      align-items: center;
    }
    input, textarea, button { font: inherit; }
    input, textarea {
      background: #0f1419;
      border: 1px solid var(--cie-border);
      color: var(--cie-text);
      border-radius: 10px;
      padding: 0.55rem 0.7rem;
    }
    input { width: 6.5rem; }
    button {
      background: var(--cie-accent);
      color: #041018;
      border: none;
      border-radius: 10px;
      padding: 0.55rem 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }
    button.secondary {
      background: transparent;
      color: var(--cie-text);
      border: 1px solid var(--cie-border);
    }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    #chatLog {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 1.15rem 1.2rem 1.4rem;
      display: flex;
      flex-direction: column;
      gap: 0.95rem;
      scroll-behavior: smooth;
    }
    .bubble {
      max-width: 86%;
      padding: 0.85rem 1rem;
      border-radius: 16px;
      font-size: 0.95rem;
      line-height: 1.55;
      letter-spacing: 0.005em;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .bubble.assistant {
      align-self: flex-start;
      background: var(--cie-assistant);
      border: 1px solid var(--cie-border-soft);
      border-bottom-left-radius: 6px;
    }
    .bubble.client {
      align-self: flex-end;
      background: var(--cie-client);
      border: 1px solid rgba(61, 156, 253, 0.22);
      border-bottom-right-radius: 6px;
    }
    .bubble.reflection {
      align-self: flex-start;
      background: var(--cie-accent-soft);
      border: 1px solid rgba(61, 156, 253, 0.28);
      color: #d7e8fb;
      font-style: italic;
      border-bottom-left-radius: 6px;
    }
    .bubble.meta {
      align-self: center;
      color: var(--cie-muted);
      font-size: 0.8rem;
      background: transparent;
      border: none;
      padding: 0.35rem 0.5rem;
      max-width: 100%;
    }
    .composer {
      flex: 0 0 auto;
      display: flex;
      gap: 0.6rem;
      padding: 0.85rem 1.1rem;
      border-top: 1px solid var(--cie-border);
      background: var(--cie-panel-elevated);
    }
    .composer textarea {
      flex: 1;
      min-height: 3.4rem;
      max-height: 7rem;
      resize: none;
      line-height: 1.45;
    }
    #blueprintPanel {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 1rem 1.1rem 1.25rem;
    }
    .blueprint-empty {
      color: var(--cie-muted);
      font-size: 0.9rem;
      line-height: 1.5;
      margin: 0.5rem 0;
    }
    .section {
      padding: 1rem 0 1.15rem;
      border-bottom: 1px solid var(--cie-border-soft);
    }
    .section:last-child { border-bottom: none; }
    .section-title {
      margin: 0 0 0.55rem;
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: var(--cie-muted);
    }
    .section-summary {
      margin: 0 0 0.75rem;
      font-size: 0.92rem;
      line-height: 1.55;
      color: var(--cie-text);
    }
    .section-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.65rem 1rem;
      align-items: center;
      margin-bottom: 0.55rem;
    }
    .conf {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      color: var(--cie-ok);
    }
    .conf.low { color: var(--cie-warn); }
    .evidence-count {
      color: var(--cie-muted);
      font-size: 0.78rem;
    }
    .unknowns {
      color: var(--cie-warn);
      font-size: 0.8rem;
      line-height: 1.4;
      margin: 0 0 0.55rem;
      padding: 0.55rem 0.7rem;
      border-radius: 8px;
      background: rgba(230, 184, 77, 0.08);
      border: 1px solid rgba(230, 184, 77, 0.22);
    }
    .section textarea {
      width: 100%;
      min-height: 4.2rem;
      margin-top: 0.15rem;
      line-height: 1.5;
      resize: vertical;
    }
    .status-bar {
      flex: 0 0 auto;
      padding: 0.55rem 1.1rem;
      font-size: 0.78rem;
      color: var(--cie-muted);
      border-top: 1px solid var(--cie-border);
    }
    .actions {
      flex: 0 0 auto;
      display: flex;
      gap: 0.5rem;
      padding: 0.75rem 1.1rem;
      border-top: 1px solid var(--cie-border);
      background: var(--cie-panel-elevated);
    }
    .error {
      position: fixed;
      left: 1.5rem;
      right: 1.5rem;
      bottom: 1rem;
      z-index: 20;
      color: #ffb4b4;
      background: rgba(40, 16, 16, 0.92);
      border: 1px solid rgba(255, 123, 123, 0.35);
      border-radius: 10px;
      padding: 0.65rem 0.9rem;
      font-size: 0.85rem;
      max-width: 1280px;
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <header>
    <h1>Client Intelligence</h1>
    <p>Interview → Business Blueprint → pending_review Playbook</p>
  </header>

  <div class="workspace">
    <section class="panel" aria-label="Interview chat">
      <div class="panel-head">
        <h2>Interview</h2>
        <div class="progress-block" id="progressBlock" hidden>
          <div class="progress-label">
            <strong id="progressLabel">Business Understanding</strong>
            <span class="progress-pct" id="progressPct">0%</span>
          </div>
          <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progressTrack">
            <div class="progress-fill" id="progressFill"></div>
          </div>
        </div>
      </div>
      <div class="controls">
        <label>Client ID <input id="clientId" value="1" inputmode="numeric"></label>
        <button type="button" id="startBtn">Start interview</button>
        <button type="button" id="notesBtn" class="secondary">Start from notes</button>
      </div>
      <div id="chatLog" aria-live="polite"></div>
      <div class="composer">
        <textarea id="messageInput" placeholder="Share your answer…" rows="2"></textarea>
        <button type="button" id="sendBtn" disabled>Send</button>
      </div>
      <div class="status-bar" id="sessionStatus">No active session</div>
    </section>

    <section class="panel" aria-label="Business Blueprint">
      <div class="panel-head">
        <h2>Business Blueprint</h2>
      </div>
      <div id="blueprintPanel"><p class="blueprint-empty">Blueprint appears as understanding takes shape.</p></div>
      <div class="actions">
        <button type="button" id="reviseBtn" class="secondary" disabled>Save edits</button>
        <button type="button" id="approveBtn" disabled>Approve → Playbook</button>
      </div>
      <div class="status-bar" id="blueprintStatus"></div>
    </section>
  </div>
  <div class="error" id="errorBox" hidden></div>

  <script>
    const SECTION_TITLES = {
      identity: 'Identity',
      services: 'Services',
      idealCustomers: 'Ideal Customers',
      avoidCustomers: 'Customers to Avoid',
      targetMarkets: 'Target Markets',
      competitiveAdvantages: 'Competitive Advantages',
      brandVoice: 'Brand Voice',
      campaignGoals: 'Campaign Goals',
      successMetrics: 'Success Metrics',
    };

    const state = {
      interviewId: null,
      blueprint: null,
      stickToBottom: true,
    };

    const els = {
      clientId: document.getElementById('clientId'),
      chatLog: document.getElementById('chatLog'),
      messageInput: document.getElementById('messageInput'),
      sendBtn: document.getElementById('sendBtn'),
      startBtn: document.getElementById('startBtn'),
      notesBtn: document.getElementById('notesBtn'),
      sessionStatus: document.getElementById('sessionStatus'),
      blueprintPanel: document.getElementById('blueprintPanel'),
      reviseBtn: document.getElementById('reviseBtn'),
      approveBtn: document.getElementById('approveBtn'),
      blueprintStatus: document.getElementById('blueprintStatus'),
      errorBox: document.getElementById('errorBox'),
      progressBlock: document.getElementById('progressBlock'),
      progressLabel: document.getElementById('progressLabel'),
      progressPct: document.getElementById('progressPct'),
      progressFill: document.getElementById('progressFill'),
      progressTrack: document.getElementById('progressTrack'),
    };

    function showError(err) {
      els.errorBox.hidden = !err;
      els.errorBox.textContent = err || '';
    }

    function isNearBottom(el, threshold) {
      return el.scrollHeight - el.scrollTop - el.clientHeight <= (threshold || 80);
    }

    function maybeScrollChat() {
      if (state.stickToBottom) {
        els.chatLog.scrollTop = els.chatLog.scrollHeight;
      }
    }

    els.chatLog.addEventListener('scroll', () => {
      state.stickToBottom = isNearBottom(els.chatLog);
    });

    function addBubble(role, text) {
      const div = document.createElement('div');
      div.className = 'bubble ' + role;
      div.textContent = text;
      els.chatLog.appendChild(div);
      maybeScrollChat();
    }

    function renderProgress(progress) {
      if (!progress) {
        els.progressBlock.hidden = true;
        return;
      }
      const pct = Math.max(0, Math.min(100, Number(progress.percent) || 0));
      els.progressBlock.hidden = false;
      els.progressLabel.textContent = progress.label || 'Business Understanding';
      els.progressPct.textContent = pct + '%';
      els.progressFill.style.width = pct + '%';
      els.progressTrack.setAttribute('aria-valuenow', String(pct));
    }

    async function api(method, url, body) {
      showError('');
      const res = await fetch(url, {
        method,
        headers: {
          Accept: 'application/json',
          ...(body == null ? {} : { 'Content-Type': 'application/json' }),
        },
        body: body == null ? undefined : JSON.stringify(body),
        credentials: 'same-origin',
      });
      const text = await res.text();
      let json = null;
      try { json = text ? JSON.parse(text) : null; } catch (_) {}
      if (!res.ok) {
        const msg = (json && (json.message || json.error)) || text || res.statusText;
        throw new Error(msg);
      }
      return json;
    }

    function confClass(n) {
      return Number(n) < 0.6 ? 'conf low' : 'conf';
    }

    function escapeHtml(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function renderBlueprint(bp) {
      state.blueprint = bp;
      if (!bp) {
        els.blueprintPanel.innerHTML = '<p class="blueprint-empty">No blueprint yet.</p>';
        els.reviseBtn.disabled = true;
        els.approveBtn.disabled = true;
        return;
      }
      const sections = bp.sections || {};
      const order = Object.keys(SECTION_TITLES);
      const keys = order.filter((k) => sections[k]).concat(
        Object.keys(sections).filter((k) => !SECTION_TITLES[k])
      );
      const html = keys.map((key) => {
        const s = sections[key] || {};
        const conf = Number(s.confidence || 0);
        const unknowns = (s.unknowns || []).filter(Boolean);
        const count = (s.evidenceIds || []).length;
        const title = SECTION_TITLES[key] || key;
        const summary = s.summary || '';
        return (
          '<article class="section" data-section="' + escapeHtml(key) + '">' +
            '<h3 class="section-title">' + escapeHtml(title) + '</h3>' +
            (summary
              ? '<p class="section-summary">' + escapeHtml(summary) + '</p>'
              : '<p class="section-summary blueprint-empty">No summary yet.</p>') +
            '<div class="section-meta">' +
              '<span class="' + confClass(conf) + '">Confidence ' + Math.round(conf * 100) + '%</span>' +
              '<span class="evidence-count">Evidence ' + count + '</span>' +
            '</div>' +
            (unknowns.length
              ? '<div class="unknowns">Unknowns: ' + escapeHtml(unknowns.join('; ')) + '</div>'
              : '') +
            '<textarea data-key="' + escapeHtml(key) + '">' + escapeHtml(summary) + '</textarea>' +
          '</article>'
        );
      }).join('');
      els.blueprintPanel.innerHTML = html || '<p class="blueprint-empty">No sections yet.</p>';
      const canEdit = bp.status === 'draft' || bp.status === 'in_review';
      els.reviseBtn.disabled = !canEdit;
      els.approveBtn.disabled = bp.status === 'approved';
      els.blueprintStatus.textContent =
        bp.status + ' · v' + bp.version +
        (bp.playbookId ? ' · playbook ' + bp.playbookId + '@' + bp.playbookVersion : '');
    }

    function setSession(data) {
      state.interviewId = data.interviewId || data.id;
      els.sendBtn.disabled = !state.interviewId || data.status === 'CLIENT_REVIEW' || data.status === 'APPROVED';
      els.sessionStatus.textContent =
        'Session ' + state.interviewId + ' · ' + data.status +
        (data.currentStage ? ' · ' + data.currentStage : '');
      renderProgress(data.progress);
      if (data.reflection) {
        addBubble('reflection', data.reflection);
      }
      if (data.message && data.nextAction !== 'COMPLETE' && data.nextAction !== 'GENERATE_BLUEPRINT') {
        addBubble('assistant', data.message);
      }
      if (data.blueprint) renderBlueprint(data.blueprint);
    }

    els.startBtn.addEventListener('click', async () => {
      try {
        els.chatLog.innerHTML = '';
        state.stickToBottom = true;
        const clientId = els.clientId.value.trim() || '1';
        const data = await api('POST', '/api/v1/clients/' + encodeURIComponent(clientId) + '/interview/start', {});
        setSession(data);
      } catch (err) {
        showError(err.message);
      }
    });

    els.notesBtn.addEventListener('click', async () => {
      try {
        const notes = prompt('Paste business notes for Aji-style onboarding:');
        if (!notes) return;
        els.chatLog.innerHTML = '';
        state.stickToBottom = true;
        addBubble('client', notes);
        const clientId = els.clientId.value.trim() || '1';
        const data = await api('POST', '/api/v1/clients/' + encodeURIComponent(clientId) + '/interview/start', { notes });
        setSession(data);
        addBubble('meta', data.message || 'Blueprint ready');
        renderProgress(data.progress);
      } catch (err) {
        showError(err.message);
      }
    });

    async function sendMessage() {
      try {
        const text = els.messageInput.value.trim();
        if (!text || !state.interviewId) return;
        addBubble('client', text);
        els.messageInput.value = '';
        const data = await api('POST', '/api/v1/interview/' + encodeURIComponent(state.interviewId) + '/message', {
          message: text,
        });
        setSession(data);
        if (data.blueprint) addBubble('meta', 'Blueprint ready for review');
      } catch (err) {
        showError(err.message);
      }
    }

    els.sendBtn.addEventListener('click', sendMessage);
    els.messageInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    els.reviseBtn.addEventListener('click', async () => {
      try {
        if (!state.blueprint) return;
        const sections = {};
        els.blueprintPanel.querySelectorAll('textarea[data-key]').forEach((ta) => {
          sections[ta.getAttribute('data-key')] = { summary: ta.value };
        });
        const bp = await api('POST', '/api/v1/blueprint/' + encodeURIComponent(state.blueprint.id) + '/revise', {
          sections,
        });
        renderBlueprint(bp);
      } catch (err) {
        showError(err.message);
      }
    });

    els.approveBtn.addEventListener('click', async () => {
      try {
        if (!state.blueprint) return;
        const result = await api('POST', '/api/v1/blueprint/' + encodeURIComponent(state.blueprint.id) + '/approve', {});
        renderBlueprint(result.blueprint);
        addBubble(
          'meta',
          'Approved. Pending playbook ' +
            (result.playbook && result.playbook.id) +
            '@' +
            (result.playbook && result.playbook.version)
        );
        els.sendBtn.disabled = true;
      } catch (err) {
        showError(err.message);
      }
    });
  </script>
</body>
</html>
