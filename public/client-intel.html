<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pulseforge — Client Intelligence</title>
  <link rel="icon" href="/favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/shared/tokens.css">
  <style>
    :root {
      --cie-bg: #0c1016;
      --cie-panel: #141b24;
      --cie-panel-elevated: #1a2330;
      --cie-border: #2a3544;
      --cie-border-soft: rgba(42, 53, 68, 0.65);
      --cie-text: #e8eef5;
      --cie-muted: #8b9bb0;
      --cie-accent: #3d9cfd;
      --cie-accent-soft: rgba(61, 156, 253, 0.14);
      --cie-ok: #3ecf8e;
      --cie-warn: #e6b84d;
      --cie-bad: #e57373;
      --cie-assistant: #1e2836;
      --cie-client: #1a3348;
      --cie-header-h: 3.5rem;
    }
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
    }
    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background:
        radial-gradient(900px 480px at 8% -8%, rgba(42, 72, 110, 0.35), transparent 60%),
        radial-gradient(700px 400px at 92% 0%, rgba(30, 58, 90, 0.22), transparent 55%),
        var(--cie-bg);
      color: var(--cie-text);
      display: flex;
      flex-direction: column;
    }
    header {
      flex: 0 0 auto;
      height: var(--cie-header-h);
      padding: 0 1.5rem;
      border-bottom: 1px solid var(--cie-border);
      display: flex;
      gap: 1rem;
      align-items: center;
    }
    header h1 {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    header p {
      margin: 0;
      color: var(--cie-muted);
      font-size: 0.85rem;
    }
    .workspace {
      flex: 1 1 auto;
      min-height: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.25rem;
      padding: 1.15rem 1.5rem 1.25rem;
      max-width: 1280px;
      width: 100%;
      margin: 0 auto;
      height: calc(100vh - var(--cie-header-h));
      max-height: calc(100vh - var(--cie-header-h));
    }
    @media (max-width: 900px) {
      html, body { overflow: auto; height: auto; }
      body { display: block; }
      .workspace {
        grid-template-columns: 1fr;
        height: auto;
        max-height: none;
        min-height: calc(100vh - var(--cie-header-h));
      }
      .panel { min-height: 70vh; max-height: 80vh; }
    }
    .panel {
      background: var(--cie-panel);
      border: 1px solid var(--cie-border);
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      min-height: 0;
      height: 100%;
      overflow: hidden;
    }
    .panel-head {
      flex: 0 0 auto;
      padding: 1rem 1.25rem 0.9rem;
      border-bottom: 1px solid var(--cie-border);
    }
    .panel-head h2 {
      margin: 0;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.01em;
    }
    .panel-head .sub {
      margin: 0.35rem 0 0;
      color: var(--cie-muted);
      font-size: 0.8rem;
      line-height: 1.4;
    }
    .progress-block { margin-top: 0.85rem; }
    .progress-label {
      display: flex;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 0.4rem;
      font-size: 0.78rem;
      color: var(--cie-muted);
    }
    .progress-label strong { color: var(--cie-text); font-weight: 500; }
    .progress-pct {
      font-family: 'JetBrains Mono', monospace;
      color: var(--cie-accent);
    }
    .progress-track {
      height: 0.4rem;
      border-radius: 999px;
      background: #0f1419;
      border: 1px solid var(--cie-border-soft);
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      border-radius: inherit;
      background: linear-gradient(90deg, #2f7fd6, var(--cie-accent));
      transition: width 280ms ease;
    }
    .controls {
      flex: 0 0 auto;
      display: flex;
      gap: 0.5rem;
      padding: 0.65rem 1.15rem;
      border-bottom: 1px solid var(--cie-border);
      flex-wrap: wrap;
      align-items: center;
    }
    .controls.soft {
      opacity: 0.72;
      font-size: 0.82rem;
    }
    input, textarea, button { font: inherit; }
    input, textarea {
      background: #0f1419;
      border: 1px solid var(--cie-border);
      color: var(--cie-text);
      border-radius: 10px;
      padding: 0.55rem 0.7rem;
    }
    input { width: 5.5rem; }
    button {
      background: var(--cie-accent);
      color: #041018;
      border: none;
      border-radius: 10px;
      padding: 0.55rem 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }
    button.secondary {
      background: transparent;
      color: var(--cie-text);
      border: 1px solid var(--cie-border);
    }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    #chatLog {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 1.25rem 1.3rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.05rem;
      scroll-behavior: smooth;
    }
    .bubble {
      max-width: 88%;
      padding: 0.95rem 1.05rem;
      border-radius: 16px;
      font-size: 0.96rem;
      line-height: 1.6;
      letter-spacing: 0.005em;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .bubble.assistant {
      align-self: flex-start;
      background: var(--cie-assistant);
      border: 1px solid var(--cie-border-soft);
      border-bottom-left-radius: 6px;
    }
    .bubble.client {
      align-self: flex-end;
      background: var(--cie-client);
      border: 1px solid rgba(61, 156, 253, 0.22);
      border-bottom-right-radius: 6px;
    }
    .bubble.reflection {
      align-self: flex-start;
      background: var(--cie-accent-soft);
      border: 1px solid rgba(61, 156, 253, 0.28);
      color: #d7e8fb;
      font-style: italic;
      border-bottom-left-radius: 6px;
    }
    .bubble.meta {
      align-self: center;
      color: var(--cie-muted);
      font-size: 0.8rem;
      background: transparent;
      border: none;
      padding: 0.35rem 0.5rem;
      max-width: 100%;
    }
    .bubble.trust {
      align-self: flex-start;
      max-width: 94%;
      background: linear-gradient(160deg, rgba(61, 156, 253, 0.16), rgba(30, 40, 54, 0.9));
      border: 1px solid rgba(61, 156, 253, 0.35);
      font-size: 1.02rem;
      line-height: 1.65;
    }
    .composer {
      flex: 0 0 auto;
      display: flex;
      gap: 0.6rem;
      padding: 0.9rem 1.15rem;
      border-top: 1px solid var(--cie-border);
      background: var(--cie-panel-elevated);
    }
    .composer[hidden], .controls[hidden], .actions[hidden] { display: none !important; }
    .composer textarea {
      flex: 1;
      min-height: 3.4rem;
      max-height: 7rem;
      resize: none;
      line-height: 1.45;
    }
    #sidePanel {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 1.15rem 1.2rem 1.4rem;
    }
    .blueprint-empty {
      color: var(--cie-muted);
      font-size: 0.92rem;
      line-height: 1.55;
      margin: 0.35rem 0;
    }
    .understanding-list {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }
    .understanding-row {
      position: relative;
      padding: 0.85rem 0.95rem;
      border-radius: 12px;
      border: 1px solid var(--cie-border-soft);
      background: rgba(15, 20, 25, 0.55);
    }
    .understanding-row-top {
      display: flex;
      justify-content: space-between;
      gap: 0.75rem;
      align-items: baseline;
    }
    .understanding-title {
      font-size: 0.9rem;
      font-weight: 600;
    }
    .understanding-title.ready::before {
      content: '✓ ';
      color: var(--cie-ok);
    }
    .conf-pct {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.82rem;
    }
    .conf-pct.bad { color: var(--cie-bad); }
    .conf-pct.warn { color: var(--cie-warn); }
    .conf-pct.ok { color: var(--cie-ok); }
    .conf-bar {
      margin-top: 0.55rem;
      height: 0.28rem;
      border-radius: 999px;
      background: #0f1419;
      overflow: hidden;
    }
    .conf-bar > span {
      display: block;
      height: 100%;
      border-radius: inherit;
      transition: width 280ms ease;
    }
    .conf-bar > span.bad { background: var(--cie-bad); }
    .conf-bar > span.warn { background: var(--cie-warn); }
    .conf-bar > span.ok { background: var(--cie-ok); }
    .understanding-status {
      margin-top: 0.45rem;
      font-size: 0.78rem;
      color: var(--cie-muted);
    }
    .conf-tip {
      display: none;
      position: absolute;
      left: 0.75rem;
      right: 0.75rem;
      top: calc(100% - 0.35rem);
      z-index: 5;
      padding: 0.7rem 0.8rem;
      border-radius: 10px;
      background: #0f1620;
      border: 1px solid var(--cie-border);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
      font-size: 0.78rem;
      line-height: 1.45;
      color: var(--cie-text);
    }
    .understanding-row:hover .conf-tip,
    .understanding-row:focus-within .conf-tip {
      display: block;
    }
    .section {
      padding: 1.1rem 0 1.2rem;
      border-bottom: 1px solid var(--cie-border-soft);
    }
    .section:last-child { border-bottom: none; }
    .section-title {
      margin: 0 0 0.55rem;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--cie-muted);
    }
    .section-summary {
      margin: 0 0 0.8rem;
      font-size: 0.94rem;
      line-height: 1.6;
      color: var(--cie-text);
    }
    .section-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.65rem 1rem;
      align-items: center;
      margin-bottom: 0.55rem;
    }
    .evidence-count {
      color: var(--cie-muted);
      font-size: 0.78rem;
    }
    .unknowns {
      color: var(--cie-warn);
      font-size: 0.8rem;
      line-height: 1.45;
      margin: 0 0 0.55rem;
      padding: 0.55rem 0.7rem;
      border-radius: 8px;
      background: rgba(230, 184, 77, 0.08);
      border: 1px solid rgba(230, 184, 77, 0.22);
    }
    .section textarea {
      width: 100%;
      min-height: 4.2rem;
      margin-top: 0.15rem;
      line-height: 1.5;
      resize: vertical;
    }
    .exec-card {
      padding: 0.55rem 0.15rem 1rem;
      animation: briefReveal 640ms ease both;
    }
    @keyframes briefReveal {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .exec-card h3 {
      margin: 0 0 0.4rem;
      font-size: 1.35rem;
      font-weight: 600;
      letter-spacing: 0.015em;
      line-height: 1.25;
    }
    .exec-card .exec-sub {
      margin: 0;
      color: var(--cie-muted);
      font-size: 0.88rem;
      line-height: 1.45;
    }
    .exec-card .exec-tagline {
      margin: 0.2rem 0 1.55rem;
      color: var(--cie-muted);
      font-size: 0.8rem;
      opacity: 0.9;
    }
    .exec-section {
      margin: 0 0 1.55rem;
      padding-bottom: 0.15rem;
    }
    .exec-section h4 {
      margin: 0 0 0.55rem;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--cie-muted);
    }
    .exec-section p {
      margin: 0;
      font-size: 0.98rem;
      line-height: 1.68;
      white-space: pre-wrap;
    }
    .exec-section p + p { margin-top: 0.65rem; }
    .exec-list {
      margin: 0.55rem 0 0;
      padding: 0 0 0 1.1rem;
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
    }
    .exec-list li {
      font-size: 0.95rem;
      line-height: 1.55;
      color: var(--cie-text);
    }
    .assessment-grid {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      margin: 0.35rem 0 0.85rem;
    }
    .assessment-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.35rem 1rem;
      align-items: baseline;
    }
    .assessment-label {
      font-size: 0.95rem;
      font-weight: 500;
    }
    .assessment-stars {
      font-size: 0.95rem;
      letter-spacing: 0.08em;
      color: var(--cie-warn);
      font-variant-emoji: text;
    }
    .assessment-explain {
      grid-column: 1 / -1;
      margin: 0;
      font-size: 0.82rem;
      line-height: 1.45;
      color: var(--cie-muted);
    }
    .assessment-confidence {
      margin-top: 0.35rem;
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .assessment-confidence span {
      color: var(--cie-accent);
      font-family: 'JetBrains Mono', monospace;
    }
    .checklist {
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
      padding: 0.35rem 0;
    }
    .checklist-item {
      display: flex;
      gap: 0.65rem;
      align-items: flex-start;
      color: var(--cie-muted);
      font-size: 0.92rem;
      line-height: 1.45;
      transition: color 220ms ease;
    }
    .checklist-item.done { color: var(--cie-text); }
    .checklist-mark {
      font-family: 'JetBrains Mono', monospace;
      width: 1.1rem;
      color: var(--cie-border);
    }
    .checklist-item.done .checklist-mark { color: var(--cie-ok); }
    .checklist-item.active .checklist-mark { color: var(--cie-accent); }
    .status-bar {
      flex: 0 0 auto;
      padding: 0.55rem 1.15rem;
      font-size: 0.78rem;
      color: var(--cie-muted);
      border-top: 1px solid var(--cie-border);
    }
    .actions {
      flex: 0 0 auto;
      display: flex;
      gap: 0.5rem;
      padding: 0.85rem 1.15rem;
      border-top: 1px solid var(--cie-border);
      background: var(--cie-panel-elevated);
      flex-wrap: wrap;
    }
    .completion-card h3 {
      margin: 0 0 0.75rem;
      font-size: 1.2rem;
    }
    .completion-card p {
      margin: 0 0 0.85rem;
      line-height: 1.6;
      font-size: 0.95rem;
    }
    .completion-checks {
      list-style: none;
      padding: 0;
      margin: 0 0 1.15rem;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }
    .completion-checks li {
      font-size: 0.92rem;
      color: var(--cie-text);
    }
    .completion-checks li::before {
      content: '✓ ';
      color: var(--cie-ok);
    }
    .growth-direction {
      margin-top: 1.35rem;
      padding-top: 1.15rem;
      border-top: 1px solid var(--cie-border-soft);
      animation: briefReveal 640ms ease both;
    }
    .growth-direction .growth-kicker {
      margin: 0 0 0.45rem;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--cie-accent);
    }
    .growth-direction h4 {
      margin: 0 0 0.85rem;
      font-size: 1.08rem;
      font-weight: 600;
      line-height: 1.35;
    }
    .growth-direction p {
      margin: 0 0 0.75rem;
      line-height: 1.6;
      font-size: 0.94rem;
    }
    .growth-direction .growth-disclaimer {
      margin: 0.9rem 0 0;
      padding: 0.65rem 0.75rem;
      border-radius: 8px;
      background: rgba(230, 184, 77, 0.08);
      border: 1px solid rgba(230, 184, 77, 0.22);
      color: var(--cie-warn);
      font-size: 0.8rem;
      line-height: 1.45;
    }
    .scout-handoff-status {
      display: inline-block;
      margin: 0.15rem 0 0.85rem;
      padding: 0.28rem 0.55rem;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 6px;
      font-size: 0.78rem;
      letter-spacing: 0.02em;
      background: rgba(255, 255, 255, 0.05);
    }
    .scout-handoff-status.is-unavailable {
      border-color: rgba(230, 184, 77, 0.45);
      background: rgba(230, 184, 77, 0.12);
      color: var(--cie-warn);
    }
    .scout-handoff-status.is-ready {
      border-color: rgba(110, 231, 183, 0.4);
      background: rgba(110, 231, 183, 0.12);
      color: #bbf7d0;
    }
    .scout-handoff-meta {
      font-size: 0.78rem;
      opacity: 0.8;
      margin-bottom: 0.75rem;
    }
    .scout-candidate-row {
      margin: 0.35rem 0;
    }
    .scout-candidate-row a {
      color: inherit;
      text-decoration: underline;
    }
    .error {
      position: fixed;
      left: 1.5rem;
      right: 1.5rem;
      bottom: 1rem;
      z-index: 20;
      color: #ffb4b4;
      background: rgba(40, 16, 16, 0.92);
      border: 1px solid rgba(255, 123, 123, 0.35);
      border-radius: 10px;
      padding: 0.65rem 0.9rem;
      font-size: 0.85rem;
      max-width: 1280px;
      margin: 0 auto;
    }
    .fade-out {
      opacity: 0;
      transition: opacity 480ms ease;
    }
    .session-list {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      margin-top: 0.85rem;
    }
    .session-card {
      border: 1px solid var(--cie-border);
      border-radius: 12px;
      background: var(--cie-panel-elevated);
      padding: 0.85rem 0.95rem;
      text-align: left;
    }
    .session-card.sample {
      border-color: rgba(230, 184, 77, 0.45);
      background: rgba(230, 184, 77, 0.08);
    }
    .session-card-title {
      margin: 0;
      font-size: 0.92rem;
      font-weight: 600;
    }
    .session-card-meta {
      margin: 0.3rem 0 0.7rem;
      color: var(--cie-muted);
      font-size: 0.78rem;
      line-height: 1.4;
    }
    .session-card-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }
    .session-card-actions button {
      font-size: 0.78rem;
      padding: 0.4rem 0.7rem;
    }
    .sample-badge {
      display: inline-block;
      margin-left: 0.4rem;
      padding: 0.1rem 0.4rem;
      border-radius: 4px;
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #1a1408;
      background: var(--cie-warn);
    }
    .fixture-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
      margin-top: 0.75rem;
    }
    .workspace-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin-top: 0.75rem;
    }
    .workspace-tabs button {
      background: transparent;
      color: var(--cie-muted);
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 0.35rem 0.65rem;
      font-size: 0.78rem;
      font-weight: 500;
    }
    .workspace-tabs button.active {
      color: var(--cie-text);
      border-color: var(--cie-border);
      background: var(--cie-accent-soft);
    }
    .current-task-card {
      position: static;
      height: auto;
      max-height: none;
      overflow: visible;
      border: 1px solid var(--cie-border);
      border-radius: 14px;
      background: linear-gradient(180deg, rgba(61, 156, 253, 0.08), transparent 70%),
        var(--cie-panel-elevated);
      padding: 1.1rem 1.15rem 1.15rem;
      margin-bottom: 0.85rem;
    }
    .current-task-card .kicker {
      margin: 0 0 0.35rem;
      font-size: 0.7rem;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--cie-accent);
      font-weight: 600;
    }
    .current-task-card h3 {
      margin: 0 0 0.55rem;
      font-size: 1.15rem;
      font-weight: 600;
      line-height: 1.3;
    }
    .current-task-card .task-meta {
      margin: 0 0 0.85rem;
      color: var(--cie-muted);
      font-size: 0.84rem;
      line-height: 1.45;
    }
    .current-task-card .task-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
    }
    .task-guidance-card {
      position: static;
      height: auto;
      max-height: none;
      overflow: visible;
      margin-top: 0.75rem;
    }
    .task-guidance-body {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .task-guidance-block h4 {
      margin: 0 0 0.3rem;
      font-size: 0.78rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--cie-accent);
      font-weight: 600;
    }
    .task-guidance-block p {
      margin: 0;
      color: var(--cie-text);
      font-size: 0.88rem;
      line-height: 1.5;
    }
    .task-guidance-list {
      margin: 0;
      padding-left: 1.1rem;
      color: var(--cie-text);
      font-size: 0.88rem;
      line-height: 1.5;
    }
    .task-guidance-list li { margin: 0.2rem 0; }
    .task-queue {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }
    .task-queue li {
      display: flex;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.65rem 0.75rem;
      border: 1px solid var(--cie-border-soft);
      border-radius: 10px;
      font-size: 0.86rem;
    }
    .task-queue li.complete { opacity: 0.55; }
    .task-queue li.current {
      border-color: rgba(61, 156, 253, 0.45);
      background: var(--cie-accent-soft);
    }
    .task-queue .task-status {
      color: var(--cie-muted);
      font-size: 0.72rem;
      white-space: nowrap;
      font-family: 'JetBrains Mono', monospace;
    }
    .completion-options {
      display: grid;
      gap: 0.5rem;
      margin-top: 0.85rem;
    }
    .completion-options button {
      width: 100%;
      text-align: left;
    }
    .previous-plans {
      margin-top: 0.85rem;
      border-top: 1px solid var(--cie-border-soft);
      padding-top: 0.75rem;
    }
    .previous-plans summary {
      cursor: pointer;
      color: var(--cie-muted);
      font-size: 0.82rem;
      font-weight: 500;
      list-style: none;
    }
    .previous-plans summary::-webkit-details-marker { display: none; }
    .previous-plans .session-list { margin-top: 0.65rem; }
    .gw-left-section {
      position: static;
      margin: 0;
      height: auto;
      overflow: visible;
    }
    .gw-section-label {
      font-size: 0.78rem;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      color: var(--cie-muted);
    }
    #savedSessions.workspace-left-nav {
      position: static;
      flex: 0 1 auto;
      height: auto;
      max-height: 58%;
      overflow-x: hidden;
      overflow-y: auto;
      padding: 0.75rem 1.15rem 0.85rem;
      border-bottom: 1px solid var(--cie-border);
      margin-top: 0;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }
    #savedSessions.workspace-left-nav.session-list {
      /* Avoid session-list gap stacking that looked like overlapping cards. */
      gap: 0.35rem;
      margin-top: 0;
    }
    /* Guidance open: left nav is the ONLY scroll owner above the sticky footer. */
    .panel[data-workspace="growth"] {
      --gw-sticky-footer-clearance: calc(7.5rem + 24px);
    }
    .panel[data-workspace="growth"] #savedSessions.workspace-left-nav.guidance-open {
      /* flex-basis 0 so this takes remaining space and scrolls internally */
      flex: 1 1 0;
      min-height: 0;
      max-height: none;
      height: auto;
      /* Block layout: flex scroll containers often ignore padding-bottom overflow */
      display: block;
      overflow-x: hidden;
      overflow-y: auto;
      padding-bottom: 0 !important; /* spacer owns clearance, not padding */
      border-bottom: none;
      scroll-padding-bottom: var(--gw-sticky-footer-clearance);
    }
    .panel[data-workspace="growth"] #savedSessions.workspace-left-nav.guidance-open > .gw-left-section,
    .panel[data-workspace="growth"] #savedSessions.workspace-left-nav.guidance-open > .previous-plans {
      display: block;
    }
    /* Explicit end spacer inside the scroll container (footer height + 24px). */
    .gw-guidance-scroll-spacer {
      display: block;
      width: 100%;
      height: var(--gw-sticky-footer-clearance);
      min-height: var(--gw-sticky-footer-clearance);
      flex: 0 0 auto;
      pointer-events: none;
    }
    .panel[data-workspace="growth"] #chatLog.guidance-suppressed {
      display: none !important;
      height: 0 !important;
      max-height: 0 !important;
      min-height: 0 !important;
      margin: 0 !important;
      padding: 0 !important;
      overflow: hidden !important;
      border: 0 !important;
      flex: 0 0 0 !important;
    }
    .panel[data-workspace="growth"] #growthWorkspaceActions,
    .panel[data-workspace="growth"] #sessionStatus {
      flex: 0 0 auto;
      position: relative;
      z-index: 3;
      background: var(--cie-panel-elevated);
    }
    .panel[data-workspace="growth"] #sessionStatus {
      background: var(--cie-panel);
    }
    #savedSessions .task-guidance-card,
    #savedSessions .task-guidance-card .task-guidance-body,
    #savedSessions .task-guidance-card .task-guidance-block {
      position: static;
      height: auto;
      max-height: none;
      overflow: visible;
    }
    #savedSessions .task-guidance-card {
      margin-top: 0.35rem;
      margin-bottom: 0.75rem;
      flex: 0 0 auto;
    }
    /* Never show a compact/simple task card inside the left guidance column. */
    #savedSessions [data-role="simple-task"] {
      display: none !important;
    }
    .plan-progress-label {
      display: flex;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 0.35rem;
      font-size: 0.8rem;
      color: var(--cie-muted);
    }
  </style>
</head>
<body>
  <header>
    <h1>Client Intelligence</h1>
    <p>A conversation with Max about how your business works</p>
  </header>

  <div class="workspace">
    <section class="panel" aria-label="Interview chat">
      <div class="panel-head">
        <h2 id="chatPanelTitle">Conversation</h2>
        <div class="progress-block" id="progressBlock" hidden>
          <div class="progress-label">
            <strong id="progressLabel">Business Understanding</strong>
            <span class="progress-pct" id="progressPct">0%</span>
          </div>
          <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progressTrack">
            <div class="progress-fill" id="progressFill"></div>
          </div>
        </div>
      </div>
      <div class="controls soft" id="operatorControls">
        <label>Client ID <input id="clientId" value="1" inputmode="numeric"></label>
        <button type="button" id="startBtn">Begin</button>
        <button type="button" id="notesBtn" class="secondary">Start from notes</button>
        <button type="button" id="newInterviewBtn" class="secondary" hidden>Start New Interview</button>
        <button type="button" id="loadAnchorFixtureBtn" class="secondary" hidden>Load Anchor sample Blueprint</button>
      </div>
      <div id="savedSessions" class="session-list" hidden></div>
      <div id="chatLog" aria-live="polite"></div>
      <div class="composer" id="composer" hidden>
        <textarea id="messageInput" placeholder="Share your thoughts…" rows="2"></textarea>
        <button type="button" id="sendBtn" disabled>Send</button>
      </div>
      <div class="actions" id="execActions" hidden>
        <button type="button" id="accurateBtn">✓ Yes, this reflects my business.</button>
        <button type="button" id="refineBtn" class="secondary">✏️ I'd like to refine this.</button>
        <button type="button" id="keepTalkingBtn" class="secondary">💬 Let's keep talking.</button>
      </div>
      <div class="actions" id="completeActions" hidden>
        <button type="button" id="growthBtn">Resume Growth Plan</button>
        <button type="button" id="readinessBtn" class="secondary">Check Growth Infrastructure</button>
        <button type="button" id="dashboardBtn" class="secondary">Return to Dashboard</button>
      </div>
      <div class="actions" id="growthPreviewActions" hidden>
        <button type="button" id="useFocusBtn">Use this focus</button>
        <button type="button" id="refineSegmentBtn" class="secondary">Refine first segment</button>
        <button type="button" id="checkInfraFromGrowthBtn" class="secondary">Check Growth Infrastructure</button>
        <button type="button" id="growthDashboardBtn" class="secondary">Return to Dashboard</button>
      </div>
      <div class="actions" id="growthWorkspaceActions" hidden>
        <button type="button" id="continueTaskBtn">Continue Task</button>
        <button type="button" id="completeTaskBtn" class="secondary">Mark Complete</button>
        <button type="button" id="workspaceDashboardBtn" class="secondary">Return to Dashboard</button>
      </div>
      <div class="status-bar" id="sessionStatus">Welcome</div>
    </section>

    <section class="panel" aria-label="Business understanding">
      <div class="panel-head">
        <h2 id="sidePanelTitle">Business Understanding</h2>
        <p class="sub" id="sidePanelSub">Progress builds as we talk. Narratives appear after Max shares his understanding.</p>
        <div class="workspace-tabs" id="workspaceTabs" hidden>
          <button type="button" data-tab="overview" class="active">Overview</button>
          <button type="button" data-tab="tasks">Tasks</button>
          <button type="button" data-tab="readiness">Readiness Report</button>
          <button type="button" data-tab="blueprint">Blueprint</button>
          <button type="button" data-tab="history">History</button>
        </div>
      </div>
      <div id="sidePanel"><p class="blueprint-empty">When you're ready, begin the conversation.</p></div>
      <div class="actions" id="blueprintActions" hidden>
        <button type="button" id="reviseBtn" class="secondary" disabled>Save edits</button>
        <button type="button" id="approveBtn" disabled>Approve Blueprint</button>
      </div>
      <div class="status-bar" id="blueprintStatus"></div>
    </section>
  </div>
  <div class="error" id="errorBox" hidden></div>

  <script src="/shared/growth-workspace-panel.js"></script>
  <script>
    const GrowthWorkspacePanel =
      (typeof window !== 'undefined' && window.PulseforgeGrowthWorkspacePanel) || {};

    const SECTION_TITLES = {
      identity: 'Identity',
      services: 'Services',
      idealCustomers: 'Ideal Customers',
      avoidCustomers: 'Customers to Avoid',
      targetMarkets: 'Target Markets',
      competitiveAdvantages: 'Competitive Advantages',
      brandVoice: 'Brand Voice',
      campaignGoals: 'Campaign Goals',
      successMetrics: 'Success Metrics',
    };

    const LOAD_STEPS = [
      'Reviewing interview',
      'Organizing evidence',
      'Connecting themes',
      'Measuring confidence',
      'Identifying opportunities',
      'Preparing Executive Business Brief',
    ];

    const PLAYBOOK_STEPS = [
      'Translating business understanding',
      'Building operational strategy',
      'Ready',
    ];

    const TRUST_BRIDGE =
      "One last thing.\n\nBefore I ask you to trust my recommendations, I want to make sure I've earned your trust by showing you that I understood your business.";

    const PREMIUM_LOAD_MS = 3000;

    const state = {
      phase: 'welcome',
      interviewId: null,
      sessionStatus: null,
      blueprint: null,
      executiveSummary: null,
      understanding: null,
      stickToBottom: true,
      pendingCompletion: null,
      approveInFlight: false,
      initialGrowthDirection: null,
      growthConversationActive: false,
      readinessConversationActive: false,
      campaignPlanningConversationActive: false,
      growthInfrastructureReadinessReport: null,
      firstGrowthPlanPreview: null,
      firstCampaignPlanPreview: null,
      prospectListCriteriaPreview: null,
      prospectListBuildProposal: null,
      scoutHandoffBrief: null,
      scoutHandoff: null,
      scoutWorkRequest: null,
      scoutCandidateBatch: null,
      growthPlan: null,
      workspaceTab: 'overview',
      isSample: false,
      savedSessions: [],
      fixturesAllowed: false,
      taskGuidanceOpen: false,
    };

    const els = {
      clientId: document.getElementById('clientId'),
      chatLog: document.getElementById('chatLog'),
      messageInput: document.getElementById('messageInput'),
      sendBtn: document.getElementById('sendBtn'),
      startBtn: document.getElementById('startBtn'),
      notesBtn: document.getElementById('notesBtn'),
      newInterviewBtn: document.getElementById('newInterviewBtn'),
      loadAnchorFixtureBtn: document.getElementById('loadAnchorFixtureBtn'),
      savedSessions: document.getElementById('savedSessions'),
      sessionStatus: document.getElementById('sessionStatus'),
      sidePanel: document.getElementById('sidePanel'),
      sidePanelTitle: document.getElementById('sidePanelTitle'),
      sidePanelSub: document.getElementById('sidePanelSub'),
      reviseBtn: document.getElementById('reviseBtn'),
      approveBtn: document.getElementById('approveBtn'),
      blueprintStatus: document.getElementById('blueprintStatus'),
      blueprintActions: document.getElementById('blueprintActions'),
      errorBox: document.getElementById('errorBox'),
      progressBlock: document.getElementById('progressBlock'),
      progressLabel: document.getElementById('progressLabel'),
      progressPct: document.getElementById('progressPct'),
      progressFill: document.getElementById('progressFill'),
      progressTrack: document.getElementById('progressTrack'),
      composer: document.getElementById('composer'),
      operatorControls: document.getElementById('operatorControls'),
      execActions: document.getElementById('execActions'),
      completeActions: document.getElementById('completeActions'),
      growthPreviewActions: document.getElementById('growthPreviewActions'),
      useFocusBtn: document.getElementById('useFocusBtn'),
      refineSegmentBtn: document.getElementById('refineSegmentBtn'),
      checkInfraFromGrowthBtn: document.getElementById('checkInfraFromGrowthBtn'),
      growthDashboardBtn: document.getElementById('growthDashboardBtn'),
      accurateBtn: document.getElementById('accurateBtn'),
      refineBtn: document.getElementById('refineBtn'),
      keepTalkingBtn: document.getElementById('keepTalkingBtn'),
      growthBtn: document.getElementById('growthBtn'),
      readinessBtn: document.getElementById('readinessBtn'),
      dashboardBtn: document.getElementById('dashboardBtn'),
      chatPanelTitle: document.getElementById('chatPanelTitle'),
      growthWorkspaceActions: document.getElementById('growthWorkspaceActions'),
      continueTaskBtn: document.getElementById('continueTaskBtn'),
      completeTaskBtn: document.getElementById('completeTaskBtn'),
      workspaceDashboardBtn: document.getElementById('workspaceDashboardBtn'),
      workspaceTabs: document.getElementById('workspaceTabs'),
    };

    function showError(err) {
      els.errorBox.hidden = !err;
      els.errorBox.textContent = err || '';
    }

    function isNearBottom(el, threshold) {
      return el.scrollHeight - el.scrollTop - el.clientHeight <= (threshold || 80);
    }

    function maybeScrollChat() {
      if (state.stickToBottom) {
        els.chatLog.scrollTop = els.chatLog.scrollHeight;
      }
    }

    els.chatLog.addEventListener('scroll', () => {
      state.stickToBottom = isNearBottom(els.chatLog);
    });

    function addBubble(role, text) {
      const div = document.createElement('div');
      div.className = 'bubble ' + role;
      div.textContent = text;
      els.chatLog.appendChild(div);
      maybeScrollChat();
      return div;
    }

    function escapeHtml(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function confBand(pct) {
      if (pct <= 50) return 'bad';
      if (pct <= 80) return 'warn';
      return 'ok';
    }

    function renderProgress(progress) {
      if (!progress) {
        els.progressBlock.hidden = true;
        return;
      }
      const pct = Math.max(0, Math.min(100, Number(progress.percent) || 0));
      els.progressBlock.hidden = false;
      els.progressLabel.textContent = progress.label || 'Business Understanding';
      els.progressPct.textContent = pct + '%';
      els.progressFill.style.width = pct + '%';
      els.progressTrack.setAttribute('aria-valuenow', String(pct));
    }

    function renderUnderstanding(understanding) {
      state.understanding = understanding;
      if (!understanding || !understanding.sections || !understanding.sections.length) {
        els.sidePanel.innerHTML = '<p class="blueprint-empty">Understanding will grow as you answer.</p>';
        return;
      }
      const html = '<div class="understanding-list">' + understanding.sections.map((row) => {
        const pct = Math.max(0, Math.min(100, Number(row.confidencePercent != null
          ? row.confidencePercent
          : Math.round((Number(row.confidence) || 0) * 100))));
        const band = confBand(pct);
        const unknowns = (row.unknowns || []).filter(Boolean);
        const tipSupported = [
          'Interview responses',
          row.evidenceCount > 1 ? 'Consistency across answers' : null,
        ].filter(Boolean);
        const tipMissing = unknowns.length ? unknowns : ['Nothing flagged yet'];
        return (
          '<article class="understanding-row" tabindex="0">' +
            '<div class="understanding-row-top">' +
              '<div class="understanding-title ' + escapeHtml(row.status || '') + '">' +
                escapeHtml(row.title) +
              '</div>' +
              '<div class="conf-pct ' + band + '">' + pct + '%</div>' +
            '</div>' +
            '<div class="conf-bar" aria-hidden="true"><span class="' + band + '" style="width:' + pct + '%"></span></div>' +
            '<div class="understanding-status">' + escapeHtml(row.statusLabel || '') + '</div>' +
            '<div class="conf-tip" role="tooltip">' +
              '<strong>Confidence ' + pct + '%</strong><br>' +
              'Supported by:<br>' + tipSupported.map((t) => '✓ ' + escapeHtml(t)).join('<br>') +
              (unknowns.length
                ? '<br><br>Missing:<br>' + tipMissing.map((t) => '• ' + escapeHtml(t)).join('<br>')
                : '') +
            '</div>' +
          '</article>'
        );
      }).join('') + '</div>';
      els.sidePanel.innerHTML = html;
      els.sidePanelTitle.textContent = 'Business Understanding';
      els.sidePanelSub.textContent = 'Titles, confidence, and gaps — narratives come after Max shares his understanding.';
      els.blueprintActions.hidden = true;
      els.blueprintStatus.textContent = '';
    }

    function renderStars(count) {
      const n = Math.max(1, Math.min(5, Number(count) || 1));
      return '★'.repeat(n) + '☆'.repeat(5 - n);
    }

    function renderBriefSection(section) {
      const kind = section.kind || (section.items ? 'list' : section.ratings ? 'assessment' : 'prose');
      let inner = '';
      if (kind === 'assessment') {
        const rows = (section.ratings || []).map((row) =>
          '<div class="assessment-row">' +
            '<div class="assessment-label">' + escapeHtml(row.label || '') + '</div>' +
            '<div class="assessment-stars" aria-label="' + escapeHtml(String(row.stars || 0)) + ' of 5">' +
              escapeHtml(renderStars(row.stars)) +
            '</div>' +
            (row.explanation
              ? '<p class="assessment-explain">' + escapeHtml(row.explanation) + '</p>'
              : '') +
          '</div>'
        ).join('');
        inner =
          '<div class="assessment-grid">' + rows + '</div>' +
          (section.confidencePercent != null
            ? '<div class="assessment-confidence">Confidence <span>' +
                escapeHtml(String(section.confidencePercent)) + '%</span></div>'
            : '') +
          (section.body ? '<p style="margin-top:0.65rem">' + escapeHtml(section.body) + '</p>' : '');
      } else if (kind === 'list') {
        inner =
          (section.body ? '<p>' + escapeHtml(section.body) + '</p>' : '') +
          '<ul class="exec-list">' +
            (section.items || []).map((item) => '<li>' + escapeHtml(item) + '</li>').join('') +
          '</ul>';
      } else {
        inner = '<p>' + escapeHtml(section.body || '') + '</p>';
      }
      return (
        '<section class="exec-section">' +
          '<h4>' + escapeHtml(section.title || '') + '</h4>' +
          inner +
        '</section>'
      );
    }

    function renderExecutiveSummary(summary) {
      if (!summary) return;
      state.executiveSummary = summary;
      const sections = summary.sections || [];
      els.sidePanel.innerHTML =
        '<div class="exec-card">' +
          '<h3>' + escapeHtml(summary.title || 'Executive Business Brief') + '</h3>' +
          '<p class="exec-sub">' + escapeHtml(summary.subtitle || 'Prepared by Max') + '</p>' +
          '<p class="exec-tagline">' +
            escapeHtml(summary.tagline || 'A working picture for leadership review') +
          '</p>' +
          sections.map(renderBriefSection).join('') +
        '</div>';
      els.sidePanelTitle.textContent = 'Executive Business Brief';
      els.sidePanelSub.textContent = 'A consultant-quality synthesis from Max — confirm before reviewing the Business Blueprint.';
      els.blueprintActions.hidden = true;
      els.blueprintStatus.textContent = 'Executive Business Brief · read only';
    }

    function isBlueprintApproved(bp) {
      return !!(bp && (bp.status === 'approved' || state.sessionStatus === 'APPROVED'));
    }

    function setApproveButtonState(bp, { editable } = { editable: true }) {
      const approved = isBlueprintApproved(bp);
      if (approved) {
        els.blueprintActions.hidden = false;
        els.reviseBtn.disabled = true;
        els.approveBtn.disabled = true;
        els.approveBtn.textContent = 'Blueprint approved';
        return;
      }
      const canEdit = editable && bp && (bp.status === 'draft' || bp.status === 'in_review');
      els.blueprintActions.hidden = !editable;
      els.reviseBtn.disabled = !canEdit || state.approveInFlight;
      els.approveBtn.disabled = !canEdit || state.approveInFlight;
      els.approveBtn.textContent = state.approveInFlight ? 'Approving…' : 'Approve Blueprint';
    }

    function renderBlueprint(bp, { editable } = { editable: true }) {
      state.blueprint = bp;
      if (!bp) {
        els.sidePanel.innerHTML = '<p class="blueprint-empty">No blueprint yet.</p>';
        els.reviseBtn.disabled = true;
        els.approveBtn.disabled = true;
        els.approveBtn.textContent = 'Approve Blueprint';
        return;
      }
      if (isBlueprintApproved(bp) && state.phase === 'complete') {
        renderCompletion({
          blueprint: bp,
          playbook: state.pendingCompletion && state.pendingCompletion.playbook,
          initialGrowthDirection:
            state.initialGrowthDirection ||
            (state.pendingCompletion && state.pendingCompletion.initialGrowthDirection) ||
            null,
        });
        return;
      }
      const sections = bp.sections || {};
      const order = Object.keys(SECTION_TITLES);
      const keys = order.filter((k) => sections[k]).concat(
        Object.keys(sections).filter((k) => !SECTION_TITLES[k])
      );
      const created = bp.createdAt || bp.updatedAt || '';
      const metaLine = 'Version ' + escapeHtml(String(bp.version || '1')) +
        (created ? ' · ' + escapeHtml(new Date(created).toLocaleString()) : '');
      const html = '<p class="blueprint-empty">' + metaLine + '</p>' + keys.map((key) => {
        const s = sections[key] || {};
        const conf = Number(s.confidence || 0);
        const pct = Math.round(conf * 100);
        const band = confBand(pct);
        const unknowns = (s.unknowns || []).filter(Boolean);
        const count = (s.evidenceIds || []).length;
        const title = SECTION_TITLES[key] || key;
        const summary = s.summary || '';
        return (
          '<article class="section" data-section="' + escapeHtml(key) + '">' +
            '<h3 class="section-title">' + escapeHtml(title) + '</h3>' +
            (summary
              ? '<p class="section-summary">' + escapeHtml(summary) + '</p>'
              : '<p class="section-summary blueprint-empty">No summary yet.</p>') +
            '<div class="section-meta">' +
              '<span class="conf-pct ' + band + '">Confidence ' + pct + '%</span>' +
              '<span class="evidence-count">Evidence ' + count + '</span>' +
            '</div>' +
            '<div class="conf-bar" aria-hidden="true"><span class="' + band + '" style="width:' + pct + '%"></span></div>' +
            (unknowns.length
              ? '<div class="unknowns">Unknowns: ' + escapeHtml(unknowns.join('; ')) + '</div>'
              : '') +
            (editable && !isBlueprintApproved(bp)
              ? '<textarea data-key="' + escapeHtml(key) + '">' + escapeHtml(summary) + '</textarea>'
              : '') +
          '</article>'
        );
      }).join('');
      els.sidePanel.innerHTML = html;
      els.sidePanelTitle.textContent = 'Business Blueprint';
      els.sidePanelSub.textContent = editable && !isBlueprintApproved(bp)
        ? 'Editable artifact of Max\'s understanding. Adjust anything that needs sharpening.'
        : 'Approved foundation for future recommendations.';
      setApproveButtonState(bp, { editable: editable && !isBlueprintApproved(bp) });
      if (isBlueprintApproved(bp)) {
        els.blueprintActions.hidden = true;
      }
      els.blueprintStatus.textContent =
        bp.status + ' · v' + bp.version +
        (bp.playbookId ? ' · playbook ' + bp.playbookId + '@' + bp.playbookVersion : '');
    }

    function renderGrowthDirection(gd) {
      if (!gd) return '';
      const paras = (gd.paragraphs || []).filter(Boolean).slice(0, 5);
      return (
        '<div class="growth-direction" id="initialGrowthDirection">' +
          '<p class="growth-kicker">Initial Growth Direction</p>' +
          '<h4>' + escapeHtml(gd.heading || gd.title || 'First growth focus') + '</h4>' +
          paras.map((p) => '<p>' + escapeHtml(p) + '</p>').join('') +
          '<p class="growth-disclaimer">' +
            escapeHtml(gd.disclaimer || 'Directional only — not final strategy.') +
          '</p>' +
        '</div>'
      );

    function isTruncatedCriteriaText(value) {
      const s = String(value || '').trim();
      if (!s) return true;
      if (/\b-\s*[A-Z]?[a-z]{0,2}$/.test(s)) return true; // e.g. "- Li"
      if (/\b(clea|manag|propert|conversat)$/i.test(s)) return true;
      // Market bound that swallowed objective prose.
      if (
        /^(greater\s+)?manchester\b/i.test(s) &&
        /will engage in qualified conversations/i.test(s)
      ) {
        return true;
      }
      if (/inclusion\s*:|exclusion\s*:/i.test(s)) return true;
      if (/each prospect record should include/i.test(s)) return true;
      return false;
    }

    function criteriaPlainText(value) {
      const s = String(value || '').trim();
      if (!s || isTruncatedCriteriaText(s)) return '—';
      return s;
    }

    function criteriaListItems(items) {
      if (!Array.isArray(items) || !items.length) return [];
      const towns = /^(bedford|hooksett|londonderry|auburn|goffstown|manchester)\.?$/i;
      return items
        .map((item) => String(item || '').trim())
        .filter(Boolean)
        .filter((item) => !towns.test(item))
        .filter((item) => !isTruncatedCriteriaText(item))
        .filter((item) => !/\s[-–—]\s+located in\b/i.test(item))
        .filter((item) => !/each prospect record|review gate/i.test(item))
        .filter(
          (item) =>
            !/\b(questions about|recurring service|reliability|responsiveness|scheduling|cleaning frustrations|vague interest|no next step)\b/i.test(
              item
            )
        );
    }

    function applyGuidanceFooterClearance() {
      const scroll = els.savedSessions;
      if (!scroll) return;
      const guidanceOpen =
        state.phase === 'growth_workspace' && Boolean(state.taskGuidanceOpen);
      const chatPanel = els.chatLog && els.chatLog.closest('.panel');
      if (!guidanceOpen) {
        scroll.style.removeProperty('--gw-sticky-footer-clearance');
        if (chatPanel) chatPanel.style.removeProperty('--gw-sticky-footer-clearance');
        const stale = scroll.querySelector('[data-role="guidance-scroll-spacer"]');
        if (stale) stale.remove();
        return;
      }
      // Bottom clearance = sticky footer height (actions + status) + 24px.
      // Applied as an in-flow spacer inside the scroll container (not outer panel
      // padding) so Complete when / Who owns it can scroll fully above the footer.
      let footerHeight = 0;
      if (els.growthWorkspaceActions && !els.growthWorkspaceActions.hidden) {
        footerHeight += els.growthWorkspaceActions.getBoundingClientRect().height;
      }
      if (els.sessionStatus) {
        footerHeight += els.sessionStatus.getBoundingClientRect().height;
      }
      const clearancePx = Math.max(0, Math.ceil(footerHeight)) + 24;
      const value = clearancePx + 'px';
      scroll.style.setProperty('--gw-sticky-footer-clearance', value);
      if (chatPanel) chatPanel.style.setProperty('--gw-sticky-footer-clearance', value);
      scroll.style.scrollPaddingBottom = value;

      let spacer = scroll.querySelector('[data-role="guidance-scroll-spacer"]');
      if (!spacer) {
        spacer = document.createElement('div');
        spacer.className = 'gw-guidance-scroll-spacer';
        spacer.setAttribute('data-role', 'guidance-scroll-spacer');
        spacer.setAttribute('aria-hidden', 'true');
        scroll.appendChild(spacer);
      } else if (spacer.parentElement !== scroll || spacer !== scroll.lastElementChild) {
        scroll.appendChild(spacer);
      }
      spacer.style.height = value;
      spacer.style.minHeight = value;
    }

    function syncGrowthWorkspaceChrome() {
      const chatPanel = els.chatLog && els.chatLog.closest('.panel');
      const inWorkspace = state.phase === 'growth_workspace';
      const guidanceOpen = Boolean(state.taskGuidanceOpen) && inWorkspace;
      if (chatPanel) {
        if (inWorkspace) chatPanel.setAttribute('data-workspace', 'growth');

      if (els.savedSessions) {
        els.savedSessions.classList.toggle('guidance-open', guidanceOpen);

        // Suppress chat bubbles while expanded guidance is open so a simple
        // task summary does not appear under the guidance card.
        els.chatLog.classList.toggle('guidance-suppressed', guidanceOpen);
      }
      // Measure after layout so Who owns it / Complete when clear the footer.
      if (typeof requestAnimationFrame === 'function') {
        requestAnimationFrame(() => applyGuidanceFooterClearance());
      } else {
        applyGuidanceFooterClearance();
      }

    async function api(method, url, body) {
      showError('');
      const res = await fetch(url, {
        method,
        headers: {
          Accept: 'application/json',
          ...(body == null ? {} : { 'Content-Type': 'application/json' }),
        },
        body: body == null ? undefined : JSON.stringify(body),
        credentials: 'same-origin',
      });
      const text = await res.text();
      let json = null;
      try { json = text ? JSON.parse(text) : null; } catch (_) {}
      if (!res.ok) {
        const msg = (json && (json.message || json.error)) || text || res.statusText;
        throw new Error(msg);
      }
      return json;
    }

    function sleep(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));

    async function runChecklist(steps, minMs, backendPromise) {
      const wrap = document.createElement('div');
      wrap.className = 'checklist';
      wrap.setAttribute('aria-live', 'polite');
      const items = steps.map((label) => {
        const row = document.createElement('div');
        row.className = 'checklist-item';
        row.innerHTML = '<span class="checklist-mark">○</span><span>' + escapeHtml(label) + '</span>';
        wrap.appendChild(row);
        return row;
      });
      els.chatLog.appendChild(wrap);
      maybeScrollChat();

      const started = Date.now();
      let backendResult = null;
      let backendDone = false;
      const backendWait = Promise.resolve(backendPromise).then((r) => {
        backendDone = true;
        backendResult = r;
        return r;
      });

      const stepDelay = Math.max(320, Math.floor(minMs / Math.max(steps.length, 1)));
      for (let i = 0; i < items.length; i += 1) {
        items[i].classList.add('active');
        items[i].querySelector('.checklist-mark').textContent = '…';
        await sleep(stepDelay);
        items[i].classList.remove('active');
        items[i].classList.add('done');
        items[i].querySelector('.checklist-mark').textContent = '✓';
        maybeScrollChat();
        if (backendDone && Date.now() - started >= minMs && i >= items.length - 2) {
          for (let j = i + 1; j < items.length; j += 1) {
            items[j].classList.add('done');
            items[j].querySelector('.checklist-mark').textContent = '✓';
          }
          break;
        }
      }

      const elapsed = Date.now() - started;
      if (elapsed < minMs) await sleep(minMs - elapsed);
      await backendWait;
      return backendResult;
    }

        const id = s.sessionId || s.interviewId;

    function renderWorkspaceLeftNav() {
      if (!els.savedSessions) return;
      const list = Array.isArray(state.savedSessions) ? state.savedSessions : [];
      const plan = state.growthPlan;
      let current = currentSessionFromList(list);
      if (!current && plan) {
        current = {
          sessionId: state.interviewId || plan.sessionId,
          interviewId: state.interviewId || plan.sessionId,
          businessName: plan.businessName,
          growthPlan: plan,
          resumeTarget:
            plan.status === 'complete' ? 'growth_complete' : 'growth_workspace',
          isSample: state.isSample,
        };
      }
      const currentId =
        (current && (current.sessionId || current.interviewId)) ||
        state.interviewId ||
        null;
      const previous = list.filter((s) => {
        const id = s.sessionId || s.interviewId;
        return currentId ? String(id) !== String(currentId) : false;
      });
      const task = plan && plan.currentTask ? plan.currentTask : null;
      const currentForRender =
        current && plan
          ? Object.assign({}, current, {
              growthPlan: Object.assign({}, current.growthPlan || {}, {
                percentComplete: plan.percentComplete,
                status: plan.status,
                currentTask: task,
              }),
            })
          : current;

      if (!currentForRender && !previous.length) {
        els.savedSessions.innerHTML = '';
        els.savedSessions.hidden = true;
        return;
      }

      if (GrowthWorkspacePanel.renderGrowthWorkspaceLeftPanel) {
        els.savedSessions.innerHTML =
          GrowthWorkspacePanel.renderGrowthWorkspaceLeftPanel({
            currentSession: currentForRender,
            previousSessions: previous,
            currentSessionId: currentId,
            currentTask: task,
            guidanceOpen: Boolean(state.taskGuidanceOpen),
            collapsePrevious: true,
            businessName:
              (currentForRender && currentForRender.businessName) ||
              (state.blueprint && state.blueprint.businessName) ||
              'Anchor Cleaning',
          });
      } else {
        // Fallback: still use the shared single-card helper when available.
        let html =
          '<section class="gw-left-section" data-section="current-plan">' +
          '<p class="blueprint-empty gw-section-label" style="margin:0 0 0.25rem">Current Growth Plan</p>' +
          (currentForRender
            ? sessionCardHtml(currentForRender, { primary: true })
            : '') +
          '</section>';
        if (state.taskGuidanceOpen && task) {
          html +=
            '<section class="gw-left-section" data-section="task-guidance">' +
            (GrowthWorkspacePanel.taskGuidanceCardHtml
              ? GrowthWorkspacePanel.taskGuidanceCardHtml(task, {
                  businessName:
                    (currentForRender && currentForRender.businessName) ||
                    'Anchor Cleaning',
                })
              : '') +
            '</section>';
        }
        if (previous.length) {
          html +=
            '<details class="previous-plans" data-section="previous-plans">' +
            '<summary>Previous Plans (' +
            previous.length +
            ')</summary>' +
            '<div class="session-list previous-plan-list">' +
            previous.map((s) => sessionCardHtml(s, { primary: false })).join('') +
            '</div></details>';
        }
        els.savedSessions.innerHTML = html;
      }
      els.savedSessions.hidden = false;
      els.savedSessions.classList.add('workspace-left-nav');
      syncGrowthWorkspaceChrome();
    }

    function renderSavedSessions(sessions) {
      if (!els.savedSessions) return;
      const list = Array.isArray(sessions) ? sessions : [];
      state.savedSessions = list;
      if (state.phase === 'growth_workspace') {
        if (!list.length && !state.growthPlan) {
          els.savedSessions.innerHTML = '';
          els.savedSessions.hidden = true;
          return;

        renderWorkspaceLeftNav();
        return;

      if (!list.length) {
        els.savedSessions.innerHTML = '';
        els.savedSessions.hidden = true;
        return;
      }
      els.savedSessions.hidden = state.phase !== 'welcome';
      els.savedSessions.classList.remove('workspace-left-nav');
      const current = list[0];
      const previous = list.slice(1);
      let html =
        '<p class="blueprint-empty" style="margin:0 0 0.25rem">Current Growth Plan</p>' +
        sessionCardHtml(current, { primary: true });

        html +=
          '<details class="previous-plans">' +
            '<summary>Previous Plans (' +
            previous.length +
            ')</summary>' +
            '<div class="session-list">' +
            previous
              .map((s) => sessionCardHtml(s, { primary: false }))
              .join('') +
            '</div>' +
          '</details>';

      els.savedSessions.innerHTML = html;

    async function loadSavedSessions() {
      try {
        const clientId = (els.clientId && els.clientId.value.trim()) || '';
        const qs = new URLSearchParams({ includeSamples: '1', limit: '20' });
        if (clientId) qs.set('clientId', clientId);
        const data = await api('GET', '/api/v1/client-intel/sessions?' + qs.toString());
        state.fixturesAllowed = Boolean(data && data.fixturesAllowed);
        if (els.loadAnchorFixtureBtn) {
          els.loadAnchorFixtureBtn.hidden =
            state.phase !== 'welcome' || !state.fixturesAllowed;

        renderSavedSessions((data && data.sessions) || []);
      } catch (_) {
        state.fixturesAllowed = true;
        if (els.loadAnchorFixtureBtn) {
          els.loadAnchorFixtureBtn.hidden = state.phase !== 'welcome';
        }
        renderSavedSessions([]);
