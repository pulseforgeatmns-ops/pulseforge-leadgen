<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pulseforge — Command Deck</title>
  <link rel="icon" href="/favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@300;400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/shared/tokens.css">
  <link rel="stylesheet" href="/shared/shell.css">
  <link rel="stylesheet" href="/command-deck/command-deck.css">
</head>
<body class="cd-page">
  <a class="cd-skip" href="#command-deck-main">Skip to briefing</a>

  <main id="command-deck-main" class="cd-main" aria-label="Command Deck">
    <header class="cd-masthead" aria-label="Briefing masthead">
      <div class="cd-field-header">
        <p class="cd-field-label" id="cdFieldLabel">Max</p>
        <p class="cd-field-state" id="cdFieldState" aria-live="polite">
          <span id="cdStatus" class="cd-status-inline" role="status"></span>
          <span class="cd-field-sep" aria-hidden="true">·</span>
          <time id="cdTimestamp"></time>
        </p>
      </div>
    </header>
    <div id="cdLiveNotify" class="cd-live-notify" hidden role="status" aria-live="polite"></div>
    <div id="cdUnseenBanner" class="cd-unseen-banner" hidden role="status" aria-live="polite"></div>
    <div id="cdError" class="cd-error" hidden></div>

    <!-- SPEC-097 Living Command Deck — spatial intelligence surface -->
    <section id="cdSpatialDeck" class="cd-spatial-deck" aria-label="Living Command Deck" hidden>
      <div class="cd-spatial-toolbar">
        <button type="button" id="cdViewToggle" class="cd-view-toggle" aria-pressed="false">
          View as list
        </button>
      </div>
      <div id="cdSpatialCanvas" class="cd-spatial-canvas" role="group" aria-label="Max intelligence field">
        <div class="cd-intel-field" aria-hidden="true">
          <div class="cd-intel-field-waves"></div>
        </div>
        <svg class="cd-intel-connections" id="cdIntelConnections" aria-hidden="true" focusable="false"></svg>
        <div class="cd-spatial-orbit" id="cdSpatialOrbit">
          <article class="cd-spatial-max" id="cdSpatialMax" aria-label="Max intelligence anchor">
            <div class="cd-spatial-max-halo" aria-hidden="true">
              <span class="cd-max-illumination"></span>
              <span class="cd-max-bloom"></span>
            </div>
            <div class="cd-spatial-max-core">
              <p class="cd-spatial-max-label">Max</p>
              <p class="cd-spatial-max-headline" id="cdSpatialMaxHeadline"></p>
              <p class="cd-spatial-max-subline" id="cdSpatialMaxSubline"></p>
            </div>
          </article>
        </div>
      </div>
      <div id="cdSpatialList" class="cd-spatial-list" hidden aria-label="Domain list view"></div>
    </section>

    <div id="cdOperatorLayout" class="cd-operator-layout" hidden>
      <div class="cd-operator-main">
        <section id="cdMorningBrief" class="cd-section cd-morning" aria-labelledby="cdMorningHeading" data-stage="morning" hidden></section>
        <section id="cdHighestLeverage" class="cd-section cd-hla" aria-labelledby="cdHlaHeading" data-stage="hla" hidden></section>
        <section id="cdTodayChanges" class="cd-section cd-brief-block" aria-labelledby="cdTodayHeading" data-stage="today" hidden></section>
        <section id="cdNeedsJake" class="cd-section cd-brief-block" aria-labelledby="cdNeedsJakeHeading" data-stage="needs-jake" hidden></section>
        <section id="cdMikeNext" class="cd-section cd-brief-block" aria-labelledby="cdMikeNextHeading" data-stage="mike-next" hidden></section>
      </div>
      <aside id="cdCommandRail" class="cd-command-rail" aria-label="Operator action rail" data-stage="rail" hidden></aside>
    </div>

    <div id="cdAoDrillDown" class="cd-ao-drilldown" hidden aria-label="AO detail sections">
      <section id="cd-escalations" class="cd-section cd-drill-section" aria-labelledby="cdEscalationsHeading" data-stage="drill-escalations" hidden></section>
      <section id="cd-campaign" class="cd-section cd-drill-section" aria-labelledby="cdCampaignHeading" data-stage="drill-campaign" hidden></section>
      <section id="cd-promo" class="cd-section cd-drill-section" aria-labelledby="cdPromoHeading" data-stage="drill-promo" hidden></section>
    </div>

    <section id="cdJakeActions" class="cd-section cd-action-list" aria-labelledby="cdJakeHeading" data-stage="jake" hidden></section>
    <section id="cdMikeActions" class="cd-section cd-action-list" aria-labelledby="cdMikeHeading" data-stage="mike" hidden></section>
    <section id="cdActionCards" class="cd-section cd-action-cards" aria-labelledby="cdCardsHeading" data-stage="cards" hidden></section>
    <section id="cdOperations" class="cd-section cd-operations" aria-labelledby="cdOpsHeading" data-stage="operations" hidden></section>
    <section id="cdSecondary" class="cd-section cd-secondary" aria-label="Supporting intelligence" data-stage="legacy-cards" hidden></section>
    <section id="cdPriorityQueue" class="cd-section cd-queue" aria-labelledby="cdQueueHeading" data-stage="queue" hidden></section>
  </main>

  <!-- Intelligence Navigation investigation surface (SPEC-010) -->
  <div id="cdInvestigation" class="cd-investigation" hidden>
    <div class="cd-investigation-panel" role="region" aria-label="Intelligence investigation">
      <header class="cd-investigation-header">
        <nav id="cdTrail" class="cd-trail" aria-label="Intelligence trail"></nav>
        <button type="button" class="cd-inv-close" data-cd-inv-close aria-label="Close investigation">Close</button>
      </header>
      <div id="cdInvLiveBanner" class="cd-inv-live-banner" hidden role="status">
        <span class="cd-inv-live-text">New intelligence available</span>
        <button type="button" class="cd-inv-live-review" data-cd-inv-review>Review</button>
      </div>
      <div id="cdInvestigationBody" class="cd-investigation-body"></div>
    </div>
  </div>

  <div class="cd-ask-bar" role="region" aria-label="Ask Max">
    <div class="cd-ask-context">
      <select id="cdRecentConversations" class="cd-recent-select" aria-label="Recent conversations" hidden>
        <option value="">Recent ▾</option>
      </select>
    </div>
    <form id="cdAskForm" class="cd-ask-form" autocomplete="off">
      <label class="pf-sr-only" for="cdAskInput">Ask Max about today's briefing</label>
      <span class="cd-ask-mark" aria-hidden="true"></span>
      <textarea
        id="cdAskInput"
        class="cd-ask-input"
        name="ask"
        rows="1"
        maxlength="100000"
        placeholder="Ask Max — what needs my attention today?"
      ></textarea>
      <button type="submit" class="cd-ask-submit" aria-label="Open Ask Max">Ask</button>
    </form>
  </div>

  <!-- Max Intelligence Workspace (SPEC-009 / SPEC-045) -->
  <div
    id="maxWorkspace"
    class="mx-workspace"
    hidden
    role="dialog"
    aria-modal="true"
    aria-labelledby="mxTitle"
  >
    <div class="mx-backdrop" data-mx-close></div>
    <div class="mx-panel">
      <header class="mx-header">
        <div>
          <p class="mx-eyebrow">Intelligence Workspace</p>
          <h2 id="mxTitle" class="mx-title">Max</h2>
          <p id="mxContextLabel" class="mx-context-label"></p>
        </div>
        <button type="button" class="mx-close" data-mx-close aria-label="Close Max">Close</button>
      </header>

      <div id="mxSwitch" class="mx-switch" hidden role="status"></div>

      <div id="mxThread" class="mx-thread" aria-live="polite"></div>

      <div class="mx-composer-dock">
        <div id="mxSuggestions" class="mx-suggestions" aria-label="Suggested investigations"></div>
        <form id="mxAskForm" class="mx-ask-form" autocomplete="off">
          <label class="pf-sr-only" for="mxAskInput">Ask Max</label>
          <textarea
            id="mxAskInput"
            class="mx-ask-input"
            rows="1"
            maxlength="100000"
            placeholder="Issue an objective… Paste a prospect list on new lines to attach."
          ></textarea>
          <button type="submit" class="mx-ask-submit" id="mxAskSend">Send</button>
        </form>
      </div>
    </div>
  </div>

  <!-- Mission Workspace (SPEC-022 / SPEC-045) -->
  <div
    id="missionWorkspace"
    class="mx-workspace msn-workspace"
    hidden
    role="dialog"
    aria-modal="true"
    aria-labelledby="msnTitle"
  >
    <div class="mx-backdrop" data-msn-close></div>
    <div class="mx-panel msn-panel">
      <header class="mx-header">
        <div>
          <p class="mx-eyebrow">Mission Workspace</p>
          <h2 id="msnTitle" class="mx-title">Mission</h2>
          <p id="msnStatus" class="mx-context-label"></p>
        </div>
        <button type="button" class="mx-close" data-msn-close aria-label="Close mission">Close</button>
      </header>
      <div id="msnBody" class="msn-body"></div>
      <div id="msnActions" class="msn-actions msn-actions-dock"></div>
    </div>
  </div>

  <!-- Domain drawer — progressive disclosure (SPEC-097) -->
  <div id="cdDomainDrawer" class="cd-domain-drawer" hidden role="dialog" aria-modal="true" aria-labelledby="cdDomainDrawerTitle">
    <div class="cd-domain-backdrop" data-cd-domain-close></div>
    <div class="cd-domain-panel">
      <header class="cd-domain-header">
        <div>
          <p class="cd-domain-eyebrow" id="cdDomainDrawerEyebrow">Domain</p>
          <h2 id="cdDomainDrawerTitle" class="cd-domain-title">Domain</h2>
        </div>
        <button type="button" class="cd-domain-close" data-cd-domain-close aria-label="Close domain">Close</button>
      </header>
      <div id="cdDomainDrawerBody" class="cd-domain-body"></div>
      <footer class="cd-domain-footer">
        <button type="button" class="cd-btn cd-btn-primary" id="cdDomainDiscussMax">Discuss with Max</button>
      </footer>
    </div>
  </div>

  <!-- Priority explanation overlay -->
  <div id="cdPriorityExplain" class="cd-priority-explain" hidden role="dialog" aria-modal="true" aria-labelledby="cdPriorityExplainTitle">
    <div class="cd-domain-backdrop" data-cd-explain-close></div>
    <div class="cd-priority-panel">
      <header class="cd-domain-header">
        <h2 id="cdPriorityExplainTitle" class="cd-domain-title">Why this moved</h2>
        <button type="button" class="cd-domain-close" data-cd-explain-close aria-label="Close explanation">Close</button>
      </header>
      <div id="cdPriorityExplainBody" class="cd-domain-body"></div>
    </div>
  </div>

  <script src="/shared/accessibility.js"></script>
  <script src="/shared/api-client.js"></script>
  <script src="/shared/shell.js"></script>
  <script src="/shared/maxInteractionCadence.js"></script>
  <script src="/command-deck/investigation.js"></script>
  <script src="/command-deck/spatial-deck.js"></script>
  <script src="/command-deck/command-deck.js"></script>
</body>
</html>
