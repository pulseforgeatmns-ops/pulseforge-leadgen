<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Knowledge Health — Pulseforge Admin</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a222c;
      --text: #e7ecf1;
      --muted: #8b9aab;
      --accent: #3d9cf0;
      --ok: #3ecf8e;
      --warn: #f0b429;
      --bad: #f07178;
      --border: #2a3542;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      background:
        radial-gradient(1200px 600px at 10% -10%, #1a3050 0%, transparent 55%),
        radial-gradient(900px 500px at 100% 0%, #15282a 0%, transparent 50%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      padding: 1.5rem 2rem 0.5rem;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 1rem;
      flex-wrap: wrap;
    }
    h1 {
      font-family: "IBM Plex Serif", Georgia, serif;
      font-weight: 500;
      font-size: 1.6rem;
      margin: 0;
      letter-spacing: -0.02em;
    }
    .sub { color: var(--muted); font-size: 0.9rem; }
    .links a {
      color: var(--accent);
      text-decoration: none;
      margin-left: 1rem;
      font-size: 0.9rem;
    }
    main { padding: 1rem 2rem 3rem; max-width: 1100px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 1rem;
      margin-top: 1.25rem;
    }
    .metric {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1rem 1.1rem;
    }
    .metric .label {
      color: var(--muted);
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 0.45rem;
    }
    .metric .value {
      font-size: 1.75rem;
      font-variant-numeric: tabular-nums;
      font-weight: 560;
    }
    .metric .value.ok { color: var(--ok); }
    .metric .value.warn { color: var(--warn); }
    .metric .value.bad { color: var(--bad); }
    .panel {
      margin-top: 1.5rem;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1.1rem 1.25rem;
    }
    .panel h2 {
      margin: 0 0 0.75rem;
      font-size: 1rem;
      font-weight: 560;
    }
    button {
      background: var(--accent);
      color: #061018;
      border: 0;
      border-radius: 4px;
      padding: 0.55rem 1rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }
    button:disabled { opacity: 0.5; cursor: wait; }
    .meta { color: var(--muted); font-size: 0.85rem; margin-top: 0.75rem; }
    code { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 0.85em; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Knowledge Health</h1>
      <div class="sub">Admin only · SPEC-014 operational confidence · not customer-facing</div>
    </div>
    <div class="links">
      <a href="/admin/flight-recorder">Flight Recorder</a>
      <a href="/command-deck">Command Deck</a>
      <a href="/dashboard">Dashboard</a>
    </div>
  </header>
  <main>
    <div class="grid" id="metrics">
      <div class="metric"><div class="label">Loading…</div><div class="value">—</div></div>
    </div>
    <div class="panel">
      <h2>Outbox</h2>
      <button id="drain" type="button">Drain queue now</button>
      <div class="meta" id="drainResult"></div>
    </div>
    <div class="panel">
      <h2>Last successful write</h2>
      <div class="meta" id="lastWrite">—</div>
    </div>
  </main>
  <script>
    async function load() {
      const res = await fetch('/api/v1/admin/knowledge/health', { credentials: 'same-origin' });
      const data = await res.json();
      const cards = [
        ['Knowledge Events Today', data.knowledgeEventsToday, 'ok'],
        ['Knowledge Queue Depth', data.knowledgeQueueDepth, data.knowledgeQueueDepth > 0 ? 'warn' : 'ok'],
        ['Dual-Write Failures', data.dualWriteFailures, data.dualWriteFailures > 0 ? 'bad' : 'ok'],
        ['Evidence Created', data.evidenceCreated, 'ok'],
        ['Recommendations Generated', data.recommendationsGenerated, 'ok'],
        ['Recommendations Executed', data.recommendationsExecuted, 'ok'],
        ['Outcome Records', data.outcomeRecords, 'ok'],
      ];
      const root = document.getElementById('metrics');
      root.innerHTML = cards.map(([label, value, tone]) => `
        <div class="metric">
          <div class="label">${label}</div>
          <div class="value ${tone}">${value == null ? '—' : value}</div>
        </div>`).join('');
      const last = data.lastSuccessfulWrite;
      document.getElementById('lastWrite').textContent = last
        ? `${last.at} · ${last.eventType} · tenant ${last.tenantId}`
        : (data.enabled === false ? 'Dual-write disabled or schema not ready' : 'No successful writes yet');
    }

    document.getElementById('drain').addEventListener('click', async (e) => {
      const btn = e.currentTarget;
      btn.disabled = true;
      try {
        const res = await fetch('/api/v1/admin/knowledge/outbox/drain', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ limit: 100 }),
        });
        const data = await res.json();
        document.getElementById('drainResult').textContent = JSON.stringify(data);
        await load();
      } finally {
        btn.disabled = false;
      }
    });

    load().catch((err) => {
      document.getElementById('metrics').innerHTML =
        `<div class="metric"><div class="label">Error</div><div class="value bad">${err.message}</div></div>`;
    });
    setInterval(() => load().catch(() => {}), 30000);
  </script>
</body>
</html>
