<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pulseforge — Acquisition Missions</title>
<link rel="stylesheet" href="/shared/tokens.css">
<link rel="stylesheet" href="/shared/shell.css">
<script src="/shared/shell.js" defer></script>
<style>
  body { margin: 0; background: var(--pf-bg, #040810); color: var(--pf-text, #e8f0fe); font-family: 'DM Sans', sans-serif; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 1.5rem 1.25rem 3rem; }
  h1 { font-family: 'Bebas Neue', sans-serif; letter-spacing: 3px; font-size: 1.8rem; margin: 0 0 0.35rem; }
  .sub { font-family: 'JetBrains Mono', monospace; font-size: 0.62rem; letter-spacing: 1.6px; text-transform: uppercase; color: #6b7fa0; margin-bottom: 0.35rem; }
  .mode-badge { display: inline-block; font-family: 'JetBrains Mono', monospace; font-size: 0.58rem; letter-spacing: 1.2px; text-transform: uppercase; padding: 0.25rem 0.55rem; border-radius: 999px; border: 1px solid rgba(139,92,246,0.45); color: #c4b5fd; background: rgba(96,48,177,0.15); margin-bottom: 1.25rem; }
  .panel { background: #070d1a; border: 1px solid rgba(96,48,177,0.18); border-radius: 10px; padding: 1.1rem; margin-bottom: 1rem; }
  .panel[data-hidden="true"] { display: none; }
  h2 { margin: 0 0 0.5rem; font-size: 1rem; }
  p { margin: 0.25rem 0; color: #9bb0d0; font-size: 0.9rem; line-height: 1.45; }
  .meta { font-family: 'JetBrains Mono', monospace; font-size: 0.62rem; letter-spacing: 1px; text-transform: uppercase; color: #6b7fa0; }
  .bar { font-family: 'JetBrains Mono', monospace; letter-spacing: 2px; color: #c4b5fd; margin: 0.35rem 0; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.75rem; }
  .stat { background: rgba(255,255,255,0.03); border-radius: 8px; padding: 0.75rem; }
  .stat strong { display: block; font-size: 1.15rem; }
  .pill { display: inline-block; font-family: 'JetBrains Mono', monospace; font-size: 0.58rem; letter-spacing: 1px; text-transform: uppercase; padding: 0.25rem 0.5rem; border-radius: 999px; border: 1px solid rgba(255,255,255,0.12); color: #c4b5fd; margin-right: 0.35rem; }
  .pill.ok { color: #00e676; border-color: rgba(0,230,118,0.35); }
  .pill.warn { color: #fbbf24; border-color: rgba(251,191,36,0.35); }
  .pill.danger { color: #ff7a93; border-color: rgba(255,59,92,0.4); }
  ul { margin: 0.4rem 0 0; padding-left: 1.1rem; color: #9bb0d0; }
  button { font-family: 'JetBrains Mono', monospace; font-size: 0.58rem; letter-spacing: 1px; text-transform: uppercase; border-radius: 6px; padding: 0.55rem 0.7rem; cursor: pointer; border: 1px solid rgba(139,92,246,0.35); background: rgba(96,48,177,0.2); color: #8b5cf6; }
  button.secondary { background: transparent; color: #6b7fa0; border-color: rgba(255,255,255,0.12); }
  .actions { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-top: 0.7rem; }
  label { font-size: 0.82rem; color: #9bb0d0; display: block; margin: 0.35rem 0 0.15rem; }
  input, textarea { width: 100%; box-sizing: border-box; background: #040810; color: #e8f0fe; border: 1px solid rgba(255,255,255,0.12); border-radius: 6px; padding: 0.45rem 0.55rem; font-family: inherit; }
  .msg { min-height: 1.2rem; font-size: 0.82rem; color: #6b7fa0; }
  .msg.err { color: #ff3b5c; }
  .msg.ok { color: #00e676; }
  .mission-row { border-bottom: 1px solid rgba(255,255,255,0.06); padding: 0.55rem 0; cursor: pointer; }
  .mission-row:hover { color: #fff; }
  .mission-row.active { color: #c4b5fd; }
  .timeline { font-family: 'JetBrains Mono', monospace; font-size: 0.78rem; color: #9bb0d0; }
  .timeline div { padding: 0.2rem 0; }
  .discovery-list { margin: 0.5rem 0 0; padding: 0; list-style: none; }
  .discovery-list li { padding: 0.45rem 0; border-bottom: 1px solid rgba(255,255,255,0.06); }
  .discovery-list li:last-child { border-bottom: none; }
  .discovery-rank { font-family: 'JetBrains Mono', monospace; font-size: 0.62rem; color: #8b5cf6; margin-right: 0.35rem; }
  .discovery-section { margin-top: 0.75rem; }
  .discovery-section h3 { margin: 0 0 0.35rem; font-size: 0.82rem; color: #c4b5fd; font-family: 'JetBrains Mono', monospace; letter-spacing: 1px; text-transform: uppercase; }
  .discovery-section ul { margin: 0; padding-left: 1.1rem; }
  @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>Acquisition Missions</h1>
  <p class="sub">SPEC-118 · Max manages missions · Capabilities contribute · Nothing is hidden</p>
  <div class="mode-badge" id="modeBadge">Workspace Mode: Create</div>
  <p class="msg" id="msg"></p>

  <section class="panel" id="createPanel" data-component="missionCreator">
    <h2>Create mission</h2>
    <label>Objective</label>
    <textarea id="objective" rows="2" placeholder="Acquire commercial cleaning customers in Manchester."></textarea>
    <label>Target segment</label>
    <input id="segment" placeholder="Law Firms">
    <label>Campaign</label>
    <input id="campaign" placeholder="Fall Outreach">
    <div class="actions">
      <button id="createBtn">Create</button>
    </div>
  </section>

  <section class="panel" id="listPanel" data-component="missionList"></section>
  <section class="panel" id="planPanel" data-component="missionUnderstanding"></section>
  <section class="panel" id="intelligencePanel" data-component="missionIntelligenceReport"></section>
  <section class="panel" id="operatorPanel" data-component="operatorDecision"></section>
  <section class="panel" id="workspacePanel" data-component="missionWorkspace"></section>
  <section class="panel" id="discoveryPanel" data-component="discovery"></section>
  <section class="panel" id="healthPanel" data-component="missionHealth"></section>
  <section class="panel" id="blockerPanel" data-component="blockers"></section>
  <section class="panel" id="timelinePanel" data-component="missionTimeline"></section>
  <section class="panel" id="whyPanel" data-component="why"></section>

  <section class="panel" id="executionPanel" data-component="executionWorkspace">
    <h2>Execution</h2>
    <p class="meta">Current step</p>
    <p id="executionStep"><strong>—</strong></p>
    <div class="actions">
      <button id="advanceBtn">Advance stage</button>
    </div>
  </section>
</div>
<script>
(function () {
  const WORKSPACE_MODES = {
    CREATE: 'create',
    MISSION_PLANNING: 'mission_planning',
    DISCOVERY_APPROVAL: 'discovery_approval',
    DISCOVERY_RUNNING: 'discovery_running',
    DISCOVERY_REVIEW: 'discovery_review',
    OUTREACH: 'outreach',
    EXECUTION: 'execution',
    COMPLETE: 'complete',
  };

  const WORKSPACE_MODE_LABELS = {
    create: 'Create',
    mission_planning: 'Mission Planning',
    discovery_approval: 'Discovery Approval',
    discovery_running: 'Discovery Running',
    discovery_review: 'Discovery Review',
    outreach: 'Outreach',
    execution: 'Execution',
    complete: 'Complete',
  };

  const INSPECT_LIKE_MODES = [
    WORKSPACE_MODES.MISSION_PLANNING,
    WORKSPACE_MODES.DISCOVERY_APPROVAL,
    WORKSPACE_MODES.DISCOVERY_RUNNING,
    WORKSPACE_MODES.DISCOVERY_REVIEW,
    WORKSPACE_MODES.OUTREACH,
    WORKSPACE_MODES.EXECUTION,
    WORKSPACE_MODES.COMPLETE,
  ];

  const COMPONENTS = {
    missionCreator: { supportedModes: [WORKSPACE_MODES.CREATE] },
    missionList: { supportedModes: [WORKSPACE_MODES.CREATE].concat(INSPECT_LIKE_MODES) },
    missionUnderstanding: { supportedModes: INSPECT_LIKE_MODES },
    missionTimeline: { supportedModes: INSPECT_LIKE_MODES },
    missionWorkspace: { supportedModes: INSPECT_LIKE_MODES },
    missionHealth: { supportedModes: INSPECT_LIKE_MODES },
    discovery: { supportedModes: [
      WORKSPACE_MODES.DISCOVERY_APPROVAL,
      WORKSPACE_MODES.DISCOVERY_RUNNING,
      WORKSPACE_MODES.DISCOVERY_REVIEW,
    ] },
    missionIntelligenceReport: { supportedModes: [WORKSPACE_MODES.DISCOVERY_REVIEW] },
    blockers: { supportedModes: [
      WORKSPACE_MODES.MISSION_PLANNING,
      WORKSPACE_MODES.DISCOVERY_APPROVAL,
      WORKSPACE_MODES.DISCOVERY_RUNNING,
      WORKSPACE_MODES.DISCOVERY_REVIEW,
      WORKSPACE_MODES.OUTREACH,
      WORKSPACE_MODES.EXECUTION,
    ] },
    why: { supportedModes: INSPECT_LIKE_MODES },
    operatorDecision: { supportedModes: [
      WORKSPACE_MODES.MISSION_PLANNING,
      WORKSPACE_MODES.DISCOVERY_APPROVAL,
      WORKSPACE_MODES.DISCOVERY_REVIEW,
      WORKSPACE_MODES.EXECUTION,
    ] },
    executionWorkspace: { supportedModes: [WORKSPACE_MODES.EXECUTION] },
  };

  const $ = (id) => document.getElementById(id);
  const msg = $('msg');
  let missions = [];
  let selected = null;
  let snapshot = null;
  let workspaceMode = WORKSPACE_MODES.CREATE;

  function setMsg(text, kind) {
    msg.textContent = text || '';
    msg.className = 'msg' + (kind ? ' ' + kind : '');
  }

  function isComponentVisible(componentId, mode) {
    const component = COMPONENTS[componentId];
    if (!component) return false;
    return component.supportedModes.indexOf(mode) !== -1;
  }

  function applyWorkspaceMode(mode) {
    workspaceMode = mode;
    $('modeBadge').textContent = 'Workspace Mode: ' + (WORKSPACE_MODE_LABELS[mode] || mode);
    document.querySelectorAll('[data-component]').forEach(function (el) {
      const visible = isComponentVisible(el.getAttribute('data-component'), mode);
      el.setAttribute('data-hidden', visible ? 'false' : 'true');
    });
  }

  async function api(url, opts) {
    const res = await fetch(url, Object.assign({ headers: { 'Content-Type': 'application/json' } }, opts || {}));
    const body = await res.json().catch(function () { return {}; });
    if (!res.ok) throw new Error(body.message || body.error || 'Request failed');
    return body;
  }

  function pill(label, kind) {
    return '<span class="pill ' + (kind || '') + '">' + label + '</span>';
  }

  function specialistKind(state) {
    if (state === 'complete' || state === 'approved') return 'ok';
    if (state === 'generating' || state === 'approval_required') return 'warn';
    return '';
  }

  function renderMissionPlan(mission, pending) {
    const plan = (mission && mission.structuredMission) || (mission && mission.missionPlanDraft) || null;
    if (!plan) {
      $('planPanel').innerHTML = '';
      return;
    }
    const understanding = [
      ['Objective', plan.objective],
      ['Market', (plan.market && (plan.market.label || plan.market.segment)) || ''],
      ['Industry', plan.market && plan.market.industry],
      ['Region', plan.geography && plan.geography.region],
      ['Cities', ((plan.geography && plan.geography.cities) || []).join(', ')],
      ['Buyer', plan.market && plan.market.buyer],
      ['Constraints', (plan.constraints || []).join(', ')],
      ['Success', plan.successMetric ? (plan.successMetric.target + ' ' + plan.successMetric.type) : ''],
      ['Evidence Threshold', plan.evidence && (plan.evidence.thresholdLabel || plan.evidence.minimumConfidence)],
    ];
    let html = '<h2>Mission Understanding</h2>';
    if (plan.immutable) {
      html += pill('Plan approved', 'ok') + ' ';
    } else if (pending && pending.kind === 'plan_clarification') {
      html += pill('Clarification required', 'warn') + ' ';
    } else {
      html += pill('Awaiting approval', 'warn') + ' ';
    }
    html += '<dl style="margin:0.5rem 0">';
    understanding.forEach(function (row) {
      if (!row[1]) return;
      html += '<div style="margin:0.35rem 0"><span class="meta">' + row[0] + '</span><br><strong>' + row[1] + '</strong></div>';
    });
    html += '</dl>';
    $('planPanel').innerHTML = html;
  }

  function renderOperatorDecision(pending, pause) {
    if (!isComponentVisible('operatorDecision', workspaceMode)) {
      $('operatorPanel').innerHTML = '';
      return;
    }
    const decision = pending || (pause ? {
      prompt: pause.requiredDecision,
      choices: (pause.availableOptions || []).map(function (label) { return { label: label }; }),
      missingEvidence: pause.missingEvidence || [],
      coveragePercent: pause.coveragePercent,
      readiness: pause.missingEvidence || pause.coveragePercent != null
        ? {
          executable: false,
          missingEvidence: pause.missingEvidence,
          coveragePercent: pause.coveragePercent,
        }
        : null,
    } : null);
    if (!decision || !decision.prompt) {
      $('operatorPanel').innerHTML = '';
      return;
    }
    let html = '<h2>Operator Decision</h2>';
    if (decision.headline) {
      html += '<p><strong>' + decision.headline + '</strong></p>';
    }
    html += '<p>' + decision.prompt + '</p>';
    if (decision.coveragePercent != null) {
      html += '<p class="meta">Coverage: ' + decision.coveragePercent + '%</p>';
    }
    if (decision.missingEvidence && decision.missingEvidence.length) {
      html += '<p class="meta">Missing</p><ul>';
      decision.missingEvidence.slice(0, 6).forEach(function (item) {
        html += '<li>' + item + '</li>';
      });
      html += '</ul>';
    }
    if (decision.readiness && decision.readiness.blockingReason) {
      html += '<p class="meta">' + decision.readiness.blockingReason + '</p>';
    }
    if (decision.readiness && decision.readiness.recommendedAction) {
      html += '<p class="meta">Recommendation: ' + decision.readiness.recommendedAction + '</p>';
    }
    const choices = decision.choices
      || (decision.actions || []).map(function (label) { return { label: label }; });
    if (choices && choices.length) {
      html += '<p class="meta">' + choices.map(function (row) {
        return typeof row === 'string' ? row : row.label;
      }).join(' · ') + '</p>';
    }
    $('operatorPanel').innerHTML = html;
  }

  function renderIntelligenceReport(artifact, pause) {
    if (!isComponentVisible('missionIntelligenceReport', workspaceMode)) {
      $('intelligencePanel').innerHTML = '';
      return;
    }
    if (!artifact || !artifact.rankedProspects) {
      $('intelligencePanel').innerHTML = '<h2>Mission Intelligence Report</h2><p>Awaiting Scout findings.</p>';
      return;
    }
    const count = artifact.qualifiedCount || artifact.rankedProspects.length;
    let html = '<h2>Mission Intelligence Report</h2>';
    html += '<p><strong>' + count + ' qualified prospect' + (count === 1 ? '' : 's') + '</strong></p>';
    if (artifact.summary) {
      html += '<p>' + artifact.summary + '</p>';
    }
    if (artifact.coverage || artifact.discoveryReport) {
      html += '<div class="discovery-section"><h3>Coverage</h3><ul>';
      const report = artifact.discoveryReport || {};
      const cov = artifact.coverage || {};
      const cities = (report.coverage && report.coverage.cities) ||
        (cov.cities ? cov.cities.searched + ' / ' + cov.cities.planned : '—');
      const concepts = (report.coverage && report.coverage.concepts) ||
        (cov.concepts ? cov.concepts.searched + ' / ' + cov.concepts.planned : '—');
      const sources = (report.coverage && report.coverage.sources) ||
        (cov.sources ? cov.sources.searched + ' / ' + cov.sources.planned : '—');
      html += '<li>Cities searched: ' + cities + '</li>';
      html += '<li>Concepts: ' + concepts + '</li>';
      html += '<li>Sources: ' + sources + '</li>';
      if (artifact.candidateUniverseCount != null) {
        html += '<li>Candidate Universe: ' + artifact.candidateUniverseCount + '</li>';
      }
      html += '<li>Qualified: ' + count + '</li>';
      if (artifact.confidence != null) {
        html += '<li>Confidence: ' + Number(artifact.confidence).toFixed(2) + '</li>';
      }
      html += '</ul>';
      if (artifact.discoveryStatus === 'incomplete') {
        html += '<p class="meta"><strong>Coverage Warning</strong> — Discovery incomplete.</p>';
        const warnings = (report.warnings || cov.warnings || []).slice(0, 3);
        if (warnings.length) {
          html += '<ul>';
          warnings.forEach(function (w) { html += '<li>' + w + '</li>'; });
          html += '</ul>';
        }
      }
      html += '</div>';
    }
    if (artifact.evidence && artifact.evidence.length) {
      html += '<div class="discovery-section"><h3>Evidence</h3><ul>';
      artifact.evidence.forEach(function (item) {
        html += '<li>' + item + '</li>';
      });
      html += '</ul></div>';
    }
    if (pause && pause.reason) {
      html += '<div class="discovery-section"><h3>Review Required</h3><p>' + pause.reason + '</p></div>';
    }
    $('intelligencePanel').innerHTML = html;
  }

  function renderList() {
    if (!missions.length) {
      $('listPanel').innerHTML = '<h2>Missions</h2><p>No acquisition missions yet. Max creates them. You can start one below.</p>';
      return;
    }
    $('listPanel').innerHTML = '<h2>Missions</h2>' + missions.map(function (row) {
      const active = row.id === selected ? ' active' : '';
      return '<div class="mission-row' + active + '" data-id="' + row.id + '">' +
        '<strong>' + (row.title || row.id) + '</strong> ' +
        pill(row.status, row.stage === 'prepare' ? 'warn' : 'ok') +
        '<div class="meta">' + row.id + ' · ' + (row.targetSegment || '') + ' · ' + (row.campaign || '') + '</div>' +
      '</div>';
    }).join('');
    $('listPanel').querySelectorAll('.mission-row').forEach(function (el) {
      el.addEventListener('click', function () {
        const id = el.getAttribute('data-id');
        const url = new URL(window.location.href);
        url.searchParams.set('mission', id);
        window.history.replaceState({}, '', url.toString());
        loadOne(id);
      });
    });
  }

  function renderDiscoveryArtifact(artifact) {
    if (!artifact || !artifact.rankedProspects) {
      $('discoveryPanel').innerHTML = '';
      return;
    }
    const count = artifact.qualifiedCount || artifact.rankedProspects.length;
    let html = '<h2>Scout Discovery</h2>';
    html += '<p><strong>Found ' + count + ' prospect' + (count === 1 ? '' : 's') + '</strong></p>';
    if (artifact.rankedProspects.length) {
      html += '<ol class="discovery-list">';
      artifact.rankedProspects.forEach(function (row) {
        html += '<li><span class="discovery-rank">' + row.rank + '.</span><strong>' + row.name + '</strong>';
        if (row.title) html += '<div class="meta">Role: ' + row.title + '</div>';
        html += '</li>';
      });
      html += '</ol>';
    }
    if (artifact.confidence != null) {
      html += '<div class="discovery-section"><h3>Confidence</h3><p>' + artifact.confidence.toFixed(2) + '</p></div>';
    }
    if (artifact.buyingSignals && artifact.buyingSignals.length) {
      html += '<div class="discovery-section"><h3>Buying Signals</h3><ul>';
      artifact.buyingSignals.forEach(function (signal) {
        html += '<li>' + signal + '</li>';
      });
      html += '</ul></div>';
    }
    $('discoveryPanel').innerHTML = html;
  }

  function renderExecutionPanel() {
    if (!isComponentVisible('executionWorkspace', workspaceMode)) return;
    const ws = snapshot && snapshot.workspace ? snapshot.workspace : {};
    const progression = snapshot && snapshot.progression ? snapshot.progression : {};
    const step = (progression.presentation && progression.presentation.split('\n')[0])
      || ws.status
      || 'Execution in progress';
    $('executionStep').innerHTML = '<strong>' + step + '</strong>';
  }

  function clearMissionPanels() {
    ['planPanel', 'intelligencePanel', 'operatorPanel', 'workspacePanel', 'discoveryPanel',
      'healthPanel', 'blockerPanel', 'timelinePanel', 'whyPanel', 'executionPanel'].forEach(function (id) {
      $(id).innerHTML = id === 'executionPanel'
        ? '<h2>Execution</h2><p class="meta">Current step</p><p id="executionStep"><strong>—</strong></p><div class="actions"><button id="advanceBtn">Advance stage</button></div>'
        : '';
    });
    if ($('advanceBtn')) {
      $('advanceBtn').addEventListener('click', onAdvance);
    }
  }

  function renderSnapshot() {
    if (!snapshot) return;
    const mission = snapshot.mission || {};
    const pending = snapshot.executableDecision || null;
    const pause = snapshot.progression && snapshot.progression.pause ? snapshot.progression.pause : null;
    renderMissionPlan(mission, pending);
    renderIntelligenceReport(snapshot.discoveryArtifact || null, pause);
    renderOperatorDecision(pending, pause);
    const ws = snapshot.workspace || {};
    const health = snapshot.health || {};
    const blocker = snapshot.blocker;
    const why = snapshot.why || {};
    $('workspacePanel').innerHTML =
      '<h2>Workspace</h2>' +
      '<p class="meta">Status</p><p><strong>' + (ws.status || '') + '</strong></p>' +
      '<div class="bar">' + (ws.bar || '') + ' ' + (ws.progressPercent || 0) + '%</div>' +
      (ws.specialists || []).map(function (row) {
        return pill((row.id + ': ' + row.label), specialistKind(row.state));
      }).join(' ');
    const healthKind = health.label === 'healthy' ? 'ok' : health.label === 'paused' ? 'danger' : 'warn';
    $('healthPanel').innerHTML =
      '<h2>Mission Health</h2>' +
      pill(health.status || '—', healthKind) +
      '<div class="grid" style="margin-top:0.75rem">' +
        '<div class="stat"><span class="meta">Confidence</span><strong>' + (health.confidence == null ? '—' : health.confidence) + '</strong></div>' +
        '<div class="stat"><span class="meta">Current blocker</span><strong>' + (health.currentBlocker || 'None') + '</strong></div>' +
        '<div class="stat"><span class="meta">Risk</span><strong>' + (health.risk || '—') + '</strong></div>' +
        '<div class="stat"><span class="meta">Capacity remaining</span><strong>' + (health.capacityRemaining == null ? '—' : health.capacityRemaining) + '</strong></div>' +
        '<div class="stat"><span class="meta">Replies</span><strong>' + (health.replies || 0) + '</strong></div>' +
        '<div class="stat"><span class="meta">Meetings</span><strong>' + (health.meetings || 0) + '</strong></div>' +
      '</div>' +
      (health.learning ? '<p style="margin-top:0.6rem">' + health.learning + '</p>' : '');
    $('blockerPanel').innerHTML = '<h2>Blockers</h2>' + (blocker
      ? '<p>' + pill(blocker.label, blocker.kind && blocker.kind.indexOf('paused') === 0 ? 'danger' : 'warn') + '</p><p>' + (blocker.reason || '') + '</p>'
      : '<p>No silent waits. This mission can proceed.</p>');
    $('timelinePanel').innerHTML = '<h2>Timeline</h2><div class="timeline">' +
      (snapshot.timeline || []).map(function (row) {
        return '<div>' + (row.clock || '') + ' &nbsp; ' + (row.label || '') + '</div>';
      }).join('') +
      '</div>';
    $('whyPanel').innerHTML = '<h2>Why is this mission here?</h2>' +
      (why.reasons || []).map(function (row) { return '<p>' + row + '</p>'; }).join('') +
      '<p class="meta">Confidence ' + (why.confidence == null ? '—' : why.confidence) + ' · evidence, not opinion</p>';
    renderDiscoveryArtifact(snapshot.discoveryArtifact || null);
    renderExecutionPanel();
  }

  function enterCreateMode() {
    selected = null;
    snapshot = null;
    applyWorkspaceMode(WORKSPACE_MODES.CREATE);
    clearMissionPanels();
    renderList();
    setMsg('');
  }

  async function loadList() {
    const body = await api('/api/v1/amo/missions');
    missions = body.missions || [];
    const urlMission = new URLSearchParams(window.location.search).get('mission');
    if (urlMission && missions.some(function (row) { return row.id === urlMission; })) {
      await loadOne(urlMission);
    } else {
      enterCreateMode();
    }
  }

  async function loadOne(id) {
    selected = id;
    try {
      snapshot = await api('/api/v1/amo/missions/' + encodeURIComponent(id));
      const ctx = snapshot.workspaceContext || {};
      applyWorkspaceMode(ctx.workspaceMode || WORKSPACE_MODES.MISSION_PLANNING);
      renderList();
      renderSnapshot();
      setMsg('Inspecting ' + id, 'ok');
    } catch (err) {
      snapshot = null;
      applyWorkspaceMode(WORKSPACE_MODES.MISSION_PLANNING);
      clearMissionPanels();
      setMsg(err.message || 'MISSION_STATE_INCONSISTENT', 'err');
    }
  }

  $('createBtn').addEventListener('click', async function () {
    try {
      setMsg('Creating…');
      const body = await api('/api/v1/amo/missions', {
        method: 'POST',
        body: JSON.stringify({
          objective: $('objective').value,
          targetSegment: $('segment').value,
          campaign: $('campaign').value,
          priority: 'high',
        }),
      });
      await loadList();
      const url = new URL(window.location.href);
      url.searchParams.set('mission', body.mission.id);
      window.history.replaceState({}, '', url.toString());
      await loadOne(body.mission.id);
      setMsg('Mission created', 'ok');
    } catch (err) {
      setMsg(err.message, 'err');
    }
  });

  async function onAdvance() {
    if (!selected) return setMsg('Select a mission first', 'err');
    try {
      await api('/api/v1/amo/missions/' + encodeURIComponent(selected) + '/progress', {
        method: 'POST',
        body: JSON.stringify({}),
      });
      await loadOne(selected);
      setMsg('Stage advanced', 'ok');
    } catch (err) {
      setMsg(err.message, 'err');
    }
  }

  $('advanceBtn').addEventListener('click', onAdvance);
  applyWorkspaceMode(WORKSPACE_MODES.CREATE);
  loadList().catch(function (err) { setMsg(err.message, 'err'); });
})();
</script>
</body>
</html>
