<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#10203c">
<title>AO Accounts — PulseForge</title>
<link rel="icon" href="/favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared/tokens.css">
<link rel="stylesheet" href="/shared/shell.css">
<script src="/shared/aoShellNav.js" defer></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  max-width: 720px;
  margin: 0 auto;
  background: var(--pf-bg);
  color: var(--pf-text);
  font-family: var(--pf-font-body);
  min-height: 100vh;
  padding-bottom: 72px;
}
.hdr {
  background: var(--pf-nav-bg);
  color: var(--pf-nav-text);
  padding: 14px 16px;
  border-bottom: 2px solid var(--pf-gold);
  position: sticky;
  top: 0;
  z-index: 5;
}
.hdr h1 {
  font-family: var(--pf-font-display);
  letter-spacing: 2px;
  font-size: 1.5rem;
}
.hdr-sub {
  font-family: var(--pf-font-mono);
  font-size: 0.58rem;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--pf-nav-muted);
  margin-top: 4px;
}
.hdr-nav { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.hdr-nav a {
  font-family: var(--pf-font-mono);
  font-size: 0.55rem;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--pf-nav-muted);
  text-decoration: none;
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 6px;
  padding: 6px 8px;
}
.tabs {
  display: flex;
  overflow-x: auto;
  gap: 4px;
  padding: 8px 12px;
  background: var(--pf-bg-raised);
  border-bottom: 1px solid var(--pf-border);
}
.tab {
  flex-shrink: 0;
  border: none;
  background: transparent;
  font-family: var(--pf-font-mono);
  font-size: 0.55rem;
  text-transform: uppercase;
  letter-spacing: 1px;
  padding: 8px 10px;
  color: var(--pf-text-muted);
  border-bottom: 2px solid transparent;
  cursor: pointer;
}
.tab.active { color: var(--pf-navy); border-bottom-color: var(--pf-gold); font-weight: 600; }
.panel { display: none; padding: 12px 16px; }
.panel.active { display: block; }
.row {
  border: 1px solid var(--pf-border);
  border-radius: 10px;
  padding: 12px;
  margin-bottom: 10px;
  background: var(--pf-surface);
}
.row-name { font-weight: 600; font-size: 0.95rem; }
.row-meta {
  font-family: var(--pf-font-mono);
  font-size: 0.58rem;
  color: var(--pf-text-muted);
  margin-top: 4px;
  line-height: 1.45;
}
.row-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.btn {
  font-family: var(--pf-font-mono);
  font-size: 0.55rem;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  border: 1px solid var(--pf-border);
  background: var(--pf-bg);
  border-radius: 6px;
  padding: 8px 10px;
  cursor: pointer;
}
.btn.primary { background: var(--pf-navy); color: #fff; border-color: var(--pf-navy); }
.empty {
  border: 1px dashed var(--pf-border);
  border-radius: 8px;
  padding: 16px;
  color: var(--pf-text-muted);
  font-size: 0.85rem;
}
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  display: none;
  align-items: flex-end;
  justify-content: center;
  z-index: 20;
  padding: 12px;
}
.modal-backdrop.open { display: flex; }
.modal-backdrop.brief-modal {
  z-index: 300;
  align-items: stretch;
  justify-content: stretch;
  padding: 0;
  overflow: hidden;
}
.modal {
  background: var(--pf-surface);
  width: 100%;
  max-width: 720px;
  max-height: 90vh;
  overflow: auto;
  border-radius: 12px 12px 0 0;
  padding: 16px;
}
.brief-panel {
  position: absolute;
  top: 16px;
  left: 16px;
  right: 16px;
  bottom: max(16px, env(safe-area-inset-bottom, 0px));
  max-width: 720px;
  margin: 0 auto;
  background: var(--pf-surface);
  border-radius: 12px;
  padding: 16px;
  overflow-x: hidden;
  overflow-y: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
}
.brief-section-body {
  border: 1px solid var(--pf-border);
  border-radius: 8px;
  padding: 10px;
  background: var(--pf-bg);
  font-size: 0.85rem;
  white-space: pre-wrap;
  line-height: 1.45;
}
html.modal-open,
body.modal-open {
  overflow: hidden;
  height: 100%;
}
body.modal-open {
  position: fixed;
  width: 100%;
  left: 0;
  right: 0;
}
.field { margin-bottom: 12px; }
.field label {
  display: block;
  font-family: var(--pf-font-mono);
  font-size: 0.58rem;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--pf-text-muted);
  margin-bottom: 4px;
}
.field select, .field input, .field textarea {
  width: 100%;
  padding: 10px;
  border: 1px solid var(--pf-border);
  border-radius: 6px;
  font-size: 0.9rem;
  background: var(--pf-bg);
  color: var(--pf-text);
}
.field textarea { min-height: 72px; resize: vertical; }
.detail-block { margin-bottom: 16px; }
.detail-block h3 {
  font-family: var(--pf-font-mono);
  font-size: 0.62rem;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--pf-text-muted);
  margin-bottom: 8px;
}
.hist-item {
  border-left: 2px solid var(--pf-border);
  padding: 8px 0 8px 10px;
  margin-bottom: 8px;
  font-size: 0.85rem;
}
.draft-box {
  border: 1px solid var(--pf-border);
  border-radius: 8px;
  padding: 10px;
  background: var(--pf-bg);
  font-size: 0.85rem;
  white-space: pre-wrap;
  line-height: 1.45;
  max-height: 220px;
  overflow: auto;
}
.tag {
  display: inline-block;
  font-family: var(--pf-font-mono);
  font-size: 0.52rem;
  text-transform: uppercase;
  letter-spacing: 0.6px;
  padding: 3px 6px;
  border-radius: 4px;
  background: rgba(201, 162, 39, 0.15);
  color: var(--pf-navy);
  margin-right: 6px;
}
.warn {
  color: #b45309;
  font-size: 0.82rem;
  margin: 6px 0;
}
</style>
</head>
<body>
<header class="hdr">
  <h1>My Accounts</h1>
  <div class="hdr-sub">Durable AO CRM — queue is derived from account state</div>
</header>

<div class="tabs" id="tabs"></div>
<div id="panels"></div>

<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal" id="modal"></div>
</div>

<script>
const SECTION_KEYS = [
  ['today_queue', 'Today\'s Queue'],
  ['my_accounts', 'My Accounts'],
  ['overdue', 'Overdue'],
  ['needs_help', 'Needs Help'],
  ['warm_active', 'Warm / Active'],
  ['recently_updated', 'Recently Updated'],
];

let state = {
  data: null,
  activeTab: 'today_queue',
  outcomes: [],
  nextActions: [],
  followupDraft: null,
  followupProspectId: null,
  flagReasons: [],
};

async function api(path, options = {}) {
  const res = await fetch(path, {
    credentials: 'same-origin',
    headers: { 'content-type': 'application/json', ...(options.headers || {}) },
    ...options,
  });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error || `Request failed (${res.status})`);
  return body;
}

function fmtDate(v) {
  if (!v) return '—';
  return new Date(v).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
}

function renderTabs() {
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = SECTION_KEYS.map(([key, label]) => {
    const count = state.data?.sections?.[key]?.length ?? 0;
    return `<button class="tab ${state.activeTab === key ? 'active' : ''}" data-tab="${key}">${label} (${count})</button>`;
  }).join('');
}

function showFollowUpEntry(item) {
  const na = item.next_action || '';
  return na === 'follow_up' || na === 'email' || na === 'send_information';
}

function renderRow(item) {
  return `
    <div class="row" data-prospect="${item.prospect_id}">
      <div class="row-name">${item.company_name}</div>
      <div class="row-meta">
        ${item.current_status?.replace(/_/g, ' ') || '—'}
        · ${item.priority || 'normal'}
        ${item.help_requested ? ' · <strong>Help</strong>' : ''}
      </div>
      ${item.recommended_angle ? `<div class="row-meta">${item.recommended_angle}</div>` : ''}
      <div class="row-meta">
        Last touch: ${fmtDate(item.last_touch_at)}
        · Next: ${item.next_action || '—'} ${item.next_action_date ? `(due ${item.next_action_date})` : ''}
      </div>
      ${item.latest_note_preview ? `<div class="row-meta">"${item.latest_note_preview.slice(0, 120)}"</div>` : ''}
      <div class="row-actions">
        <button class="btn" data-action="detail" data-prospect="${item.prospect_id}">Open</button>
        <button class="btn" data-action="brief" data-prospect="${item.prospect_id}">Brief me</button>
        <button class="btn primary" data-action="outcome" data-prospect="${item.prospect_id}" data-task="${item.open_task_id || ''}">Log outcome</button>
        ${showFollowUpEntry(item) ? `<button class="btn" data-action="followup" data-prospect="${item.prospect_id}">Draft Follow-Up</button>` : ''}
        <button class="btn" data-action="flag-jake" data-prospect="${item.prospect_id}">Flag for Jake</button>
      </div>
    </div>
  `;
}

function renderPanels() {
  const panels = document.getElementById('panels');
  panels.innerHTML = SECTION_KEYS.map(([key]) => {
    const items = state.data?.sections?.[key] || [];
    return `
      <div class="panel ${state.activeTab === key ? 'active' : ''}" id="panel-${key}">
        ${items.length ? items.map(renderRow).join('') : '<div class="empty">Nothing in this section right now.</div>'}
      </div>
    `;
  }).join('');
}

let modalScrollLockY = 0;

function openModalBackdrop({ brief = false } = {}) {
  modalScrollLockY = window.scrollY || 0;
  document.body.style.top = `-${modalScrollLockY}px`;
  document.documentElement.classList.add('modal-open');
  document.body.classList.add('modal-open');
  const backdrop = document.getElementById('modal-backdrop');
  backdrop.classList.toggle('brief-modal', brief);
  backdrop.classList.add('open');
}

function resetBriefScrollPanel(panel) {
  if (!panel) return;
  const reset = () => { panel.scrollTop = 0; };
  reset();
  requestAnimationFrame(() => {
    reset();
    requestAnimationFrame(reset);
  });
}

function closeModal() {
  const backdrop = document.getElementById('modal-backdrop');
  const modalEl = document.getElementById('modal');
  backdrop.classList.remove('open', 'brief-modal');
  modalEl.className = 'modal';
  modalEl.scrollTop = 0;
  modalEl.innerHTML = '';
  document.documentElement.classList.remove('modal-open');
  document.body.classList.remove('modal-open');
  document.body.style.top = '';
  window.scrollTo(0, modalScrollLockY);
  state.followupDraft = null;
  state.followupProspectId = null;
}

async function copyText(text) {
  if (!text) return;
  await navigator.clipboard.writeText(text);
}

function renderFollowUpResults(draft) {
  const warnings = (draft.warnings || []).map(w => `<div class="warn">${w}</div>`).join('');
  const checks = draft.doctrineChecks || {};
  const checkTags = Object.entries(checks).map(([k, ok]) =>
    `<span class="tag">${ok ? '✓' : '!'} ${k.replace(/([A-Z])/g, ' $1').trim()}</span>`
  ).join('');
  return `
    <div class="detail-block"><h3>Recommended angle</h3><div class="row-meta">${draft.recommendedFollowUpAngle || '—'}</div></div>
    <div class="detail-block"><h3>Approval</h3>
      <div class="row-meta">${draft.approvalPath}${draft.approvalReason ? ' — ' + draft.approvalReason : ''}</div>
      <div style="margin-top:6px;">${checkTags}</div>
      ${warnings}
    </div>
    ${draft.subjectLine ? `<div class="detail-block"><h3>Subject</h3><div class="draft-box" id="draft-subject">${draft.subjectLine}</div></div>` : ''}
    ${draft.emailDraft ? `<div class="detail-block"><h3>Email draft</h3><div class="draft-box" id="draft-email">${draft.emailDraft}</div></div>` : ''}
    ${draft.alternateShortNote ? `<div class="detail-block"><h3>Short note</h3><div class="draft-box" id="draft-short">${draft.alternateShortNote}</div></div>` : ''}
    <div class="detail-block"><h3>Next action after send</h3><div class="row-meta">${draft.nextActionAfterSend || '—'}</div></div>
    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;">
      ${draft.emailDraft ? '<button class="btn" id="copy-email">Copy email</button>' : ''}
      ${draft.alternateShortNote ? '<button class="btn" id="copy-short">Copy short note</button>' : ''}
      <button class="btn primary" id="save-followup-draft">Save draft to CRM</button>
      <button class="btn" id="flag-jake-review">Mark Jake review needed</button>
      <button class="btn" id="cancel-followup">Close</button>
    </div>
  `;
}

async function openFollowUpModal(prospectId, seedNotes = '') {
  state.followupProspectId = prospectId;
  let detail = null;
  try {
    detail = await api(`/ao/api/crm/accounts/${prospectId}`);
  } catch (_err) {
    detail = null;
  }
  document.getElementById('modal').innerHTML = `
    <h2 style="font-family:var(--pf-font-display);letter-spacing:1px;margin-bottom:8px;">Draft Follow-Up</h2>
    <p style="font-size:0.85rem;color:var(--pf-text-muted);margin-bottom:12px;">Review context, add notes, then generate a diagnose-first draft. Nothing is sent automatically.</p>
    ${detail ? `<div class="row-meta" style="margin-bottom:12px;">${detail.summary.company_name} · ${detail.contact.name || 'No contact'} · ${detail.sales_state.next_action || '—'}</div>` : ''}
    <div class="field"><label>AO notes for composer</label><textarea id="followup-notes" placeholder="What did you learn in the field?">${seedNotes || detail?.history?.[0]?.notes || ''}</textarea></div>
    <div class="field"><label>Contact name (optional override)</label><input id="followup-contact-name" value="${detail?.contact?.name || ''}"></div>
    <div class="field"><label>Contact email (optional override)</label><input id="followup-contact-email" value="${detail?.contact?.email || ''}"></div>
    <div style="display:flex;gap:8px;margin-bottom:12px;">
      <button class="btn primary" id="generate-followup">Generate draft</button>
      <button class="btn" id="cancel-followup">Cancel</button>
    </div>
    <div id="followup-results"></div>
  `;
  openModalBackdrop();
  document.getElementById('cancel-followup').onclick = closeModal;
  document.getElementById('generate-followup').onclick = async () => {
    try {
      const result = await api(`/ao/api/crm/accounts/${prospectId}/followup/draft`, {
        method: 'POST',
        body: JSON.stringify({
          aoNotes: document.getElementById('followup-notes').value,
          contactName: document.getElementById('followup-contact-name').value || undefined,
          contactEmail: document.getElementById('followup-contact-email').value || undefined,
          recommendedNextAction: detail?.sales_state?.next_action,
        }),
      });
      state.followupDraft = result.draft;
      state.followupInputSnapshot = result.input_snapshot;
      document.getElementById('followup-results').innerHTML = renderFollowUpResults(result.draft);
      bindFollowUpResultActions(prospectId);
    } catch (err) {
      alert(err.message);
    }
  };
}

function bindFollowUpResultActions(prospectId) {
  const draft = state.followupDraft;
  const copyEmail = document.getElementById('copy-email');
  const copyShort = document.getElementById('copy-short');
  if (copyEmail) copyEmail.onclick = () => copyText(draft.emailDraft).then(() => alert('Email copied'));
  if (copyShort) copyShort.onclick = () => copyText(draft.alternateShortNote).then(() => alert('Short note copied'));
  document.getElementById('save-followup-draft').onclick = async () => {
    try {
      await api(`/ao/api/crm/accounts/${prospectId}/followup/save`, {
        method: 'POST',
        body: JSON.stringify({
          draft: state.followupDraft,
          input_snapshot: state.followupInputSnapshot,
        }),
      });
      alert('Draft saved to account history.');
      closeModal();
      await loadDashboard();
    } catch (err) {
      alert(err.message);
    }
  };
  document.getElementById('flag-jake-review').onclick = async () => {
    try {
      await api(`/ao/api/crm/accounts/${prospectId}/followup/save`, {
        method: 'POST',
        body: JSON.stringify({
          draft: state.followupDraft,
          input_snapshot: state.followupInputSnapshot,
          flag_jake_review: true,
        }),
      });
      alert('Draft saved and Jake review flagged.');
      closeModal();
      await loadDashboard();
    } catch (err) {
      alert(err.message);
    }
  };
  document.getElementById('cancel-followup')?.addEventListener('click', closeModal);
}

function openOutcomeModal(prospectId, taskId) {
  const outcomes = state.outcomes.length ? state.outcomes : [];
  const nextActions = state.nextActions.length ? state.nextActions : [
    'call','follow_up','visit','email','ask_jake','book_walkthrough','send_information','check_back_later','disqualify','no_action'
  ];
  document.getElementById('modal').innerHTML = `
    <h2 style="font-family:var(--pf-font-display);letter-spacing:1px;margin-bottom:12px;">What happened?</h2>
    <p style="font-size:0.85rem;color:var(--pf-text-muted);margin-bottom:12px;">Completing an action updates the account, writes history, and removes it from today's queue — the account stays in My Accounts.</p>
    <div class="field"><label>Outcome *</label>
      <select id="outcome">${outcomes.map(o => `<option value="${o.value}">${o.label}</option>`).join('')}</select>
    </div>
    <div class="field"><label>Notes *</label><textarea id="notes" placeholder="What happened on the call or visit?"></textarea></div>
    <div class="field"><label>Next action *</label>
      <select id="next-action">${nextActions.map(a => `<option value="${a}">${a.replace(/_/g, ' ')}</option>`).join('')}</select>
    </div>
    <div class="field"><label>Next action date *</label><input id="next-date" type="date"></div>
    <div class="field"><label>Help needed?</label>
      <select id="help-needed"><option value="false">No</option><option value="true">Yes — ask Jake</option></select>
    </div>
    <div class="field"><label>Help reason (if yes)</label><input id="help-reason" placeholder="Optional"></div>
    <div class="field"><label>Contact name (optional)</label><input id="contact-name"></div>
    <div class="field"><label>Contact role (optional)</label><input id="contact-role"></div>
    <div style="display:flex;gap:8px;margin-top:8px;">
      <button class="btn primary" id="save-outcome">Save &amp; update account</button>
      <button class="btn" id="cancel-outcome">Cancel</button>
    </div>
  `;
  openModalBackdrop();
  document.getElementById('cancel-outcome').onclick = closeModal;
  document.getElementById('save-outcome').onclick = async () => {
    try {
      const notes = document.getElementById('notes').value;
      await api(`/ao/api/crm/accounts/${prospectId}/outcome`, {
        method: 'POST',
        body: JSON.stringify({
          outcome: document.getElementById('outcome').value,
          notes,
          next_action: document.getElementById('next-action').value,
          next_action_date: document.getElementById('next-date').value,
          help_needed: document.getElementById('help-needed').value === 'true',
          help_reason: document.getElementById('help-reason').value || undefined,
          task_id: taskId || undefined,
          contact_name: document.getElementById('contact-name').value || undefined,
          contact_role: document.getElementById('contact-role').value || undefined,
        }),
      });
      closeModal();
      await loadDashboard();
      if (notes.trim().length >= 20 && confirm('Generate follow-up from this update?')) {
        await openFollowUpModal(prospectId, notes);
      }
    } catch (err) {
      alert(err.message);
    }
  };
}

function renderBriefSections(sections, fallbackText) {
  if (!sections) {
    return `<div class="brief-section-body" data-brief-first-block data-brief-last-block>${(fallbackText || '').replace(/</g, '&lt;')}</div>`;
  }
  const blocks = [
    ['Where this stands', sections.where_this_stands || sections.why_this_account_matters],
    ['Why this is the next move', sections.why_this_next || sections.likely_angle],
    ['Known context', sections.known_context || sections.what_we_know],
    ['Next action', sections.next_action || sections.suggested_next_move],
    ['What to listen for', sections.what_to_listen_for || sections.what_to_watch_for],
    ['Short talk track', sections.short_talk_track],
  ];
  return blocks.map(([title, body], index) => `
    <div class="detail-block brief-block"${index === 0 ? ' data-brief-first-block' : ''}${index === blocks.length - 1 ? ' data-brief-last-block' : ''}>
      <h3>${title}</h3>
      <div class="brief-section-body">${String(body || '—').replace(/</g, '&lt;')}</div>
    </div>
  `).join('');
}

async function openBriefModal(prospectId) {
  const modalEl = document.getElementById('modal');
  modalEl.className = 'brief-panel';
  modalEl.innerHTML = `
    <h2 style="font-family:var(--pf-font-display);letter-spacing:1px;">Brief me</h2>
    <p class="row-meta" style="margin:8px 0 12px;">Loading Max brief…</p>
    <button class="btn" id="brief-close">Close</button>
  `;
  openModalBackdrop({ brief: true });
  resetBriefScrollPanel(modalEl);
  document.getElementById('brief-close').onclick = closeModal;
  try {
    const result = await api('/ao/api/max/prospect-brief', {
      method: 'POST',
      body: JSON.stringify({
        prospect_id: prospectId,
        source: 'crm_card_brief_button',
      }),
    });
    const title = result.brief_sections?.account_name || result.business_name || 'Account brief';
    modalEl.innerHTML = `
      <h2 style="font-family:var(--pf-font-display);letter-spacing:1px;">${title}</h2>
      ${renderBriefSections(result.brief_sections, result.brief || result.reply)}
      <div style="display:flex;gap:8px;margin-top:12px;">
        <button class="btn primary" id="brief-close">Close</button>
      </div>
    `;
    resetBriefScrollPanel(modalEl);
    document.getElementById('brief-close').onclick = closeModal;
  } catch (err) {
    modalEl.innerHTML = `
      <h2>Brief failed</h2><p class="warn">${err.message}</p>
      <button class="btn" id="brief-close">Close</button>
    `;
    resetBriefScrollPanel(modalEl);
    document.getElementById('brief-close').onclick = closeModal;
  }
}

async function openFlagForJakeModal(prospectId) {
  const reasons = state.flagReasons.length ? state.flagReasons : [
    { value: 'pricing_or_scope', label: 'Pricing or scope question' },
    { value: 'decision_maker_block', label: 'Can\'t reach decision-maker' },
    { value: 'incumbent_vendor', label: 'Incumbent vendor in the way' },
    { value: 'walkthrough_or_proposal', label: 'Walkthrough or proposal help' },
    { value: 'account_intel_gap', label: 'Missing account intel' },
    { value: 'other', label: 'Something else' },
  ];
  document.getElementById('modal').innerHTML = `
    <h2 style="font-family:var(--pf-font-display);letter-spacing:1px;margin-bottom:8px;">Flag for Jake</h2>
    <p style="font-size:0.85rem;color:var(--pf-text-muted);margin-bottom:12px;">Jake'll see this on today's operator brief with a suggested next move.</p>
    <div class="field"><label>Reason *</label>
      <select id="flag-reason">${reasons.map(r => `<option value="${r.value}">${r.label}</option>`).join('')}</select>
    </div>
    <div class="field"><label>Note</label><textarea id="flag-note" placeholder="What do you need from Jake?"></textarea></div>
    <div style="display:flex;gap:8px;">
      <button class="btn primary" id="save-flag">Send flag</button>
      <button class="btn" id="cancel-flag">Cancel</button>
    </div>
  `;
  openModalBackdrop();
  document.getElementById('cancel-flag').onclick = closeModal;
  document.getElementById('save-flag').onclick = async () => {
    try {
      await api(`/ao/api/crm/accounts/${prospectId}/flag-for-jake`, {
        method: 'POST',
        body: JSON.stringify({
          reason: document.getElementById('flag-reason').value,
          note: document.getElementById('flag-note').value,
        }),
      });
      alert('Flagged for Jake.');
      closeModal();
      await loadDashboard();
    } catch (err) {
      alert(err.message);
    }
  };
}

async function showDetail(prospectId) {
  const detail = await api(`/ao/api/crm/accounts/${prospectId}`);
  const s = detail.summary;
  const sales = detail.sales_state;
  document.getElementById('modal').innerHTML = `
    <h2 style="font-family:var(--pf-font-display);letter-spacing:1px;">${s.company_name}</h2>
    <div class="detail-block"><h3>Account summary</h3>
      <div class="row-meta">${s.website || ''} ${s.address ? '· ' + s.address : ''}</div>
      <div class="row-meta">${s.icp_category || ''} · ${s.ao_owner || 'Unassigned'}</div>
      <div class="row-meta">${s.recommended_angle || ''}</div>
      <div class="row-meta">${s.why_account_matters || ''}</div>
    </div>
    <div class="detail-block"><h3>Sales state</h3>
      <div class="row-meta">Status: ${sales.current_status} · Stage: ${sales.opportunity_stage || '—'}</div>
      <div class="row-meta">Next: ${sales.next_action || '—'} ${sales.next_action_date ? '(due ' + sales.next_action_date + ')' : ''}</div>
      <div class="row-meta">Last: ${sales.last_outcome || '—'} · ${fmtDate(sales.last_touch_at)}</div>
    </div>
    <div class="detail-block"><h3>History</h3>
      ${detail.history.length ? detail.history.map(h => `
        <div class="hist-item">
          <div><strong>${h.activity_type || h.kind}</strong> · ${fmtDate(h.created_at)}</div>
          ${h.notes ? `<div>${h.notes}</div>` : ''}
        </div>
      `).join('') : '<div class="empty">No activity yet.</div>'}
    </div>
    <button class="btn" data-action="brief" data-prospect="${prospectId}">Brief me</button>
    <button class="btn" data-action="followup" data-prospect="${prospectId}">Draft Follow-Up</button>
    <button class="btn" data-action="flag-jake" data-prospect="${prospectId}">Flag for Jake</button>
    <button class="btn primary" data-action="outcome" data-prospect="${prospectId}">Log outcome</button>
    <button class="btn" id="detail-close" style="margin-left:8px;">Close</button>
  `;
  openModalBackdrop();
  document.getElementById('detail-close').onclick = closeModal;
}

async function loadDashboard() {
  state.data = await api('/ao/api/crm/dashboard');
  state.outcomes = state.data.outcomes || [];
  renderTabs();
  renderPanels();
}

document.getElementById('tabs').addEventListener('click', (e) => {
  const tab = e.target.closest('[data-tab]');
  if (!tab) return;
  state.activeTab = tab.dataset.tab;
  renderTabs();
  renderPanels();
});

document.body.addEventListener('click', async (e) => {
  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  if (btn.dataset.action === 'detail') {
    try { await showDetail(btn.dataset.prospect); } catch (err) { alert(err.message); }
  }
  if (btn.dataset.action === 'outcome') {
    openOutcomeModal(btn.dataset.prospect, btn.dataset.task);
  }
  if (btn.dataset.action === 'followup') {
    try { await openFollowUpModal(btn.dataset.prospect); } catch (err) { alert(err.message); }
  }
  if (btn.dataset.action === 'brief') {
    try { await openBriefModal(btn.dataset.prospect); } catch (err) { alert(err.message); }
  }
  if (btn.dataset.action === 'flag-jake') {
    try { await openFlagForJakeModal(btn.dataset.prospect); } catch (err) { alert(err.message); }
  }
});

document.getElementById('modal-backdrop').addEventListener('click', (e) => {
  if (e.target.id === 'modal-backdrop') closeModal();
});

loadDashboard().then(() => {
  const hash = (location.hash || '').replace(/^#/, '');
  if (hash.startsWith('followup-')) {
    const prospectId = hash.slice('followup-'.length);
    if (prospectId) openFollowUpModal(prospectId).catch(err => alert(err.message));
    history.replaceState(null, '', location.pathname);
  }
}).catch(err => {
  document.getElementById('panels').innerHTML = `<div class="empty">${err.message}</div>`;
});
</script>
</body>
</html>
